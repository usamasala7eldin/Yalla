<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Orders</title>
<script src="qrcode.js?v=3"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #1f6feb; --green: #1a7f37; --red: #b42318; --red-bg: #fde3e1; --orange: #c2410c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }

  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.big { font-size: 16px; padding: 12px 22px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--muted); }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; }
  .unsaved { color: var(--orange); font-size: 11px; font-weight: 700; margin-left: 4px; }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: 10px; }
  .empty p { margin: 0 0 14px; }
  .row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Order cards */
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .ocard { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { border: 1.5px solid; background: #fff; border-radius: 16px; padding: 3px 12px; font-size: 12px; font-weight: 600; }
  .ocard-body { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .paste { width: 120px; height: 46px; resize: none; border: 1px dashed #9aa3b5; border-radius: 8px; padding: 4px 6px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.7); overflow: hidden; }
  .field { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: #fff; }
  .field.name { width: 160px; }
  .field.item { width: 220px; }
  select.field { max-width: 200px; }
  .order-no { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: #fff; padding: 4px 10px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .qr-btn { border: 0; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #fff; background: var(--accent); white-space: nowrap; }
  .qr-btn.second { background: #1a8f4c; }
  .spacer { flex: 1 1 auto; }
  .remove { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 2px 6px; }
  .remove:hover { color: var(--red); }
  .err-line { color: var(--red); font-size: 12px; margin-top: 6px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 1000; }
  .toast.show { opacity: 1; }

  dialog { border: 0; border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); box-shadow: 0 10px 40px rgba(0,0,0,.25); color: var(--text); }
  dialog.narrow { width: min(380px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(20,25,35,.45); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 1; }
  .dlg-head h2 { font-size: 16px; margin: 0; flex: 1; }
  .dlg-body { padding: 12px 16px 16px; }
  .help { color: var(--muted); font-size: 12px; margin: 6px 0; }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
  #qrBox { display: flex; justify-content: center; margin: 12px 0; }
  #qrBox img { width: 260px; height: 260px; image-rendering: pixelated; }
  .qr-text { white-space: pre-wrap; background: #f6f7f9; border-radius: 8px; padding: 8px; font-size: 12px; text-align: start; }

  /* Settings form (dialog and phone) */
  .sf h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .sf textarea, .sf input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .sf label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-edit { border: 2px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
  .type-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .type-head input[type=text] { flex: 1; }
  .type-head input[type=color] { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: #fff; }
  .vars { position: sticky; top: 49px; background: #fff; padding: 6px 0; z-index: 1; }
  .vars button { border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 14px; padding: 2px 10px; font-size: 12px; }

  #phoneMode { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap" id="main">
  <header>
    <h1 data-i18n="appTitle"></h1>
    <button class="btn" id="btnClear" data-i18n="clearCards"></button>
    <button class="btn" id="btnExport"><span data-i18n="exportSettings"></span><span class="unsaved" id="unsavedMark" hidden></span></button>
    <button class="btn" id="btnImport" data-i18n="importSettings"></button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
    <button class="icon-btn" id="btnSettings" data-i18n-title="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="empty" id="setup" hidden>
    <p data-i18n="noSettings"></p>
    <div class="row-flex" style="justify-content:center">
      <button class="btn primary big" id="btnCreate" data-i18n="createSettings"></button>
      <button class="btn big" id="btnImport2" data-i18n="importSettings"></button>
    </div>
  </div>

  <div class="cards" id="cards"></div>
</div>

<!-- Phone mode: opened from the QR in "Edit on phone" -->
<div id="phoneMode" hidden>
  <h2 data-i18n="phoneTitle" style="font-size:18px"></h2>
  <p class="msg" id="pmStatus"></p>
  <div class="sf" id="pmForm"></div>
  <button class="btn primary big" id="pmSend" data-i18n="phoneSend" hidden style="width:100%;margin-top:10px"></button>
</div>

<div class="toast" id="toast"></div>

<!-- QR dialog -->
<dialog id="dlgQr" class="narrow">
  <div class="dlg-head"><h2 id="qrTitle" dir="auto"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body" style="text-align:center">
    <div id="qrBox"></div>
    <div class="qr-text" id="qrText" dir="auto"></div>
  </div>
</dialog>

<!-- Settings dialog -->
<dialog id="dlgSettings">
  <div class="dlg-head"><h2 data-i18n="settings"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body">
    <div class="sf" id="settingsForm"></div>
    <div class="row-flex" style="margin-top:10px">
      <button class="btn primary" id="btnSaveSettings" data-i18n="save"></button>
      <button class="btn" id="btnPhoneEdit" data-i18n="phoneEdit"></button>
      <span class="msg" id="settingsMsg"></span>
    </div>
  </div>
</dialog>

<!-- Edit settings on phone -->
<dialog id="dlgPhone" class="narrow">
  <div class="dlg-head"><h2 data-i18n="phoneEdit"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body" style="text-align:center">
    <div id="phoneWait">
      <p class="help" data-i18n="phoneHelp"></p>
      <div id="phoneQr" style="display:flex;justify-content:center;margin:10px 0"></div>
      <p class="help"><span data-i18n="phoneExpires"></span> <b id="phoneTimer">5:00</b></p>
    </div>
    <p class="msg" id="phoneStatus"></p>
    <div id="phonePreview" class="qr-text" style="max-height:340px;overflow:auto" hidden></div>
    <div class="row-flex" style="justify-content:center;margin-top:10px">
      <button class="btn primary" id="btnPhoneUse" data-i18n="phoneUse" disabled></button>
    </div>
    <p class="help" data-i18n="phonePrivacy"></p>
  </div>
</dialog>

<script>
/* ===================== Configuration ===================== */
const SETTINGS_KEY = 'onlineOrders.settings.v1';
const CARDS_KEY = 'onlineOrders.cards.v1'; // sessionStorage: survives a refresh, gone when the tab closes
const EXPORT_NAME = 'online offers settings';
const MAX_TYPES = 5;
const SHORT_MIN_CHARS = 10; // short item name: first words until at least this many characters
const VARS = { name: '{name}', order: '{order}', item: '{item}' };

// Starting texts for a new pharmacy. Everything is editable in Settings.
const DEFAULT_SETTINGS = {
  welcomeAr: 'السلام عليكم\nمع حضرتك صيدلية النهدي (عنوان الصيدلية)\n(رابط موقع الصيدلية على Google Maps)',
  welcomeEn: 'Hello,\nThis is Nahdi Pharmacy (pharmacy address)\n(pharmacy Google Maps link)',
  types: [
    { id: 't1', title: 'آخر موعد للاستلام اليوم', color: '#d97706',
      ar: 'أ/ {name}\nيوجد لحضرتك داخل الفرع☝️ طلب أونلاين بـ {item}\nوآخر موعد لاستلامه اليوم.',
      en: 'Mr./Ms. {name}\nYou have an online order ({item}) at our branch☝️\nToday is the last day to pick it up.' },
    { id: 't2', title: 'صنف غير متوفر', color: '#dc2626',
      ar: 'أ/ {name}\nنعتذر من حضرتك، الصنف {item} في طلبك الأونلاين رقم {order} غير متوفر حاليًا بالفرع.',
      en: 'Mr./Ms. {name}\nWe are sorry, {item} in your online order {order} is currently not available at our branch.' },
    { id: 't3', title: 'طلب متوفر جزئيًا', color: '#2563eb',
      ar: 'أ/ {name}\nطلبك الأونلاين رقم {order} متوفر جزئيًا بالفرع، والصنف {item} غير متوفر حاليًا.\nهل تود استلام المتوفر؟',
      en: 'Mr./Ms. {name}\nYour online order {order} is partly available at our branch; {item} is currently not available.\nWould you like to pick up the available items?' }
  ]
};

/* ===================== Localisation ===================== */
const I18N = {
  en: {
    appTitle: 'Online Orders', settings: 'Settings',
    exportSettings: 'Export settings', importSettings: 'Import settings', clearCards: 'Clear all',
    noSettings: 'No settings in this browser. Create the pharmacy settings, or import your settings file.',
    createSettings: 'Create settings',
    pastePh: 'Paste the order here', namePh: 'Name', itemPh: 'Item',
    short: 'Short', long: 'Long', langAr: 'عربي', langEn: 'English',
    qrWelcome: 'Welcome QR', qrMessage: 'Message QR', removeCard: 'Remove this card',
    chooseType: 'Choose a message type first.', noPhone: 'No mobile number found. Open the order, press Ctrl+A then Ctrl+C, and paste again.',
    noItems: 'No items',
    welcomeSection: 'Welcome message', arabic: 'Arabic', english: 'English',
    typesSection: 'Message types (up to {n})', typeTitlePh: 'Title (shown on the cards)',
    addType: '+ Add message type', deleteType: 'Delete',
    insert: 'Insert:', varName: 'Name', varOrder: 'Order no.', varItem: 'Item',
    varsHelp: 'Click inside a message, then a button to insert it there.',
    save: 'Save', saved: 'Saved', titleRequired: 'Every message type needs a title.', needOneType: 'Add at least one message type.',
    importDone: 'Settings imported.', importFail: 'This file is not a valid settings file.',
    unsavedShort: 'unsaved', unsavedHint: 'Settings changed since the last export. Export before closing this page.',
    clearConfirm: 'Clear all cards?',
    phoneEdit: 'Edit on phone',
    phoneHelp: 'Scan this code with your phone, edit the settings, then press "Send to computer" on the phone.',
    phoneExpires: 'This link expires in',
    phoneWaiting: 'Waiting for the phone…', phoneConnecting: 'Connecting…',
    phoneReceived: 'Settings received from the phone. Check them, then press "Use these settings".',
    phoneUse: 'Use these settings', phoneSaved: 'Settings saved.',
    phoneExpired: 'The link has expired. Close this window and try again.',
    phoneError: 'Could not connect. Check the internet connection and try again.',
    phonePrivacy: 'Only the settings are sent, encrypted, and deleted within 5 minutes. Order data never leaves this browser.',
    phoneTitle: 'Edit settings', phoneSend: 'Send to computer', phoneSent: 'Sent. Check the computer.',
    phoneLoading: 'Loading…', phoneBadLink: 'This link has expired or is not valid. Create a new one from the computer.',
    qrNoLib: 'qrcode.js did not load. Make sure it is next to this page.'
  }
};
const LANG = 'en';
function t(key, vars) {
  let s = I18N[LANG][key];
  if (s === undefined) return key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.title = t('appTitle');
}

/* ===================== Helpers ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const pad = n => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2000);
}
function normalisePhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('05') && d.length === 10) d = '966' + d.slice(1);
  else if (d.startsWith('5') && d.length === 9) d = '966' + d;
  return d;
}

/* ===================== Settings storage ===================== */
// settings = { welcomeAr, welcomeEn, types: [{ id, title, color, ar, en }], updatedAt }
let settings = loadSettings();
let dirty = localStorage.getItem(SETTINGS_KEY + '.dirty') === '1';
function loadSettings() {
  try { const s = JSON.parse(localStorage.getItem(SETTINGS_KEY)); return validSettings(s) ? s : null; }
  catch (e) { return null; }
}
function validSettings(s) { return !!(s && Array.isArray(s.types) && typeof s.welcomeAr === 'string'); }
function saveSettings(isDirty) {
  dirty = isDirty;
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    localStorage.setItem(SETTINGS_KEY + '.dirty', isDirty ? '1' : '0');
  } catch (e) {}
  renderUnsaved();
}
function renderUnsaved() {
  $('unsavedMark').hidden = !dirty;
  $('unsavedMark').textContent = '● ' + t('unsavedShort');
  $('btnExport').title = dirty ? t('unsavedHint') : '';
}
const typeById = id => settings && settings.types.find(x => x.id === id);

/* ===================== Order parsing ===================== */
// Reads the order details window (Order Number … Guest … Mobile … Item Description …)
function parseOrder(text) {
  const lines = text.split(/\r?\n/).map(s => s.trim());
  const after = label => {
    const i = lines.findIndex(l => l === label);
    if (i < 0) return '';
    for (let j = i + 1; j < lines.length; j++) if (lines[j]) return lines[j];
    return '';
  };
  const star = /\*(WEBSTORE-[\w-]+)\*/.exec(text);
  const all = text.match(/WEBSTORE-\d+-\d+/g);
  const order = star ? star[1] : (all ? all[all.length - 1] : '');
  const items = [];
  lines.forEach((l, i) => {
    if (!l.startsWith('Item Description')) return;
    const names = [];
    for (let j = i + 1; j < lines.length && names.length < 2; j++) {
      if (/^(Quantity|Item Code|Picked Qty|Net Amount)/.test(lines[j])) break;
      if (lines[j]) names.push(lines[j]);
    }
    if (names.length) items.push({ ar: names[0], en: names[1] || names[0] });
  });
  return { order, name: after('Guest'), phone: normalisePhone(after('Mobile')), items };
}
// First words until the name has at least SHORT_MIN_CHARS characters
function shortName(s) {
  let out = '';
  for (const w of String(s || '').trim().split(/\s+/)) {
    out = out ? out + ' ' + w : w;
    if (out.length >= SHORT_MIN_CHARS) break;
  }
  return out;
}

/* ===================== Cards ===================== */
// card = { id, raw, order, name, phone, items, itemIdx, lang, mode, itemText, typeId, qrW, qrM, error }
let cards = loadCards();
function emptyCard() { return { id: newId(), raw: '', order: '', name: '', phone: '', items: [], itemIdx: 0, lang: 'ar', mode: 'short', itemText: '', typeId: '', qrW: false, qrM: false, error: '' }; }
function loadCards() {
  try { const c = JSON.parse(sessionStorage.getItem(CARDS_KEY)); if (Array.isArray(c) && c.length) return c; } catch (e) {}
  return [emptyCard()];
}
function saveCards() { try { sessionStorage.setItem(CARDS_KEY, JSON.stringify(cards)); } catch (e) {} }
const cardById = id => cards.find(c => c.id === id);

function updateItemText(c) {
  const it = c.items[c.itemIdx];
  if (!it) { c.itemText = ''; return; }
  const full = c.lang === 'en' ? it.en : it.ar;
  c.itemText = c.mode === 'long' ? full : shortName(full);
}

function cardHTML(c) {
  const type = typeById(c.typeId);
  const style = type ? `style="border-color:${esc(type.color)};background:${esc(type.color)}22"` : '';
  const chips = settings.types.map(x => {
    const on = x.id === c.typeId;
    return `<button class="chip" data-act="type" data-val="${esc(x.id)}" dir="auto" style="border-color:${esc(x.color)};${on ? `background:${esc(x.color)};color:#fff` : `color:${esc(x.color)}`}">${esc(x.title)}</button>`;
  }).join('');
  const has = !!c.raw;
  const itemOpts = c.items.map((it, i) => {
    const label = c.lang === 'en' ? it.en : it.ar;
    return `<option value="${i}" ${i === c.itemIdx ? 'selected' : ''}>${esc(label.length > 40 ? label.slice(0, 40) + '…' : label)}</option>`;
  }).join('');
  return `<div class="ocard" data-card="${esc(c.id)}" ${style}>
    <div class="chips">${chips}</div>
    <div class="ocard-body">
      <textarea class="paste" data-act="paste" placeholder="${esc(t('pastePh'))}">${esc(c.raw)}</textarea>
      ${has && !c.error ? `
        <div>
          <input class="field name" data-field="name" value="${esc(c.name)}" placeholder="${esc(t('namePh'))}" dir="auto">
          <div class="order-no">${esc(c.order)}</div>
        </div>
        <div class="seg">
          <button class="${c.lang === 'ar' ? 'on' : ''}" data-act="lang" data-val="ar">${esc(t('langAr'))}</button>
          <button class="${c.lang === 'en' ? 'on' : ''}" data-act="lang" data-val="en">${esc(t('langEn'))}</button>
        </div>
        ${c.items.length ? `
          <select class="field" data-act="item" dir="auto">${itemOpts}</select>
          <div class="seg">
            <button class="${c.mode === 'short' ? 'on' : ''}" data-act="mode" data-val="short">${esc(t('short'))}</button>
            <button class="${c.mode === 'long' ? 'on' : ''}" data-act="mode" data-val="long">${esc(t('long'))}</button>
          </div>
          <input class="field item" data-field="itemText" value="${esc(c.itemText)}" placeholder="${esc(t('itemPh'))}" dir="auto">`
        : `<span class="help">${esc(t('noItems'))}</span>`}
        <div class="spacer"></div>
        <button class="qr-btn" data-act="qr" data-val="welcome">${c.qrW ? '✓ ' : ''}${esc(t('qrWelcome'))}</button>
        <button class="qr-btn second" data-act="qr" data-val="message">${c.qrM ? '✓ ' : ''}${esc(t('qrMessage'))}</button>`
      : '<div class="spacer"></div>'}
      <button class="remove" data-act="remove" title="${esc(t('removeCard'))}">✕</button>
    </div>
    ${c.error ? `<div class="err-line">${esc(c.error)}</div>` : ''}
  </div>`;
}

function renderCards() {
  $('cards').innerHTML = settings ? cards.map(cardHTML).join('') : '';
}
function rerenderCard(c) {
  const el = document.querySelector(`[data-card="${c.id}"]`);
  if (el) el.outerHTML = cardHTML(c);
  saveCards();
}

function onPaste(c, text) {
  c.raw = text;
  c.qrW = c.qrM = false;
  if (!text.trim()) { Object.assign(c, emptyCard(), { id: c.id, typeId: c.typeId }); rerenderCard(c); return; }
  const o = parseOrder(text);
  Object.assign(c, { order: o.order, name: o.name, phone: o.phone, items: o.items, itemIdx: 0, mode: 'short' });
  c.error = o.phone ? '' : t('noPhone');
  updateItemText(c);
  rerenderCard(c);
  // A new empty card appears under the last one
  if (cards[cards.length - 1] === c && !c.error) {
    const n = emptyCard();
    cards.push(n);
    $('cards').insertAdjacentHTML('beforeend', cardHTML(n));
    saveCards();
  }
}

/* ===================== QR dialog ===================== */
const qrState = { cardId: null, kind: null };
function fillVars(text, c) {
  return String(text || '')
    .replace(/\{name\}/g, c.name || '')
    .replace(/\{order\}/g, c.order || '')
    .replace(/\{item\}/g, c.itemText || '');
}
function openQr(c, kind) {
  const type = typeById(c.typeId);
  if (kind === 'message' && !type) { toast(t('chooseType')); return; }
  if (kind === 'welcome') c.qrW = true; else c.qrM = true;
  rerenderCard(c);
  const en = c.lang === 'en';
  const text = kind === 'welcome'
    ? (en ? settings.welcomeEn || settings.welcomeAr : settings.welcomeAr)
    : fillVars(en ? type.en || type.ar : type.ar, c);
  $('qrTitle').textContent = `${kind === 'welcome' ? t('qrWelcome') : type.title} — ${c.name || c.phone}`;
  $('qrText').textContent = text;
  if (typeof qrcode !== 'function') $('qrBox').textContent = t('qrNoLib');
  else {
    const qr = qrcode(0, 'L');
    qr.addData(`https://wa.me/${c.phone}?text=${encodeURIComponent(text)}`, 'Byte');
    qr.make();
    $('qrBox').innerHTML = qr.createImgTag(6, 8);
  }
  if (!$('dlgQr').open) $('dlgQr').showModal();
}

/* ===================== Settings form (dialog and phone) ===================== */
function typeEditHTML(x) {
  return `<div class="type-edit" data-id="${esc(x.id)}" style="border-color:${esc(x.color)}">
    <div class="type-head">
      <input type="text" data-k="title" value="${esc(x.title)}" placeholder="${esc(t('typeTitlePh'))}" dir="auto">
      <input type="color" data-k="color" value="${esc(x.color)}">
      <button class="btn" data-sf="delete" style="color:var(--red)">${esc(t('deleteType'))}</button>
    </div>
    <div class="grid2">
      <div><label>${esc(t('arabic'))}</label><textarea data-k="ar" rows="4" dir="rtl">${esc(x.ar)}</textarea></div>
      <div><label>${esc(t('english'))}</label><textarea data-k="en" rows="4" dir="ltr">${esc(x.en)}</textarea></div>
    </div>
  </div>`;
}
function renderSettingsForm(box, s) {
  box.innerHTML = `
    <div class="vars row-flex">
      <span class="help">${esc(t('insert'))}</span>
      <button data-sf="var" data-val="name">${esc(t('varName'))}</button>
      <button data-sf="var" data-val="order">${esc(t('varOrder'))}</button>
      <button data-sf="var" data-val="item">${esc(t('varItem'))}</button>
      <span class="help">${esc(t('varsHelp'))}</span>
    </div>
    <h3>${esc(t('welcomeSection'))}</h3>
    <div class="grid2">
      <div><label>${esc(t('arabic'))}</label><textarea data-k="welcomeAr" rows="4" dir="rtl">${esc(s.welcomeAr)}</textarea></div>
      <div><label>${esc(t('english'))}</label><textarea data-k="welcomeEn" rows="4" dir="ltr">${esc(s.welcomeEn)}</textarea></div>
    </div>
    <h3>${esc(t('typesSection', { n: MAX_TYPES }))}</h3>
    <div class="types-list">${s.types.map(typeEditHTML).join('')}</div>
    <button class="btn" data-sf="add" ${s.types.length >= MAX_TYPES ? 'disabled' : ''}>${esc(t('addType'))}</button>`;
  if (box._bound) return;
  box._bound = true;
  box.addEventListener('focusin', e => { if (e.target.matches('textarea')) box._last = e.target; });
  box.addEventListener('input', e => {
    if (e.target.dataset.k === 'color') e.target.closest('.type-edit').style.borderColor = e.target.value;
  });
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-sf]');
    if (!b) return;
    if (b.dataset.sf === 'var') {
      const el = box._last;
      if (!el || !box.contains(el)) return;
      const v = VARS[b.dataset.val];
      el.setRangeText(v, el.selectionStart, el.selectionEnd, 'end');
      el.focus();
      return;
    }
    const s2 = readSettingsForm(box);
    if (b.dataset.sf === 'add' && s2.types.length < MAX_TYPES) s2.types.push({ id: newId(), title: '', color: '#6b7385', ar: '', en: '' });
    if (b.dataset.sf === 'delete') s2.types = s2.types.filter(x => x.id !== b.closest('.type-edit').dataset.id);
    renderSettingsForm(box, s2);
  });
}
function readSettingsForm(box) {
  const val = (root, k) => root.querySelector(`[data-k="${k}"]`).value;
  return {
    welcomeAr: val(box, 'welcomeAr'), welcomeEn: val(box, 'welcomeEn'),
    types: [...box.querySelectorAll('.type-edit')].map(el => ({
      id: el.dataset.id, title: val(el, 'title').trim(), color: val(el, 'color'), ar: val(el, 'ar'), en: val(el, 'en')
    }))
  };
}
function checkSettings(s) {
  if (!s.types.length) return t('needOneType');
  if (s.types.some(x => !x.title)) return t('titleRequired');
  return '';
}

function openSettings() {
  renderSettingsForm($('settingsForm'), settings || DEFAULT_SETTINGS);
  $('settingsMsg').textContent = '';
  $('dlgSettings').showModal();
}
function applySettings(s) {
  settings = Object.assign(s, { updatedAt: new Date().toISOString() });
  saveSettings(true);
  for (const c of cards) if (c.typeId && !typeById(c.typeId)) c.typeId = '';
  renderAll();
}
function renderAll() {
  $('setup').hidden = !!settings;
  ['btnClear', 'btnExport'].forEach(id => $(id).hidden = !settings);
  renderCards();
  renderUnsaved();
}

/* ===================== Export / import ===================== */
function exportSettings() {
  const blob = new Blob([JSON.stringify({ kind: 'onlineOrdersSettings', settings })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${EXPORT_NAME} ${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  saveSettings(false);
}
function importSettings(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const s = data && data.settings;
      if (!validSettings(s)) throw new Error('bad');
      settings = s;
      saveSettings(false);
      renderAll();
      toast(t('importDone'));
    } catch (e) { toast(t('importFail')); }
  };
  reader.readAsText(file);
}

/* ===================== Edit settings on phone ===================== */
// Same idea and Firebase project as sync.html and Insurance Refill: a temporary, end-to-end encrypted
// document. The phone opens this same page with the secret after "#". Deleted within 5 minutes.
const SESSION_TTL = 5 * 60 * 1000;
const FIREBASE_URL = 'https://www.gstatic.com/firebasejs/10.12.2/';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyD-QSolp7uoEr0z_0NkOBIeEFAgllmi0ro',
  authDomain: 'sync-df6ca.firebaseapp.com',
  projectId: 'sync-df6ca',
  storageBucket: 'sync-df6ca.firebasestorage.app',
  messagingSenderId: '1091721719210',
  appId: '1:1091721719210:web:567cd4ce4056bfce45cfd3'
};
let fb = null;
async function loadFirebase() {
  if (fb) return fb;
  const app = await import(FIREBASE_URL + 'firebase-app.js');
  const fs = await import(FIREBASE_URL + 'firebase-firestore.js');
  fb = { fs, db: fs.getFirestore(app.initializeApp(FIREBASE_CONFIG, 'online-orders')) };
  return fb;
}
const te = new TextEncoder(), td = new TextDecoder();
const toB64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
const toB64u = b => toB64(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return fromB64(s); };
async function deriveSession(secretBytes) {
  const base = await crypto.subtle.importKey('raw', secretBytes, 'HKDF', false, ['deriveBits', 'deriveKey']);
  const salt = te.encode('online-orders-v1');
  const idBits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt, info: te.encode('page-id') }, base, 128);
  const key = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: te.encode('content-key') },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  return { id: toB64u(new Uint8Array(idBits)), key };
}
async function encJSON(obj, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return toB64(iv) + '.' + toB64(new Uint8Array(ct));
}
async function decJSON(str, key) {
  const [iv, ct] = str.split('.');
  return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(iv) }, key, fromB64(ct))));
}

const phone = { id: null, key: null, ref: null, expiresAt: 0, unsub: null, timer: null, received: null };
function phoneStatus(text, cls) { $('phoneStatus').className = 'msg ' + (cls || ''); $('phoneStatus').textContent = text; }

async function startPhoneSession() {
  endPhoneSession();
  const current = readSettingsForm($('settingsForm'));
  $('phoneQr').innerHTML = ''; $('phonePreview').hidden = true; $('btnPhoneUse').disabled = true; $('phoneWait').hidden = false;
  $('phoneTimer').textContent = '5:00';
  phoneStatus(t('phoneConnecting'));
  $('dlgPhone').showModal();
  try {
    const { fs, db } = await loadFirebase();
    const secret = crypto.getRandomValues(new Uint8Array(32));
    const s = await deriveSession(secret);
    Object.assign(phone, { id: s.id, key: s.key, ref: fs.doc(db, 'pages', s.id), expiresAt: Date.now() + SESSION_TTL, received: null });
    await fs.setDoc(phone.ref, { text: await encJSON({ from: 'pos', settings: current }, phone.key), createdAt: fs.serverTimestamp(), expiresAt: fs.Timestamp.fromMillis(phone.expiresAt) });
    const link = location.href.split('#')[0] + '#' + toB64u(secret);
    const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
    $('phoneQr').innerHTML = qr.createImgTag(5, 8);
    phoneStatus(t('phoneWaiting'));
    phone.timer = setInterval(phoneTick, 1000);
    const myId = phone.id;
    phone.unsub = fs.onSnapshot(phone.ref, async snap => {
      if (phone.id !== myId || !snap.exists() || snap.metadata.hasPendingWrites) return;
      try {
        const data = await decJSON(snap.data().text || '', phone.key);
        if (data.from !== 'phone' || !validSettings(data.settings)) return;
        phone.received = data.settings;
        $('phonePreview').textContent = [data.settings.welcomeAr, ...data.settings.types.map(x => `— ${x.title} —\n${x.ar}`)].join('\n\n');
        $('phoneWait').hidden = true;
        $('phonePreview').hidden = false; $('btnPhoneUse').disabled = false;
        phoneStatus(t('phoneReceived'), 'ok');
      } catch (e) { /* ignore anything that cannot be decrypted */ }
    }, () => {});
  } catch (e) {
    phoneStatus(t('phoneError'), 'err');
  }
}
function phoneTick() {
  const left = phone.expiresAt - Date.now();
  if (left <= 0) { endPhoneSession(); phoneStatus(t('phoneExpired'), 'err'); $('phoneQr').innerHTML = ''; $('btnPhoneUse').disabled = !phone.received; return; }
  const s = Math.ceil(left / 1000);
  $('phoneTimer').textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
}
function endPhoneSession() {
  if (phone.unsub) phone.unsub();
  clearInterval(phone.timer);
  if (phone.ref && fb) fb.fs.deleteDoc(phone.ref).catch(() => {});
  Object.assign(phone, { id: null, ref: null, unsub: null, timer: null });
}
function usePhoneSettings() {
  if (!phone.received) return;
  $('btnPhoneUse').disabled = true;
  applySettings(phone.received);
  phone.received = null;
  endPhoneSession();
  $('dlgPhone').close();
  if ($('dlgSettings').open) $('dlgSettings').close();
  toast(t('phoneSaved'));
}

// The phone side: this page opened with "#secret"
async function startPhoneMode(secretText) {
  $('main').hidden = true;
  $('phoneMode').hidden = false;
  const status = (text, cls) => { $('pmStatus').className = 'msg ' + (cls || ''); $('pmStatus').textContent = text; };
  status(t('phoneLoading'));
  try {
    const { fs, db } = await loadFirebase();
    const s = await deriveSession(fromB64u(secretText));
    const ref = fs.doc(db, 'pages', s.id);
    const snap = await fs.getDoc(ref);
    if (!snap.exists()) { status(t('phoneBadLink'), 'err'); return; }
    const data = await decJSON(snap.data().text || '', s.key);
    if (!validSettings(data.settings)) { status(t('phoneBadLink'), 'err'); return; }
    renderSettingsForm($('pmForm'), data.settings);
    status('');
    $('pmSend').hidden = false;
    $('pmSend').onclick = async () => {
      const s2 = readSettingsForm($('pmForm'));
      const problem = checkSettings(s2);
      if (problem) { status(problem, 'err'); return; }
      $('pmSend').disabled = true;
      try {
        await fs.updateDoc(ref, { text: await encJSON({ from: 'phone', settings: s2 }, s.key) });
        status(t('phoneSent'), 'ok');
      } catch (e) { status(t('phoneBadLink'), 'err'); }
      $('pmSend').disabled = false;
    };
  } catch (e) {
    status(t('phoneBadLink'), 'err');
  }
}

/* ===================== Events ===================== */
function bind() {
  $('btnSettings').onclick = openSettings;
  $('btnCreate').onclick = openSettings;
  $('btnExport').onclick = exportSettings;
  $('btnImport').onclick = $('btnImport2').onclick = () => $('fileImport').click();
  $('fileImport').onchange = e => { if (e.target.files[0]) importSettings(e.target.files[0]); e.target.value = ''; };
  $('btnClear').onclick = () => { if (confirm(t('clearConfirm'))) { cards = [emptyCard()]; saveCards(); renderCards(); } };
  $('btnSaveSettings').onclick = () => {
    const s = readSettingsForm($('settingsForm'));
    const problem = checkSettings(s);
    if (problem) { $('settingsMsg').className = 'msg err'; $('settingsMsg').textContent = problem; return; }
    applySettings(s);
    $('dlgSettings').close();
    toast(t('saved'));
  };
  $('btnPhoneEdit').onclick = startPhoneSession;
  $('btnPhoneUse').onclick = usePhoneSettings;
  $('dlgPhone').addEventListener('close', () => { phone.received = null; endPhoneSession(); });
  document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

  const box = $('cards');
  box.addEventListener('input', e => {
    const el = e.target, c = cardById(el.closest('[data-card]').dataset.card);
    if (!c) return;
    if (el.dataset.act === 'paste') onPaste(c, el.value);
    else if (el.dataset.field) { c[el.dataset.field] = el.value; saveCards(); }
  });
  box.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.act !== 'item') return;
    const c = cardById(el.closest('[data-card]').dataset.card);
    c.itemIdx = Number(el.value); updateItemText(c); rerenderCard(c);
  });
  box.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const c = cardById(b.closest('[data-card]').dataset.card);
    if (!c) return;
    const v = b.dataset.val;
    switch (b.dataset.act) {
      case 'type': c.typeId = c.typeId === v ? '' : v; rerenderCard(c); break;
      case 'lang': c.lang = v; updateItemText(c); rerenderCard(c); break;
      case 'mode': c.mode = v; updateItemText(c); rerenderCard(c); break;
      case 'qr': openQr(c, v); break;
      case 'remove':
        cards = cards.filter(x => x !== c);
        if (!cards.length || cards[cards.length - 1].raw) cards.push(emptyCard());
        saveCards(); renderCards(); break;
    }
  });
  // The browser wipes its data daily: warn before leaving with settings that were not exported
  window.addEventListener('beforeunload', e => { if (dirty && settings) { e.preventDefault(); e.returnValue = ''; } });
}

applyI18n();
const hashSecret = location.hash.slice(1);
if (hashSecret.length > 30) startPhoneMode(hashSecret);
else { bind(); renderAll(); }
</script>
