<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملصقات الأسعار</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--text:#1d2330;--muted:#6b7385;--border:#dde1e8;
  --accent:#2563eb;--accent-soft:#e3ecff;
  --ok:#15803d;--ok-soft:#dcfce7;--no:#6b7280;--no-soft:#e9ebef;
  --warn:#b45309;--err:#b91c1c;--err-soft:#fee2e2;--hl:#f59e0b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d;--surface:#1d2129;--text:#e7e9ee;--muted:#9aa2b2;--border:#323846;
    --accent:#60a5fa;--accent-soft:#1e2c47;
    --ok:#4ade80;--ok-soft:#163223;--no:#9ca3af;--no-soft:#262a32;
    --warn:#fbbf24;--err:#f87171;--err-soft:#3b1a1a;--hl:#fbbf24;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:14px}
.wrap{max-width:1500px;margin:0 auto;padding:12px 16px}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:5px 11px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--err)}

/* top box */
.top{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;position:relative}
.top-row{display:flex;gap:10px;align-items:stretch}
textarea{flex:1;height:52px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--text);font:inherit;resize:vertical}
.top-btns{display:flex;flex-direction:column;gap:6px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.stats b{color:var(--text)}
.stats .pending b{color:var(--warn)}.stats .print b{color:var(--ok)}
.msg{margin-top:6px;font-size:13px;line-height:1.6}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.msg .w{color:var(--warn);display:block}
.settings{position:absolute;top:46px;left:12px;z-index:10;width:340px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.settings h3{margin:0 0 8px;font-size:14px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.settings select{width:170px;font:inherit;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text)}
.settings .row{display:flex;gap:8px;margin-top:10px}

/* data area: left to right */
.data{direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border-radius:999px;padding:4px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--muted);font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .n{color:#dbe6ff}
.chip.done:not(.on){border-color:var(--ok);background:var(--ok-soft)}
.chips.sub{padding-left:14px;border-left:3px solid var(--border)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;direction:rtl}
.bar .count{color:var(--muted);font-size:13px;margin-inline-end:auto}
.bar .f{border-radius:999px;padding:3px 10px;font-size:12px}
.bar .f.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.bar .sep{width:1px;height:22px;background:var(--border)}
.b-all-print{color:var(--ok);border-color:var(--ok)}
.b-all-none{color:var(--no)}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
th,td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);background:var(--bg);font-weight:600;position:sticky;top:0;z-index:2}
td.desc{white-space:normal;width:100%}
td.num{text-align:center}
td.copy{cursor:pointer;font-family:Consolas,monospace}
td.copy:hover{color:var(--accent);text-decoration:underline}
td.st button{padding:2px 9px;font-size:12px;margin-right:4px}
td.st .b-print.on{background:var(--ok);border-color:var(--ok);color:#fff}
td.st .b-none.on{background:var(--no);border-color:var(--no);color:#fff}
tr.st-print td{background:var(--ok-soft)}
tr.st-none td{background:var(--no-soft);color:var(--muted)}
tr.copied td{box-shadow:inset 0 2px 0 var(--hl),inset 0 -2px 0 var(--hl)}
td input{width:56px;font:inherit;padding:2px 4px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text)}
.missing{color:var(--err)}
.empty{padding:40px;text-align:center;color:var(--muted);direction:rtl}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="top-row">
      <textarea id="paste" placeholder="الصق جدول الأصناف هنا مع صف العناوين"></textarea>
      <div class="top-btns">
        <button class="primary" id="btnExport">تحميل ملف الطباعة</button>
        <button id="btnNew" class="danger">صفحة جديدة</button>
        <button id="btnSettings">⚙ الإعدادات</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="msg" id="msg"></div>

    <div class="settings hidden" id="settings">
      <h3>الأعمدة المستخدمة</h3>
      <div id="map"></div>
      <div class="row">
        <button id="btnRead">إعادة قراءة النص</button>
      </div>
    </div>
  </div>

  <div class="data" id="data"></div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const LS_KEY = 'priceTagTool.v2';

const ROLES = [
  {k:'id',   label:'رقم الصنف',      hints:['item id','item no','item no.','item number','item code','رقم الصنف','كود الصنف']},
  {k:'bc',   label:'الباركود',        hints:['ibc','barcode','bar code','الباركود','باركود']},
  {k:'en',   label:'الوصف الإنجليزي', hints:['second desc','english desc','english description']},
  {k:'oldP', label:'السعر الحالي',    hints:['current sales price','current price','old price','السعر الحالي']},
  {k:'newP', label:'السعر الجديد',    hints:['new sales price','new price','السعر الجديد']},
];

let state = {headers:[], rows:[], map:{}, status:{}, qty:{}};
let items = [];
let segs = [];          // selected path, one segment (array of words) per level
let filter = 'all';
let lastCopiedKey = null;
let lastBulk = null;    // {keys:[], value}

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function loadSaved(){ try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.rows) state = s; }catch(e){} }
function setMsg(type, html){ const m = $('#msg'); m.className = 'msg ' + (type || ''); m.innerHTML = html || ''; }
let toastTimer;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1500); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove(); return ok;
  }
}

// ---------- parsing ----------
function parseHTML(html){
  const p = new DOMParser();
  let doc = p.parseFromString(html, 'text/html');
  let tables = [...doc.querySelectorAll('table')];
  if(!tables.length && /<tr/i.test(html)){ doc = p.parseFromString('<table>' + html + '</table>', 'text/html'); tables = [...doc.querySelectorAll('table')]; }
  if(!tables.length) return null;
  const t = tables.sort((a, b) => b.rows.length - a.rows.length)[0];
  return [...t.rows].map(r => [...r.cells].map(c => c.textContent.replace(/\s+/g, ' ').trim()));
}

function parseText(text){
  const lines = text.split(/\r?\n/);
  if(lines.some(l => l.includes('\t'))){
    return {rows: lines.filter(l => l.trim()).map(l => l.split('\t').map(s => s.trim()))};
  }
  // one value per line
  const vals = lines.map(l => l.trim()).filter(Boolean);
  const first = vals.findIndex(v => /^\d{6,}$/.test(v));
  if(first <= 0) return {error:'تعذّر تحديد الأعمدة. يرجى نسخ الجدول مع صف العناوين.'};
  const h = first;
  if((vals.length - h) % h !== 0){
    return {error:`عدد القيم لا يتوافق مع عدد الأعمدة (${h}). غالبًا توجد خانة فارغة أدّت إلى إزاحة البيانات، لذلك لم تُقرأ البيانات حفاظًا على صحتها.`};
  }
  const rows = [vals.slice(0, h)];
  for(let i = h; i < vals.length; i += h) rows.push(vals.slice(i, i + h));
  return {rows};
}

function shapeRows(raw){
  raw = raw.filter(r => r.some(c => c !== ''));
  if(!raw.length) return null;
  const looksData = r => r.some(c => /^\d{6,}$/.test(c));
  let headers, data;
  if(!looksData(raw[0])){ headers = raw[0].slice(); data = raw.slice(1); }
  else { headers = []; data = raw; }
  const width = Math.max(headers.length, ...data.map(r => r.length));
  for(let i = 0; i < width; i++) if(!headers[i]) headers[i] = 'عمود ' + (i + 1);
  data = data.map(r => { const c = r.slice(); while(c.length < width) c.push(''); return c; });
  return {headers, rows: data};
}

function autoMap(headers, rows){
  const norm = s => s.toLowerCase().replace(/\s+/g, ' ').trim();
  const map = {}; const used = new Set();
  for(const role of ROLES){
    const i = headers.findIndex((h, idx) => !used.has(idx) && role.hints.includes(norm(h)));
    map[role.k] = i; if(i >= 0) used.add(i);
  }
  const cols = headers.map((_, c) => rows.map(r => r[c] || ''));
  const frac = (c, re) => { const v = cols[c].filter(Boolean); return v.length ? v.filter(x => re.test(x)).length / v.length : 0; };
  if(map.id < 0){
    for(let c = 0; c < cols.length; c++){
      if(used.has(c)) continue;
      const v = cols[c];
      if(v.every(x => /^\d+$/.test(x)) && new Set(v.map(x => x.length)).size === 1){ map.id = c; used.add(c); break; }
    }
  }
  if(map.bc < 0){
    let best = -1, bestLen = 0;
    for(let c = 0; c < cols.length; c++){
      if(used.has(c) || frac(c, /^\d+$/) < 0.9) continue;
      const avg = cols[c].reduce((a, x) => a + x.length, 0) / cols[c].length;
      if(avg >= 8 && avg > bestLen){ best = c; bestLen = avg; }
    }
    map.bc = best; if(best >= 0) used.add(best);
  }
  if(map.en < 0){
    let best = -1, bf = 0.5;
    for(let c = 0; c < cols.length; c++){ if(used.has(c)) continue; const f = frac(c, /[A-Za-z]{2,}/); if(f > bf){ best = c; bf = f; } }
    map.en = best;
  }
  return map;
}

// ---------- items ----------
function buildItems(){
  items = [];
  const {rows, map} = state;
  if(!rows.length) return {error:''};
  if(map.id < 0) return {error:'يرجى تحديد عمود رقم الصنف من الإعدادات.'};
  if(map.bc < 0) return {error:'يرجى تحديد عمود الباركود من الإعدادات.'};
  const idLen = (rows[0][map.id] || '').length;
  const out = [], seen = {}; let dup = 0, noBc = 0, badBc = 0;
  for(let i = 0; i < rows.length; i++){
    const r = rows[i], id = r[map.id] || '';
    if(!/^\d+$/.test(id) || id.length !== idLen){
      const prev = out[out.length - 1];
      return {error:`توقفت القراءة عند الصف رقم ${i + 1}: القيمة «${esc(id || 'فارغة')}» ليست رقم صنف صحيحًا، لذلك لم تُعتمد البيانات.`
        + (prev ? `<br>آخر صنف سليم قبل الخطأ: ${esc(prev.id)}` : '')};
    }
    const bc = r[map.bc] || '';
    if(!bc) noBc++; else if(!/^\d+$/.test(bc)) badBc++;
    const en = map.en >= 0 ? (r[map.en] || '') : '';
    let key = id + '|' + bc;
    if(seen[key]){ dup++; key += '#' + i; }
    seen[key] = true;
    out.push({key, idx:i, id, bc, en,
      oldP: map.oldP >= 0 ? (r[map.oldP] || '') : '',
      newP: map.newP >= 0 ? (r[map.newP] || '') : '',
      words: en.split(' ').filter(Boolean)});
  }
  items = out;
  const warnings = [];
  if(noBc) warnings.push(`يوجد ${noBc} صنفًا بدون باركود.`);
  if(badBc) warnings.push(`يوجد ${badBc} باركودًا يحتوي على رموز غير رقمية، يرجى مراجعة عمود الباركود.`);
  if(dup) warnings.push(`يوجد ${dup} صنفًا مكررًا بنفس رقم الصنف والباركود.`);
  return {warnings};
}

function applyData(raw){
  const shaped = shapeRows(raw);
  if(!shaped){ setMsg('err', 'لم يتم العثور على أي بيانات في النص الملصق.'); return; }
  state = {headers: shaped.headers, rows: shaped.rows, map: autoMap(shaped.headers, shaped.rows), status:{}, qty:{}};
  segs = []; filter = 'all'; lastCopiedKey = null; lastBulk = null;
  save();
  refresh(true);
}

function refresh(announce){
  const res = buildItems();
  if(res.error) setMsg('err', res.error);
  else if(announce){
    setMsg('ok', `تمت قراءة ${items.length} صنفًا بنجاح.`
      + res.warnings.map(w => `<span class="w">⚠ ${w}</span>`).join(''));
  }
  renderMap();
  render();
}

// ---------- grouping ----------
const curPath = () => segs.flat();
const itemsUnder = path => items.filter(it => path.every((w, i) => it.words[i] === w));
const hasDigit = w => /\d/.test(w);

// Returns the sub-groups available under a path (as chip entries).
function levelGroups(path){
  const its = itemsUnder(path);
  if(path.length === 0){
    const m = new Map();
    for(const it of its){ const k = it.words[0]; if(k === undefined) continue; if(!m.has(k)) m.set(k, []); m.get(k).push(it); }
    return [...m].map(([k, g]) => ({seg:[k], label:k, list:g}));
  }
  if(its.length < 2) return [];
  let L = path.length;
  for(;;){
    const w = its[0].words[L];
    if(w === undefined || hasDigit(w) || !its.every(it => it.words[L] === w)) break;
    L++;
  }
  const prefixAdd = its[0].words.slice(path.length, L);
  const m = new Map();
  for(const it of its){
    const k = it.words[L];
    if(k === undefined || hasDigit(k)) continue;
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(it);
  }
  const out = [...m].filter(([, g]) => g.length > 1).map(([k, g]) => ({seg: prefixAdd.concat([k]), label:k, list:g}));
  return out.length > 1 ? out : [];
}

// ---------- rendering ----------
function renderMap(){
  const opts = ['<option value="-1">— غير موجود —</option>']
    .concat(state.headers.map((h, i) => `<option value="${i}">${esc(h)}</option>`)).join('');
  $('#map').innerHTML = ROLES.map(r => `<label>${r.label}<select data-role="${r.k}">${opts}</select></label>`).join('');
  $('#map').querySelectorAll('select').forEach(s => { s.value = String(state.map[s.dataset.role] ?? -1); });
}

function renderStats(){
  if(!items.length){ $('#stats').innerHTML = ''; return; }
  let pending = 0, print = 0, none = 0, labels = 0;
  for(const it of items){
    const s = state.status[it.key];
    if(s === 'print'){ print++; labels += (state.qty[it.key] || 1); }
    else if(s === 'none') none++; else pending++;
  }
  const last = items[items.length - 1];
  $('#stats').innerHTML =
    `<span>الإجمالي: <b>${items.length}</b></span>` +
    `<span class="pending">لم تُراجع: <b>${pending}</b></span>` +
    `<span class="print">تُطبع: <b>${print}</b></span>` +
    `<span>لا رصيد: <b>${none}</b></span>` +
    `<span>الملصقات: <b>${labels}</b></span>` +
    `<span>آخر صنف تمت قراءته: <b>${esc(last.id)}</b></span>`;
}

const reviewed = list => list.filter(it => state.status[it.key]).length;

function chipHtml(level, idx, label, list, on){
  const done = reviewed(list);
  return `<button class="chip ${on ? 'on' : ''} ${done === list.length ? 'done' : ''}" data-level="${level}" data-idx="${idx}" title="تمت مراجعة ${done} من ${list.length}">${esc(label)}<span class="n">${done}/${list.length}</span></button>`;
}

function matchFilter(it){
  const s = state.status[it.key] || '';
  if(filter === 'pending') return !s;
  if(filter === 'print') return s === 'print';
  if(filter === 'none') return s === 'none';
  return true;
}

let chipLevels = [];   // chip groups for each rendered level, used by click handler

function rowHtml(it, priceCols){
  const s = state.status[it.key] || '';
  const q = state.qty[it.key] || 1;
  return `<tr data-key="${esc(it.key)}" class="${s ? 'st-' + s : ''} ${it.key === lastCopiedKey ? 'copied' : ''}">
    <td class="copy" data-copy="${esc(it.id)}" title="اضغط للنسخ">${esc(it.id)}</td>
    <td class="desc">${esc(it.en)}</td>
    ${it.bc ? `<td class="copy" data-copy="${esc(it.bc)}" title="اضغط للنسخ">${esc(it.bc)}</td>` : `<td class="missing">—</td>`}
    ${priceCols ? `<td class="num">${esc(it.oldP)}</td><td class="num">${esc(it.newP)}</td>` : ''}
    <td class="st"><button class="b-print ${s === 'print' ? 'on' : ''}" data-act="print">يُطبع</button><button class="b-none ${s === 'none' ? 'on' : ''}" data-act="none">لا رصيد</button></td>
    <td>${s === 'print' ? `<input type="number" min="1" step="1" value="${q}" data-qty title="عدد الملصقات">` : ''}</td>
  </tr>`;
}

function visibleItems(){ return itemsUnder(curPath()).filter(matchFilter); }

function render(){
  renderStats();
  const data = $('#data');
  if(!items.length){ data.innerHTML = '<div class="empty">الصق الداتا في المربع بالأعلى لتظهر هنا.</div>'; return; }

  // chip rows: brands, then one row per selected level
  chipLevels = [];
  let html = '';
  let path = [];
  for(let level = 0; level <= segs.length; level++){
    const groups = levelGroups(path);
    if(!groups.length) break;
    chipLevels[level] = groups;
    const sel = segs[level] ? segs[level].join(' ') : null;
    let row = '';
    if(level === 0) row += `<button class="chip ${segs.length === 0 ? 'on' : ''}" data-level="0" data-idx="-1">All<span class="n">${reviewed(items)}/${items.length}</span></button>`;
    row += groups.map((g, i) => chipHtml(level, i, g.label, g.list, sel === g.seg.join(' '))).join('');
    html += `<div class="chips ${level ? 'sub' : ''}">${row}</div>`;
    if(!segs[level]) break;
    path = path.concat(segs[level]);
  }

  const list = visibleItems();
  const f = (k, t) => `<button class="f ${filter === k ? 'on' : ''}" data-f="${k}">${t}</button>`;
  html += `<div class="bar">
    <span class="count">عدد الأصناف الظاهرة: ${list.length}</span>
    ${f('all', 'الكل')}${f('pending', 'لم تُراجع')}${f('print', 'تُطبع')}${f('none', 'لا رصيد')}
    <span class="sep"></span>
    <button class="b-all-print" data-bulk="print">الكل يُطبع</button>
    <button class="b-all-none" data-bulk="none">الكل لا رصيد</button>
    <button id="btnUndo" ${lastBulk ? '' : 'disabled'}>تراجع</button>
  </div>`;

  const priceCols = state.map.oldP >= 0 || state.map.newP >= 0;
  if(!list.length){
    html += '<div class="empty">لا توجد أصناف مطابقة.</div>';
  } else {
    html += `<table><thead><tr><th>Item ID</th><th>Description</th><th>Barcode</th>
      ${priceCols ? '<th>Current</th><th>New</th>' : ''}<th>Status</th><th>Labels</th></tr></thead>
      <tbody>${list.map(it => rowHtml(it, priceCols)).join('')}</tbody></table>`;
  }
  data.innerHTML = html;
}

// ---------- bulk ----------
function bulk(value){
  const pend = visibleItems().filter(it => !state.status[it.key]);
  if(!pend.length){ alert('كل الأصناف الظاهرة تمت مراجعتها بالفعل. الزر الجماعي لا يغيّر الأصناف المحددة يدويًا.'); return; }
  const word = value === 'print' ? '«يُطبع»' : '«لا رصيد»';
  if(!confirm(`سيتم تحديد ${pend.length} صنفًا على أنها ${word}.\nالأصناف التي حددتها يدويًا لن تتغير.\n\nهل تريد المتابعة؟`)) return;
  for(const it of pend) state.status[it.key] = value;
  lastBulk = {keys: pend.map(it => it.key), value};
  save(); render();
  toast(`تم تحديد ${pend.length} صنفًا`);
}

function undoBulk(){
  if(!lastBulk) return;
  let n = 0;
  for(const k of lastBulk.keys) if(state.status[k] === lastBulk.value){ delete state.status[k]; n++; }
  lastBulk = null;
  save(); render();
  toast(`تم التراجع عن ${n} صنفًا`);
}

// ---------- export ----------
// Fingerprint of the current print selection, used to know whether it was already downloaded.
function printSignature(){
  return items.filter(it => state.status[it.key] === 'print')
    .map(it => it.key + ':' + (state.qty[it.key] || 1)).join(',');
}

function exportCsv(){
  if(!items.length){ alert('لا توجد بيانات بعد.'); return; }
  const printItems = items.filter(it => state.status[it.key] === 'print');
  if(!printItems.length){ alert('لم يتم اختيار أي صنف للطباعة بعد.'); return; }
  const pending = items.filter(it => !state.status[it.key]).length;
  if(pending > 0 && !confirm(`تنبيه: يوجد ${pending} صنفًا لم تتم مراجعته بعد، وقد يكون من بينها أصناف لها رصيد.\n\nاضغط «موافق» للتحميل على أي حال، أو «إلغاء» لعرض هذه الأصناف.`)){
    filter = 'pending'; segs = []; render(); return;
  }
  const noBc = printItems.filter(it => !it.bc);
  if(noBc.length){ alert(`لا يمكن التحميل: يوجد ${noBc.length} صنفًا مختارًا للطباعة بدون باركود.\nأول صنف منها: ${noBc[0].id}`); return; }
  const lines = printItems.map(it => `1-TAG,${it.bc},${state.qty[it.key] || 1}`);
  state.exportedSig = printSignature(); save();
  const blob = new Blob([lines.join('\r\n') + '\r\n'], {type:'text/csv'});
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tags_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`تم تحميل الملف: ${printItems.length} صنفًا`);
}

// ---------- events ----------
const hasData = () => state.rows.length > 0;
const confirmReplace = () => !hasData() || confirm('سيتم استبدال البيانات الحالية ومسح كل الحالات المسجّلة. هل تريد المتابعة؟');

$('#paste').addEventListener('paste', e => {
  if(!confirmReplace()){ e.preventDefault(); return; }
  const html = e.clipboardData.getData('text/html');
  const rows = html && /<t[rd]/i.test(html) ? parseHTML(html) : null;
  if(rows && rows.length){
    e.preventDefault();
    $('#paste').value = e.clipboardData.getData('text/plain');
    applyData(rows);
    return;
  }
  $('#paste').value = '';
  setTimeout(() => readText(false), 0);
});

function readText(ask){
  if(ask && !confirmReplace()) return;
  const t = $('#paste').value;
  if(!t.trim()){ setMsg('err', 'لا يوجد نص للقراءة.'); return; }
  const r = parseText(t);
  if(r.error){ setMsg('err', r.error); return; }
  applyData(r.rows);
}

$('#btnSettings').addEventListener('click', e => { e.stopPropagation(); $('#settings').classList.toggle('hidden'); });
$('#settings').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => $('#settings').classList.add('hidden'));

$('#btnRead').addEventListener('click', () => readText(true));
$('#btnNew').addEventListener('click', () => {
  if(hasData() || $('#paste').value.trim()){
    const done = items.filter(it => state.status[it.key]).length;
    const sig = printSignature();
    let text = `سيتم مسح كل البيانات، وعدد الأصناف التي راجعتها ${done} صنفًا.`;
    if(sig && sig !== state.exportedSig) text += `\n\nتنبيه: توجد أصناف محددة «يُطبع» لم يُحمَّل ملفها بعد، وستضيع هذه الاختيارات.`;
    if(!confirm(text + '\n\nهل تريد بدء صفحة جديدة؟')) return;
  }
  state = {headers:[], rows:[], map:{}, status:{}, qty:{}}; items = []; segs = []; filter = 'all'; lastBulk = null; lastCopiedKey = null;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  $('#paste').value = ''; setMsg('', ''); renderMap(); render();
  $('#paste').focus();
});
$('#map').addEventListener('change', e => {
  const s = e.target.closest('select'); if(!s) return;
  state.map[s.dataset.role] = +s.value; segs = []; save(); refresh(true);
});
$('#btnExport').addEventListener('click', exportCsv);

$('#data').addEventListener('click', async e => {
  const chip = e.target.closest('.chip');
  if(chip){
    const level = +chip.dataset.level, idx = +chip.dataset.idx;
    if(idx < 0){ segs = []; }
    else {
      const g = chipLevels[level][idx];
      const isOn = segs[level] && segs[level].join(' ') === g.seg.join(' ');
      segs = segs.slice(0, level);
      if(!isOn) segs.push(g.seg);
    }
    render(); return;
  }
  const fb = e.target.closest('[data-f]');
  if(fb){ filter = fb.dataset.f; render(); return; }
  const bb = e.target.closest('[data-bulk]');
  if(bb){ bulk(bb.dataset.bulk); return; }
  if(e.target.closest('#btnUndo')){ undoBulk(); return; }

  const tr = e.target.closest('tr[data-key]'); if(!tr) return;
  const key = tr.dataset.key;
  const act = e.target.closest('[data-act]');
  if(act){
    const v = act.dataset.act;
    if(state.status[key] === v) delete state.status[key]; else state.status[key] = v;
    save(); render(); return;
  }
  const c = e.target.closest('[data-copy]');
  if(c){
    const ok = await copyText(c.dataset.copy);
    lastCopiedKey = key;
    document.querySelectorAll('tr.copied').forEach(r => r.classList.remove('copied'));
    tr.classList.add('copied');
    toast(ok ? 'تم النسخ: ' + c.dataset.copy : 'تعذّر النسخ');
  }
});

$('#data').addEventListener('change', e => {
  if(!e.target.matches('[data-qty]')) return;
  const key = e.target.closest('tr').dataset.key;
  let n = parseInt(e.target.value, 10);
  if(!Number.isFinite(n) || n < 1){ n = 1; e.target.value = 1; }
  state.qty[key] = n; save(); renderStats();
});

// ---------- start ----------
loadSaved();
refresh(false);
</script>
