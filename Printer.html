<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>  طباعة </title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
  body {
    font-family: Tahoma, Arial, sans-serif;
    background:#f2f2f2;
    padding:30px 15px;
  }
  .wrap { max-width:480px; margin:0 auto; }
  .back { text-decoration:none; color:#2b7de9; font-size:14px; }
  h2 { color:#333; }
  .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.1); margin-top:15px; }
  #printArea {
    width: 10cm;
    height: 5cm;
    border: 1px dashed #999;
    box-sizing: border-box;
    padding: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    display: block;
    margin: 0 auto;
  }
  .options { margin-top:15px; display:flex; gap:15px; justify-content:center; font-size:14px; }
  .options label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .btn { margin-top:15px; width:100%; padding:12px; border:none; border-radius:8px; background:#27ae60; color:#fff; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">‹ رجوع</a>
<h2> اطبع على طابعة الجرعات</h2>

<div class="card">
  <textarea id="printArea" placeholder="اكتب هنا أي شيء تريد طباعته"></textarea>

  <div style="margin-top:12px; font-size:14px;">
    <label for="fontSize">حجم الخط: <span id="fontSizeLabel">13</span>px</label>
    <input type="range" id="fontSize" min="8" max="40" value="13" style="width:100%;" oninput="updateFontSize()">
  </div>

  <div class="options">
    <label><input type="radio" name="printType" value="text" checked> نص عادي</label>
    <label><input type="radio" name="printType" value="qr"> QR Code</label>
    <label><input type="radio" name="printType" value="barcode"> Barcode</label>
  </div>

  <button class="btn" onclick="printContent()">طباعة</button>
</div>

<canvas id="barcodeCanvas" style="display:none;"></canvas>

</div>

<script>
function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function buildQrImg(text) {
  const qr = qrcode(0, "L");
  qr.addData(text);
  qr.make();
  return qr.createImgTag(4);
}

function buildBarcodeImg(text) {
  const canvas = document.getElementById("barcodeCanvas");
  JsBarcode(canvas, text, { format: "CODE128", displayValue: false, margin: 0 });
  const dataUrl = canvas.toDataURL("image/png");
  return `<img src="${dataUrl}" style="max-width:100%; max-height:3.2cm;">`;
}

  function updateFontSize() {
  const size = document.getElementById("fontSize").value;
  document.getElementById("fontSizeLabel").textContent = size;
  document.getElementById("printArea").style.fontSize = size + "px";
}

function printContent() {
  const content = document.getElementById("printArea").value.trim();
  if (!content) {
    alert("اكتب المحتوى أولاً.");
    return;
  }

   const type = document.querySelector('input[name="printType"]:checked').value;
  const fontSize = document.getElementById("fontSize").value;
  let bodyHtml;

  if (type === "qr") {
    bodyHtml = `<div style="display:flex; align-items:center; justify-content:center; height:100%;">${buildQrImg(content)}</div>`;
  } else if (type === "barcode") {
    bodyHtml = `<div style="display:flex; align-items:center; justify-content:center; height:100%;">${buildBarcodeImg(content)}</div>`;
  } else {
    bodyHtml = `<div style="white-space:pre-wrap; font-size:${fontSize}px;">${escapeHtml(content)}</div>`;
  }

  const printWindow = window.open("", "_blank");
  printWindow.document.write(`
    <html>
    <head>
    <style>
      @page { size: 10cm 5cm; margin: 0; }
      html, body {
        margin:0;
        width:10cm;
        height:5cm;
        overflow:hidden;
      }
      body {
        box-sizing:border-box;
        padding:4px 8px;
        font-family: Tahoma, Arial, sans-serif;
        font-size:13px;
        line-height:1.3;
      }
    </style>
    </head>
    <body>${bodyHtml}</body>
    </html>
  `);
  printWindow.document.close();

  printWindow.onload = function() {
    printWindow.focus();
    printWindow.print();
  };

  printWindow.onafterprint = function() {
    printWindow.close();
  };

  // احتياطي في حالة عدم تفعيل onafterprint في بعض المتصفحات
  setTimeout(function() {
    if (!printWindow.closed) printWindow.close();
  }, 4000);
}
</script>
</body>
</html>
