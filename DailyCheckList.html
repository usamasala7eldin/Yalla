<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Checklist</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2329; --muted: #6b7580;
    --line: #e3e7eb; --accent: #0f8a6c; --danger: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121619; --card: #1c2226; --text: #e8ecef; --muted: #93a0aa;
      --line: #2b3338; --accent: #2fbf98; --danger: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .date { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .icon-btn { background: none; border: none; color: var(--text); cursor: pointer; padding: 8px; border-radius: 10px; line-height: 0; }
  .icon-btn:hover { background: var(--line); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }
  .progress { padding: 14px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; }
  .pct { font-size: 28px; font-weight: 700; }
  .summary { color: var(--muted); font-size: 13px; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  .sec-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 4px 6px; }
  .status { font-size: 13px; color: var(--muted); margin: 8px 4px 0; }
  .status:empty { display: none; }
  .empty { color: var(--muted); text-align: center; padding: 16px 8px; font-size: 14px; }

  .task { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: none; }
  .check { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 2px solid var(--muted); background: none; color: transparent; display: grid; place-items: center; padding: 0; cursor: pointer; }
  .check.static { cursor: default; }
  .task.done .check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .name { flex: 1; font-size: 15px; word-break: break-word; cursor: pointer; }
  .name.static { cursor: default; }
  .task.done .name { color: var(--muted); text-decoration: line-through; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer; }
  .count { min-width: 46px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
  .del { opacity: .4; color: var(--text); }
  .del:hover { opacity: 1; color: var(--danger); background: none; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { background: var(--card); width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px; }
  @media (min-width: 600px) { .overlay { align-items: center; } .modal { border-radius: 16px; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; }
  .modal h2 { font-size: 18px; margin: 0; }
  .modal h3 { font-size: 14px; margin: 18px 0 8px; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; font-size: 14px; }
  input, select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .primary { width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .msg { font-size: 13px; min-height: 18px; margin-top: 6px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }
  .hidden-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .hidden-row:last-child { border-bottom: none; }
  .small-btn { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; flex: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Daily Checklist</h1>
      <div class="date" id="date"></div>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="card progress">
    <div class="progress-top">
      <span class="pct" id="pct">0%</span>
      <span class="summary" id="summary"></span>
    </div>
    <div class="bar"><div id="barFill"></div></div>
  </div>
  <div class="status" id="status"></div>

  <div class="sec-title" id="todoTitle">To do</div>
  <div class="card" id="todoList"></div>

  <div class="sec-title" id="doneTitle">Done</div>
  <div class="card" id="doneList"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h2 id="settingsTitle">Settings</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <h3>Add a personal task</h3>
    <form id="addForm" autocomplete="off">
      <label class="field">Task name
        <input id="newName" type="text" maxlength="80" placeholder="e.g. Call 10 customers">
      </label>
      <label class="field">Type
        <select id="newType">
          <option value="check">Yes / No</option>
          <option value="count">Count</option>
        </select>
      </label>
      <label class="field" id="targetField" hidden>Target number
        <input id="newTarget" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 10">
      </label>
      <button class="primary" type="submit">Add task</button>
      <div class="msg" id="addMsg"></div>
    </form>

    <h3>Hidden tasks</h3>
    <div id="hiddenList"></div>
  </div>
</div>

<script>
  // Paste the published Google Sheet CSV link here.
  // Sheet format: column A, first row is a header, one task per row below it.
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/15WxgVKbUrr5ya4-XSllV9a548DTTQ0URRfWM41zoNQw/gviz/tq?tqx=out:csv';

  const KEYS = { hidden: 'dc_hidden', custom: 'dc_custom', progress: 'dc_progress', cache: 'dc_sheet_cache' };

  const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const TRASH_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  let sheetTasks = load(KEYS.cache, []);
  let hidden = load(KEYS.hidden, []);
  let custom = load(KEYS.custom, []);
  let progress = load(KEYS.progress, { date: today(), done: {} });

  const $ = id => document.getElementById(id);

  // Reset daily progress when the date changes.
  function ensureToday() {
    if (progress.date !== today()) {
      progress = { date: today(), done: {} };
      save(KEYS.progress, progress);
      return true;
    }
    return false;
  }

  function parseCSV(text) {
    const rows = []; let row = [], cell = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQuotes = false; }
        else cell += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c !== '\r') cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function setStatus(text) { $('status').textContent = text; }

  async function fetchSheet() {
    if (!SHEET_CSV_URL || SHEET_CSV_URL.startsWith('PASTE')) {
      setStatus('The task sheet link is not set yet.');
      render();
      return;
    }
    try {
      const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const rows = parseCSV(await res.text());
      const names = [];
      rows.slice(1).forEach(r => {
        const n = (r[0] || '').trim();
        if (n && !names.includes(n)) names.push(n);
      });
      sheetTasks = names;
      save(KEYS.cache, names);
      // Forget hidden tasks that were removed from the sheet.
      hidden = hidden.filter(h => names.includes(h));
      save(KEYS.hidden, hidden);
      setStatus('');
    } catch (e) {
      setStatus(sheetTasks.length
        ? 'You are offline. Showing the last saved list.'
        : 'Could not load the task list. Check your connection.');
    }
    render();
  }

  function allTasks() {
    const fromSheet = sheetTasks
      .filter(n => !hidden.includes(n))
      .map(n => ({ key: 's:' + n, name: n, type: 'check', source: 'sheet' }));
    const personal = custom.map(t => ({ key: 'c:' + t.id, id: t.id, name: t.name, type: t.type, target: t.target, source: 'custom' }));
    return fromSheet.concat(personal);
  }

  function countOf(t) { return Number(progress.done[t.key]) || 0; }
  function isDone(t) { return t.type === 'check' ? !!progress.done[t.key] : countOf(t) >= t.target; }
  function score(t) { return t.type === 'check' ? (isDone(t) ? 1 : 0) : Math.min(countOf(t) / t.target, 1); }

  function toggle(t) {
    ensureToday();
    if (progress.done[t.key]) delete progress.done[t.key];
    else progress.done[t.key] = true;
    save(KEYS.progress, progress);
    render();
  }

  function step(t, delta) {
    ensureToday();
    const v = Math.max(0, countOf(t) + delta);
    if (v === 0) delete progress.done[t.key];
    else progress.done[t.key] = v;
    save(KEYS.progress, progress);
    render();
  }

  function removeTask(t) {
    if (t.source === 'sheet') {
      if (!confirm('Hide "' + t.name + '"?\nYou can bring it back from Settings.')) return;
      hidden.push(t.name);
      save(KEYS.hidden, hidden);
    } else {
      if (!confirm('Delete "' + t.name + '" permanently?')) return;
      custom = custom.filter(c => c.id !== t.id);
      save(KEYS.custom, custom);
      delete progress.done[t.key];
      save(KEYS.progress, progress);
    }
    render();
    renderHidden();
  }

  function taskRow(t) {
    const row = document.createElement('div');
    row.className = 'task' + (isDone(t) ? ' done' : '');

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = t.name;

    if (t.type === 'check') {
      const btn = document.createElement('button');
      btn.className = 'check';
      btn.innerHTML = CHECK_SVG;
      btn.setAttribute('aria-label', isDone(t) ? 'Mark as not done' : 'Mark as done');
      btn.onclick = () => toggle(t);
      name.onclick = () => toggle(t);
      row.append(btn, name);
    } else {
      const mark = document.createElement('span');
      mark.className = 'check static';
      mark.innerHTML = CHECK_SVG;
      name.classList.add('static');

      const stepper = document.createElement('div');
      stepper.className = 'stepper';
      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.setAttribute('aria-label', 'Decrease');
      minus.onclick = () => step(t, -1);
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = countOf(t) + '/' + t.target;
      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.setAttribute('aria-label', 'Increase');
      plus.onclick = () => step(t, 1);
      stepper.append(minus, count, plus);

      row.append(mark, name, stepper);
    }

    const del = document.createElement('button');
    del.className = 'icon-btn del';
    del.innerHTML = TRASH_SVG;
    del.setAttribute('aria-label', 'Remove task');
    del.onclick = () => removeTask(t);
    row.append(del);

    return row;
  }

  function emptyNote(text) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = text;
    return d;
  }

  function render() {
    ensureToday();
    $('date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

    const tasks = allTasks();
    const todo = tasks.filter(t => !isDone(t));
    const done = tasks.filter(isDone);
    const total = tasks.length;
    const pct = total ? Math.round(tasks.reduce((sum, t) => sum + score(t), 0) / total * 100) : 0;

    $('pct').textContent = pct + '%';
    $('barFill').style.width = pct + '%';
    $('summary').textContent = done.length + ' of ' + total + ' done';
    $('todoTitle').textContent = 'To do (' + todo.length + ')';
    $('doneTitle').textContent = 'Done (' + done.length + ')';

    const todoList = $('todoList');
    todoList.replaceChildren();
    if (!total) todoList.append(emptyNote('No tasks yet. Add one from Settings.'));
    else if (!todo.length) todoList.append(emptyNote('All done for today. Great work!'));
    else todo.forEach(t => todoList.append(taskRow(t)));

    const doneList = $('doneList');
    doneList.replaceChildren();
    if (!done.length) doneList.append(emptyNote('Nothing finished yet.'));
    else done.forEach(t => doneList.append(taskRow(t)));
  }

  function renderHidden() {
    const list = $('hiddenList');
    list.replaceChildren();
    if (!hidden.length) {
      list.append(emptyNote('No hidden tasks.'));
      return;
    }
    hidden.forEach(n => {
      const row = document.createElement('div');
      row.className = 'hidden-row';
      const label = document.createElement('span');
      label.textContent = n;
      const btn = document.createElement('button');
      btn.className = 'small-btn';
      btn.textContent = 'Restore';
      btn.onclick = () => {
        hidden = hidden.filter(h => h !== n);
        save(KEYS.hidden, hidden);
        renderHidden();
        render();
      };
      row.append(label, btn);
      list.append(row);
    });
  }

  // Settings modal
  function openSettings() {
    renderHidden();
    $('addMsg').textContent = '';
    $('overlay').classList.add('open');
    $('newName').focus();
  }
  function closeSettings() { $('overlay').classList.remove('open'); }

  $('openSettings').onclick = openSettings;
  $('closeSettings').onclick = closeSettings;
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeSettings(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });

  $('newType').onchange = () => { $('targetField').hidden = $('newType').value !== 'count'; };

  function showMsg(text, ok) {
    const m = $('addMsg');
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('newName').value.trim();
    const type = $('newType').value;
    const target = parseInt($('newTarget').value, 10);

    if (!name) return showMsg('Please enter a task name.', false);
    const exists = allTasks().some(t => t.name.toLowerCase() === name.toLowerCase());
    if (exists) return showMsg('This task is already on your list.', false);
    if (type === 'count' && !(target >= 1)) return showMsg('Please enter a target of 1 or more.', false);

    custom.push({ id: Date.now().toString(36), name, type, target: type === 'count' ? target : null });
    save(KEYS.custom, custom);
    $('addForm').reset();
    $('targetField').hidden = true;
    showMsg('Task added.', true);
    render();
  });

  // Refresh when the user comes back to the page, and check for a new day every minute.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { render(); fetchSheet(); }
  });
  setInterval(() => { if (ensureToday()) render(); }, 60000);

  render();
  fetchSheet();
</script>
</body>
</html>
