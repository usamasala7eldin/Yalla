<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f9b8e">
<title>Cycle Count</title>
<style>
  :root {
    --bg: #eef4f3; --card: #ffffff; --text: #14302b; --muted: #5f7a75; --line: #dde8e6;
    --brand: #0f9b8e; --brand2: #2bb673; --ok: #14a37f; --danger: #e04f4f; --warn: #b7791f;
    --shadow: 0 2px 12px rgba(16, 60, 52, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1716; --card: #17221f; --text: #e6f2ef; --muted: #8fa9a3; --line: #26332f;
      --brand: #0c7f74; --brand2: #1f9a5f; --ok: #26b98f; --danger: #f06a6a; --warn: #e0a800;
      --shadow: 0 2px 12px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px;
    background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent;
  }
  button, input { font-family: inherit; }

  .top {
    position: sticky; top: 0; z-index: 5; color: #fff; padding: 14px 16px 12px;
    padding-top: max(14px, env(safe-area-inset-top));
    background: linear-gradient(135deg, var(--brand), var(--brand2)); box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
  }
  .top-inner { max-width: 640px; margin: 0 auto; }
  .row1 { display: flex; align-items: center; gap: 10px; }
  .row1 h1 { flex: 1; margin: 0; font-size: 19px; font-weight: 800; word-break: break-word; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; background: rgba(255, 255, 255, .2); border-radius: 8px; padding: 3px 9px; font-size: 14px; }
  .timer.warn { background: #fff; color: var(--warn); }
  .row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 14px; }
  .bar { height: 6px; background: rgba(255, 255, 255, .3); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: #fff; transition: width .3s; }
  .save-state { font-weight: 600; opacity: .95; }
  .search { width: 100%; margin-top: 10px; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: none; background: rgba(255, 255, 255, .95); color: #14302b; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; }
  .msg { text-align: center; margin: 18px 0; font-size: 15px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--ok); font-weight: 600; }

  .item { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px; border: 2px solid transparent; }
  .item.counted { border-color: color-mix(in srgb, var(--ok) 55%, transparent); background: color-mix(in srgb, var(--ok) 7%, var(--card)); }
  .info { flex: 1; min-width: 0; }
  .code { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .name { font-size: 16px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; margin-top: 2px; unicode-bidi: plaintext; text-align: start; }
  .stepper { display: flex; align-items: center; gap: 6px; flex: none; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font-size: 22px; font-weight: 700; cursor: pointer;
  }
  .stepper input {
    width: 64px; height: 44px; text-align: center; font-size: 18px; font-weight: 800; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .stepper input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .stepper input.bad { border-color: var(--danger); }
  input:disabled, button:disabled { opacity: .45; }
  .notice { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-inner">
    <div class="row1">
      <h1 id="taskName"></h1>
      <span class="timer" id="timer">--:--</span>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="row2">
      <span id="progress"></span>
      <span class="save-state" id="saveState"></span>
    </div>
    <input class="search" id="search" type="search" autocomplete="off" data-i18n-placeholder="search">
  </div>
</header>

<main class="wrap">
  <p class="msg" id="status"></p>
  <div id="list"></div>
  <p class="msg ok" id="allDone" hidden></p>
  <p class="notice" data-i18n="privacy"></p>
</main>

<script type="module">
/* ===================== Localisation ===================== */
const I18N = {
  en: {
    title: 'Cycle count',
    search: 'Search by item code or name',
    progress: '{n} of {total} counted',
    saving: 'Saving…',
    saved: 'Saved ✓',
    notSaved: 'Not saved, retrying…',
    allDone: 'All items are counted. You can go back to the computer.',
    noMatch: 'No items match your search.',
    loading: 'Loading…',
    noLink: 'Open this page by scanning the QR code from the Cycle Count page on the computer.',
    expired: 'This session has expired. Make a new QR code on the computer. Counts already sent are kept there.',
    ended: 'This count was finished on the computer.',
    error: 'Could not connect. Check the internet connection and try again.',
    decrease: 'Decrease', increase: 'Increase', countFor: 'Count for {code}',
    leaveWarning: 'Some counts are not saved yet.',
    privacy: 'Only item codes, names and your counts are shared, encrypted, with the computer that made the QR code. The session ends 30 minutes after the last count.'
  }
};
const LANG = 'en';
const t = (k, vars) => {
  let s = I18N[LANG][k] || k;
  if (vars) for (const [name, val] of Object.entries(vars)) s = s.replace('{' + name + '}', val);
  return s;
};
document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
document.title = t('title');

/* ===================== Firebase (same project as the other pages) ===================== */
const FIREBASE_URL = 'https://www.gstatic.com/firebasejs/10.12.2/';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyD-QSolp7uoEr0z_0NkOBIeEFAgllmi0ro',
  authDomain: 'sync-df6ca.firebaseapp.com',
  projectId: 'sync-df6ca',
  storageBucket: 'sync-df6ca.firebasestorage.app',
  messagingSenderId: '1091721719210',
  appId: '1:1091721719210:web:567cd4ce4056bfce45cfd3'
};
const COLLECTION = 'cycleCount';
const SESSION_TTL = 30 * 60 * 1000; // renewed on every save
const SAVE_DELAY = 700;
const SECRET_KEY = 'cyclecount:secret';

/* ===================== Encryption (key lives only in the link) ===================== */
const te = new TextEncoder(), td = new TextDecoder();
const toB64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
const toB64u = b => toB64(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64u = s => fromB64(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));
async function deriveSession(secretBytes) {
  const base = await crypto.subtle.importKey('raw', secretBytes, 'HKDF', false, ['deriveBits', 'deriveKey']);
  const salt = te.encode('cycle-count-v1');
  const idBits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt, info: te.encode('page-id') }, base, 128);
  const key = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: te.encode('content-key') },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  return { id: toB64u(new Uint8Array(idBits)), key };
}
async function encJSON(obj, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return toB64(iv) + '.' + toB64(new Uint8Array(ct));
}
async function decJSON(str, key) {
  const [iv, ct] = str.split('.');
  return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(iv) }, key, fromB64(ct))));
}

/* ===================== Page ===================== */
const $ = id => document.getElementById(id);
function status(text, cls) { $('status').className = 'msg ' + (cls || ''); $('status').textContent = text; }

let fs = null, ref = null, key = null;
let items = [];            // [{code, name}] — the phone never receives the System QTY
let counts = {};           // {code: whole number >= 0}
let expiresAt = 0, timer = null, saveTimer = null, dirty = false, saving = false, closed = false;
const inputs = new Map();  // code -> {row, input}

function cleanCounts(obj) {
  const out = {};
  if (obj && typeof obj === 'object') items.forEach(i => {
    const v = obj[i.code];
    if (Number.isInteger(v) && v >= 0) out[i.code] = v;
  });
  return out;
}

function closeSession(text) {
  if (closed) return;
  closed = true;
  clearInterval(timer);
  clearTimeout(saveTimer);
  dirty = false;
  try { sessionStorage.removeItem(SECRET_KEY); } catch (e) {}
  inputs.forEach(({ row }) => row.querySelectorAll('input, button').forEach(x => x.disabled = true));
  $('search').disabled = true;
  $('timer').textContent = '0:00';
  $('saveState').textContent = '';
  status(text, 'err');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function tick() {
  const left = expiresAt - Date.now();
  if (left <= 0) { closeSession(t('expired')); return; }
  const s = Math.ceil(left / 1000);
  $('timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  $('timer').classList.toggle('warn', s <= 120);
}

function updateProgress() {
  const n = Object.keys(counts).length;
  $('progress').textContent = t('progress', { n, total: items.length });
  $('barFill').style.width = (items.length ? n / items.length * 100 : 0) + '%';
  $('allDone').hidden = !(items.length && n === items.length);
  $('allDone').textContent = t('allDone');
}

function setSaveState(state) {
  $('saveState').textContent = state ? t(state) : '';
}

function paintRow(code) {
  const ent = inputs.get(code);
  if (!ent) return;
  const has = Number.isInteger(counts[code]);
  ent.row.classList.toggle('counted', has);
  if (document.activeElement !== ent.input) ent.input.value = has ? String(counts[code]) : '';
  ent.input.classList.remove('bad');
}

function scheduleSave() {
  dirty = true;
  setSaveState('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, SAVE_DELAY);
}

async function save() {
  if (closed || !dirty) return;
  if (saving) { saveTimer = setTimeout(save, 300); return; }
  saving = true;
  dirty = false;
  const newExpiry = Date.now() + SESSION_TTL;
  try {
    await fs.updateDoc(ref, {
      counts: await encJSON({ counts }, key),
      expiresAt: fs.Timestamp.fromMillis(newExpiry)
    });
    expiresAt = newExpiry;
    if (!dirty) setSaveState('saved');
  } catch (e) {
    dirty = true;
    setSaveState('notSaved');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 3000);
  }
  saving = false;
}

function setCount(code, value) {
  if (value === null) delete counts[code];
  else counts[code] = value;
  paintRow(code);
  updateProgress();
  scheduleSave();
}

function buildList() {
  const list = $('list');
  list.replaceChildren();
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item';
    row.dataset.search = (item.code + ' ' + item.name).toLowerCase();

    const info = document.createElement('div');
    info.className = 'info';
    const code = document.createElement('div');
    code.className = 'code';
    code.textContent = item.code;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = item.name || '—';
    name.dir = 'auto';
    info.append(code, name);

    const stepper = document.createElement('div');
    stepper.className = 'stepper';
    const minus = document.createElement('button');
    minus.type = 'button';
    minus.textContent = '−';
    minus.setAttribute('aria-label', t('decrease'));
    const input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.step = '1';
    input.inputMode = 'numeric';
    input.setAttribute('aria-label', t('countFor', { code: item.code }));
    const plus = document.createElement('button');
    plus.type = 'button';
    plus.textContent = '+';
    plus.setAttribute('aria-label', t('increase'));
    stepper.append(minus, input, plus);

    minus.onclick = () => {
      const cur = counts[item.code];
      setCount(item.code, Number.isInteger(cur) ? Math.max(cur - 1, 0) : 0);
    };
    plus.onclick = () => {
      const cur = counts[item.code];
      setCount(item.code, Number.isInteger(cur) ? cur + 1 : 1);
    };
    input.addEventListener('input', () => {
      const raw = input.value.trim();
      if (raw === '' && !input.validity.badInput) { setCount(item.code, null); return; }
      if (!/^\d+$/.test(raw)) { input.classList.add('bad'); return; }
      input.classList.remove('bad');
      setCount(item.code, parseInt(raw, 10));
    });
    input.addEventListener('blur', () => paintRow(item.code));
    input.addEventListener('focus', () => input.select());

    row.append(info, stepper);
    list.append(row);
    inputs.set(item.code, { row, input });
    paintRow(item.code);
  });
  updateProgress();
}

$('search').addEventListener('input', () => {
  const q = $('search').value.trim().toLowerCase();
  let shown = 0;
  inputs.forEach(({ row }) => {
    const match = !q || row.dataset.search.includes(q);
    row.hidden = !match;
    if (match) shown++;
  });
  status(shown ? '' : t('noMatch'));
});

window.addEventListener('beforeunload', e => {
  if (dirty || saving) { e.preventDefault(); e.returnValue = t('leaveWarning'); }
});

(async function init() {
  // Keep the key for this tab only, so an accidental refresh does not lose the session.
  let secret = location.hash.slice(1);
  if (secret) { try { sessionStorage.setItem(SECRET_KEY, secret); } catch (e) {} }
  else { try { secret = sessionStorage.getItem(SECRET_KEY) || ''; } catch (e) {} }
  history.replaceState(null, '', location.pathname); // do not keep the key in the browser history
  if (!secret) { status(t('noLink'), 'err'); return; }
  status(t('loading'));

  try {
    const raw = fromB64u(secret);
    if (raw.length !== 32) throw new Error('bad-link');
    const s = await deriveSession(raw);
    key = s.key;
    const app = await import(FIREBASE_URL + 'firebase-app.js');
    fs = await import(FIREBASE_URL + 'firebase-firestore.js');
    ref = fs.doc(fs.getFirestore(app.initializeApp(FIREBASE_CONFIG)), COLLECTION, s.id);
    const snap = await fs.getDoc(ref);
    if (!snap.exists()) { status(t('ended'), 'err'); return; }
    const d = snap.data();
    if (!d.expiresAt || d.expiresAt.toMillis() <= Date.now()) { status(t('expired'), 'err'); return; }
    const list = await decJSON(d.list || '', key);
    items = (Array.isArray(list.items) ? list.items : [])
      .filter(i => i && typeof i.code === 'string')
      .map(i => ({ code: i.code, name: typeof i.name === 'string' ? i.name : '' }));
    $('taskName').textContent = list.title || t('title');
    counts = d.counts ? cleanCounts((await decJSON(d.counts, key)).counts) : {};
    expiresAt = Date.now() + SESSION_TTL;
    await fs.updateDoc(ref, { joined: true, expiresAt: fs.Timestamp.fromMillis(expiresAt) });
  } catch (e) {
    try { sessionStorage.removeItem(SECRET_KEY); } catch (er) {}
    status(e && (e.message === 'bad-link' || e.name === 'OperationError') ? t('expired') : t('error'), 'err');
    return;
  }

  status('');
  $('top').hidden = false;
  buildList();
  tick();
  timer = setInterval(tick, 1000);

  // Follow changes made by the computer (session ended) or by another phone on the same QR.
  fs.onSnapshot(ref, async snap => {
    if (closed) return;
    if (!snap.exists()) { closeSession(t('ended')); return; }
    if (snap.metadata.hasPendingWrites) return;
    const d = snap.data();
    if (d.expiresAt && d.expiresAt.toMillis() > expiresAt) expiresAt = d.expiresAt.toMillis();
    if (dirty || saving || !d.counts) return;
    try {
      const remote = cleanCounts((await decJSON(d.counts, key)).counts);
      counts = remote;
      items.forEach(i => paintRow(i.code));
      updateProgress();
    } catch (e) { /* ignore anything that cannot be decrypted */ }
  }, () => {});
})();
</script>
</body>
</html>
