<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: single working column — inputs, summary band, then one row per business day (clock-out, clock-in, status). */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#f8faf9; --ink:#17201c; --muted:#5b6762; --line:#dde3e0;
  --accent:#0c6a57; --accent-ink:#ffffff; --accent-soft:#e2efeb;
  --ok:#1d7a4c; --ok-soft:#e5f3eb; --bad:#c32a2a; --bad-soft:#fcebea; --warn:#9a6200; --warn-soft:#fbf0d9;
  --blk:#141716; --blk-ink:#ffffff; --blk-line:#141716; --pend:#7a8580;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 14px rgba(20,32,28,.05);
  --f-display:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1211; --surface:#161b19; --surface-2:#1b211f; --ink:#e6ebe9; --muted:#9ba6a1; --line:#2a312e;
  --accent:#4dbd9c; --accent-ink:#06231c; --accent-soft:#15302a;
  --ok:#5cc58e; --ok-soft:#12281d; --bad:#ff6a62; --bad-soft:#341614; --warn:#e2a93b; --warn-soft:#2f240e;
  --blk:#000000; --blk-ink:#ffffff; --blk-line:#6b7470; --pend:#87928d;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1211; --surface:#161b19; --surface-2:#1b211f; --ink:#e6ebe9; --muted:#9ba6a1; --line:#2a312e;
  --accent:#4dbd9c; --accent-ink:#06231c; --accent-soft:#15302a;
  --ok:#5cc58e; --ok-soft:#12281d; --bad:#ff6a62; --bad-soft:#341614; --warn:#e2a93b; --warn-soft:#2f240e;
  --blk:#000000; --blk-ink:#ffffff; --blk-line:#6b7470; --pend:#87928d;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.results{display:flex;flex-direction:column;gap:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.store{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.icon{padding:7px 9px}
.btn svg{width:16px;height:16px}

/* Inputs */
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.paste{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.paste-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.paste-head label{font-weight:700;font-size:14px}
.paste-head .step{font-family:var(--f-mono);color:var(--accent);margin-right:6px}
.hint{color:var(--muted);font-size:12.5px}
textarea{width:100%;min-height:96px;max-height:220px;resize:vertical;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);
  font-family:var(--f-mono);font-size:11.5px;padding:8px 10px;line-height:1.4}
textarea::placeholder{color:var(--muted);font-family:var(--f-body);font-size:13px}
.parse{font-size:12.5px;display:flex;align-items:center;gap:6px;min-height:18px}
.parse.good{color:var(--ok)} .parse.bad{color:var(--bad)} .parse.idle{color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--ink)}
.boxes{display:flex;flex-direction:column;gap:6px}
.pbox{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);padding:3px 4px 3px 3px}
.pbox.filled{border-style:solid}
.pbox textarea{flex:0 0 150px;width:150px;height:32px;min-height:0;max-height:32px;resize:none;overflow:hidden;white-space:nowrap;border:0;border-radius:6px;
  background:var(--surface);color:var(--muted);font-size:11px;padding:7px 8px;line-height:1.4}
.pbox textarea::placeholder{font-size:12px}
.pmeta{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px}
.plabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plabel.good{color:var(--ok)} .plabel.bad{color:var(--bad)} .plabel.warn{color:var(--warn)} .plabel.idle{color:var(--muted)}
.xbtn{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 7px;border-radius:6px}
.xbtn:hover{color:var(--bad);background:var(--bad-soft)}
.addbtn{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--accent)}
.addbtn:hover{border-color:var(--accent)}
.savednote{font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:7px 10px}
.usual{font-family:var(--f-mono);font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:3px;margin-top:2px}
.usual b{color:var(--bad);font-weight:600}
.excsum{padding:10px 16px;font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-bottom:1px solid var(--line)}
.excsum.has{color:var(--bad);background:var(--bad-soft)}
.rowhint{grid-column:1/-1;font-size:12px;color:var(--bad);margin-top:-4px}

/* Store bar */
.storebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.storebar .code{font-family:var(--f-mono);font-weight:600}
.storebar .muted{color:var(--muted)}
.storebar.err{border-color:var(--bad);color:var(--bad)}
.savestate{display:inline-flex;align-items:center;gap:6px;font-weight:600;margin-left:auto}
.savestate.ok{color:var(--ok)} .savestate.bad{color:var(--bad)} .savestate.warn{color:var(--warn)}
.storebar input{font:inherit;font-family:var(--f-mono);width:96px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface-2);color:var(--ink)}
.storebar .btn{padding:4px 10px}
.btn[disabled]{opacity:.55;cursor:default}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Paste bar */
.pastebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pastebar .small{color:var(--muted);font-size:13px;flex:1;min-width:180px}
.btn.big{padding:11px 22px;font-size:15px}
.btn.big svg{width:18px;height:18px}

/* Banners */
.banner{border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:500}
.banner svg{flex:none;width:18px;height:18px}
.banner.sample{background:var(--accent-soft);color:var(--ink)}
.banner.alert{background:var(--bad);color:#fff}
.banner.alert b{font-weight:800}

/* Month chips */
.months{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.months .lbl{color:var(--muted);font-size:12px;margin-right:4px;text-transform:uppercase;letter-spacing:.06em}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Summary */
.summary{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.card .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .v{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.card .v small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.card .s{font-size:12.5px;color:var(--muted)}
.card.is-bad .v{color:var(--bad)} .card.is-ok .v{color:var(--ok)}
.meter-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.meter-row .m{font-size:12.5px;color:var(--muted);min-width:64px}
.meter{display:flex;gap:3px;flex:1;max-width:150px}
.meter i{flex:1;height:10px;border-radius:2px;background:var(--line)}
.meter.lv-ok i.on{background:var(--accent)} .meter.lv-warn i.on{background:var(--warn)} .meter.lv-bad i.on{background:var(--bad)}
.meter-row .c{font-family:var(--f-mono);font-weight:600;font-size:13px;min-width:44px;text-align:right}
.meter-row .c.lv-warn{color:var(--warn)} .meter-row .c.lv-bad{color:var(--bad)}
.tiny{background:none;border:0;padding:0;color:var(--accent);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}

.people{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.people .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.person{display:inline-flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.person b{font-weight:700}
.person .id{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.person .mins{font-family:var(--f-mono);font-weight:600}
.person.has .mins{color:var(--bad)} .person.zero .mins{color:var(--ok)}

/* Day list */
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list-head h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.res.warn{color:var(--warn);background:var(--warn-soft)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag.over{border-color:var(--bad);color:var(--bad)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.days{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.drow{display:grid;grid-template-columns:150px 1fr 1fr 150px;gap:14px;align-items:center;padding:11px 14px 11px 16px;border-top:1px solid var(--line);position:relative}
.drow:first-child{border-top:0}
.drow.colhead{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding-block:8px}
.drow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.drow.st-red{background:var(--bad-soft)} .drow.st-red::before{background:var(--bad)}
.drow.st-black::before{background:var(--blk-line)}
.date b{font-weight:700;display:block}
.date .wd{color:var(--muted);font-size:12.5px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:normal}
.tag.exc{border-color:var(--accent);color:var(--accent)}
.tag.late{border-color:var(--warn);color:var(--warn)}
.side{display:flex;flex-direction:column;gap:2px;min-width:0}
.side .lab{display:none;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.side .times{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.side .times .sch{color:var(--muted)}
.side .times .arr{color:var(--muted)}
.side .who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:5px;padding:1px 6px}
.res.ok{color:var(--ok);background:var(--ok-soft)}
.res.late,.res.missed{color:#fff;background:var(--bad)}
.res.excused{color:var(--accent);background:var(--accent-soft)}
.res.pending,.res.nodata{color:var(--pend);background:transparent;border:1px dashed var(--line)}
.status{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.red{background:var(--bad);color:#fff}
.pill.black{background:var(--blk);color:var(--blk-ink);border:1px solid var(--blk-line)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{color:var(--pend);border:1px dashed var(--line)}
.status .mins{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,14,13,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px 18px 16px}
.modal h3{margin:0 0 10px;font-family:var(--f-display);font-size:17px}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.modal .x{float:right;border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px}
.exc-list{list-style:none;padding:0!important}
.exc-list li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:7px}
.exc-list li:first-child{border-top:0;padding-top:0}
.exc-list .meta{color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;z-index:60}

@media (max-width:860px){
  .summary{grid-template-columns:1fr}
}
@media (max-width:680px){
  .inputs{grid-template-columns:1fr}
  .drow.colhead{display:none}
  .drow{grid-template-columns:1fr 1fr;gap:8px 12px}
  .drow .date{grid-column:1}
  .drow .status{grid-column:2;grid-row:1}
  .side .lab{display:block}
  .card .v{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-t="title"></h1>
      <span class="store" id="store" hidden></span>
    </div>
    <div class="actions">
      <button class="btn icon" id="rulesBtn" type="button" aria-label="Rules">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round"/></svg>
      </button>
      <button class="btn" id="copyBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
        <span data-t="copy"></span>
      </button>
    </div>
  </header>

  <section class="pastebar">
    <button class="btn primary big" id="pasteBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6" stroke-linecap="round"/></svg>
      <span data-t="pasteBtn"></span>
    </button>
    <span class="small" data-t="pasteHint"></span>
    <button class="linkbtn" id="clearBtn" type="button" data-t="clearPage"></button>
  </section>

  <section class="inputs" aria-label="Reports" hidden>
    <div class="paste">
      <div class="paste-head">
        <label><span class="step">1</span><span data-t="clockLabel"></span></label>
        <button class="linkbtn" type="button" data-clearall="clock" data-t="clearAll"></button>
      </div>
      <div class="hint" data-t="clockHint"></div>
      <div class="boxes" id="clockBoxes"></div>
      <button class="addbtn" type="button" id="addClock">+ <span data-t="addPage"></span></button>
      <div class="parse idle" id="clockStatus"></div>
    </div>
    <div class="paste">
      <div class="paste-head">
        <label><span class="step">2</span><span data-t="schedLabel"></span></label>
        <button class="linkbtn" type="button" data-clearall="sched" data-t="clearAll"></button>
      </div>
      <div class="hint" data-t="schedHint"></div>
      <div class="savednote" id="schedSaved" hidden></div>
      <div class="boxes" id="schedBoxes"></div>
      <button class="addbtn" type="button" id="addSched">+ <span data-t="addMonth"></span></button>
      <div class="parse idle" id="schedStatus"></div>
    </div>
  </section>

  <div class="storebar" id="storeBar" hidden></div>
  <div id="banner"></div>
  <div class="results" id="results" hidden>
  <div class="months" id="months" hidden></div>
  <section class="summary" id="summary"></section>
  <div class="people" id="people"></div>

  <section>
    <div class="list-head" style="margin-bottom:10px">
      <h2 data-t="daysTitle"></h2>
      <div class="seg" role="group">
        <button type="button" id="fIssues" data-f="issues" aria-pressed="true"></button>
        <button type="button" id="fAction" data-f="action" aria-pressed="false"></button>
        <button type="button" id="fExc" data-f="exc" aria-pressed="false"></button>
        <button type="button" id="fAll" data-f="all" aria-pressed="false"></button>
      </div>
    </div>
    <div class="days" id="days"></div>
  </section>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true"><button class="x" type="button" id="modalX" aria-label="Close">×</button><div id="modalBody"></div></div></div>

<script src="attendance-core.js"></script>
<script>
/* ---------- Strings (localization-ready: add another language object with the same keys) ---------- */
const STR = { en: {
  title:"Attendance Check", copy:"Copy summary", clear:"Clear",
  clockLabel:"Employee InOut", clockHint:"Copy the whole page and paste it below. If the report has more than one page, add each page.",
  schedLabel:"Store Attendance Duty", schedHint:"Copy the whole page and paste it below. Add each month you want to check.",
  addPage:"Add page", addMonth:"Add month", clearAll:"Clear all", remove:"Remove", pastePh:"Click, then Ctrl+V",
  boxNone:"Nothing found in this paste", boxDup:"Already added above", boxClock:"{n} punches · {from} – {to}", boxSched:"{months} · {n} days", boxMulti:"This paste has more than one pharmacy. Paste only your pharmacy's page.",
  schedMulti:"The pasted schedules belong to different pharmacies. Keep only your pharmacy's pages.",
  clockOk:"Total: {n} punches · {from} – {to} · {p} pharmacist(s)", clockNone:"No punches found. Copy the whole Employee InOut page, including the table rows.",
  schedOk:"Total: {n} days · {months}", schedNone:"No days found. Copy the whole Store Attendance Duty page, including the dated rows.",
  dupNote:" · {d} duplicate(s) ignored", waiting:"Waiting for paste",
  empty:"",

function summarize(A, scope) {

  const days = A.days.filter(d => inScope(d.day));
  const compared = days.filter(d => d.compared);
  const total = days.reduce((a, d) => a + d.minutes, 0);
  const avg = compared.length ? total / compared.length : 0;
  let missed = 0; const people = new Map();
  for (const d of days) for (const c of [d.sides.out, d.sides.in]) {
    if (c.state === "missed") missed++;
    if (c.rec) { const k = c.rec.id; if (!people.has(k)) people.set(k, { id: k, name: c.rec.name, mins: 0 }); people.get(k).mins += c.minutes; }
    else if (c.minutes) { if (!people.has("_")) people.set("_", { id: "", name: t("unassigned"), mins: 0 }); people.get("_").mins += c.minutes; }
  }
  const months = [...A.excByMonth.keys()].concat(days.map(d => monthKey(d.day)));
  const monthSet = [...new Set(months)].filter(m => scope === "all" || m === scope).sort();
  const exc = monthSet.map(m => { const l = A.excByMonth.get(m) || []; return { m, n: l.length, late: l.filter(e => e.lateEdit).length, list: l }; });
  const red = days.filter(d => d.status === "red");
  return { days, compared: compared.length, total, avg, missed, people: [...people.values()].sort((a, b) => b.mins - a.mins), exc, red };
}

  const lateEdits = S.exc.reduce((a, e) => a + e.late, 0);
  $("summary").innerHTML = `
    <div class="card ${S.total ? "is-bad" : "is-ok"}"><div class="k">${esc(t("totalK"))}</div><div class="v">${S.total}<small>${esc(t("minUnit"))}</small></div><div class="s">${esc(t("totalS", { days: S.compared }))}</div></div>
    <div class="card ${avgBad ? "is-bad" : "is-ok"}"><div class="k">${esc(t("avgK"))}</div><div class="v">${S.avg.toFixed(2)}<small>${esc(t("minUnit"))}</small></div><div class="s">${esc(t("avgS"))}</div></div>
    <div class="card"><div class="k"><span>${esc(t("excK"))}</span><button type="button" class="tiny" id="excBtn">${esc(t("excView"))}</button></div>${excRows}<div class="s">${esc(t("excLimit", { n: lateEdits }))}</div></div>`;
  $("excBtn").onclick = () => { state.filter = "exc"; render(); $("days").scrollIntoView({ behavior: "smooth", block: "start" }); };

  // people
  $("people").innerHTML = S.people.length ? `<span class="lbl">${esc(t("peopleLbl"))}</span>` + S.people.map(p =>
    `<span class="person ${p.mins ? "has" : "zero"}"><b>${esc(p.name)}</b>${p.id ? `<span class="id">${esc(p.id)}</span>` : ""}<span class="mins">${p.mins} ${esc(t("minUnit"))}</span></span>`).join("") : "";

  // filter buttons
  const issues = S.days.filter(d => d.issue);
  const action = A.days.filter(d => d.status === "red").sort((a, b) => a.day - b.day);
  const excList = S.exc.flatMap(e => e.list).sort((a, b) => b.day - a.day);
  $("fIssues").textContent = t("fIssues", { n: issues.length });
  $("fAction").textContent = t("fAction", { n: action.length });
  $("fExc").textContent = t("fExc", { n: excList.length });
  $("fAll").textContent = t("fAll", { n: S.days.length });
  for (const id of ["fIssues", "fAction", "fExc", "fAll"]) $(id).setAttribute("aria-pressed", state.filter === $(id).dataset.f);

  const head = `<div class="drow colhead"><span>${esc(t("colDate"))}</span><span>${esc(t("colOut"))}</span><span>${esc(t("colIn"))}</span><span style="text-align:right">${esc(t("colStatus"))}</span></div>`;
  if (state.filter === "exc") {
    const bad = excList.filter(e => e.lateEdit || e.over);
    const added = bad.reduce((a, e) => a + e.added, 0);
    const sum = `<div class="excsum ${bad.length ? "has" : ""}">${esc(bad.length ? t("excSum", { m: added, n: bad.length }) : t("excSumOk"))}</div>`;
    $("days").innerHTML = excList.length ? sum + head + excList.map(excRow).join("") : `<div class="empty">${esc(t("noExc"))}</div>`;
    return;
  }
  const rows = state.filter === "issues" ? issues : state.filter === "action" ? action : S.days;
  $("days").innerHTML = rows.length ? head + rows.map(d => dayRow(d, state.filter === "action")).join("") :
    `<div class="empty">${esc(!S.days.length ? t("noDays") : state.filter === "action" ? t("noAction") : t("noIssues"))}</div>`;
}

function sideCell(c, labelKey, extra = "") {
  if (c.state === "none") return `<div class="side"><span class="lab">${esc(t(labelKey))}</span><span class="who">—</span></div>`;
  const act = c.rec ? fmt12(c.rec.tsMin) : "—";
  const res = c.state === "ok" ? t("rOk") : c.state === "late" ? t("rLate", { m: c.minutes }) : c.state === "missed" ? t("rMissed")
    : c.state === "excused" ? t("rExcused") : c.state === "pending" ? t("rPending") : t("rNodata");
  const who = c.rec ? esc(c.rec.name) + " · " + esc(c.rec.id) : (c.state === "missed" ? esc(t("unassigned")) : "");
  const sch = c.state === "excused" ? "" : `<span class="sch">${esc(t("sched"))} ${esc(c.schedText)}</span><span class="arr">→</span>`;
  return `<div class="side"><span class="lab">${esc(t(labelKey))}</span>
    <span class="times">${sch}<span>${esc(act)}</span><span class="res ${c.state}">${esc(res)}</span></span>
    ${who ? `<span class="who">${who}</span>` : ""}${extra}</div>`;
}

function dayRow(d, hint) {
  const x = ymd(d.day);
  const tags = [];
  if (d.exc.counted) tags.push(`<span class="tag exc">${esc(t("tagExc"))}</span>`);
  if (d.exc.lateEdit) tags.push(`<span class="tag late">${esc(t("tagLate"))}</span>`);
  if (d.exc.over) tags.push(`<span class="tag over">${esc(t("tagOver"))}</span>`);
  if (d.exc.planned) tags.push(`<span class="tag">${esc(t("tagPlanned"))}</span>`);
  if (d.exc.holiday) tags.push(`<span class="tag exc"><bdi>${esc(d.exc.holiday)}</bdi></span>`);
  let pill;
  if (d.status === "red") pill = `<span class="pill red">${esc(d.left === 0 ? t("stRedToday") : t("stRed", { n: d.left }))}</span><span class="mins">${esc(t("deadline", { date: fmtDay(d.day + 4) }))}</span>`;
  else if (d.status === "black") {
    // After the 4 days a fix may still go through: always in this month, and for up to 10 days for a day from last month.
    const today = nowParts().today, open = monthKey(d.day) === monthKey(today) || today <= d.day + 10;
    pill = `<span class="mins" style="font-weight:600">${d.minutes} ${esc(t("minUnit"))}</span>` + (open
      ? `<span class="pill black">${esc(t("stBlack"))}</span><span class="mins">${esc(t("stBlackS"))}</span>`
      : `<span class="pill black">${esc(t("stClosed"))}</span>`);
  }
  else if (d.status === "ok") pill = `<span class="pill ok">${esc(t("stOk"))}</span>`;
  else if (d.status === "nodata") pill = `<span class="pill wait">${esc(t("stNodata"))}</span>`;
  else pill = `<span class="pill wait">${esc(t("stWait"))}</span>`;
  if (d.status === "red") pill = `<span class="mins" style="color:var(--bad);font-weight:600">${d.minutes} ${esc(t("minUnit"))}</span>` + pill;
  return `<div class="drow st-${d.status}">
    <div class="date"><b>${x.d} ${MONS[x.m]}</b><span class="wd">${WDN[x.wd]}</span>${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}</div>
    ${sideCell(d.sides.out, "colOut")}
    ${sideCell(d.sides.in, "colIn")}
    <div class="status">${pill}</div>
    ${hint ? `<div class="rowhint">${esc(t("rowHint"))}</div>` : ""}</div>`;
}

function excRow(e) {
  const d = e.dayRef, x = ymd(e.day);
  const who = (state.A.names.get(e.byId) ? state.A.names.get(e.byId) + " · " : "") + e.byId;
  const ed = e.updMin != null ? fmtDay(Math.floor(e.updMin / 1440)) + ", " + fmt12(e.updMin) : "—";
  const tags = [
    e.lateEdit ? `<span class="tag late">${esc(t("excAfter", { n: e.editLag }))}</span>` : `<span class="tag exc">${esc(t("excWithin"))}</span>`,
    e.over ? `<span class="tag over">${esc(t("excOverRank", { r: e.rank }))}</span>` : `<span class="tag">${esc(t("excRank", { r: e.rank }))}</span>`
  ].join("");
  const usualLine = side => {
    const a = e.alt && e.alt[side]; if (!a) return "";
    const res = a.minutes ? `<b>${esc(t("rLate", { m: a.minutes }))}</b>` : esc(t("rOk"));
    return `<span class="usual">${esc(t("usual", { time: fmt12(a.usual) }))} → ${res}</span>`;
  };
  const bad = e.lateEdit || e.over;
  let pill;
  if (!bad) pill = `<span class="pill ok">${esc(t("pillRulesOk"))}</span>`;
  else if (e.added) pill = `<span class="pill red">${esc(t("ifRejected", { m: e.added }))}</span>`;
  else pill = `<span class="pill warn">${esc(t("ifRejectedZero"))}</span>`;
  const now = d && d.minutes ? `<span class="mins">${esc(t("countedNow", { m: d.minutes }))}</span>` : "";
  const edited = `<span class="mins">${esc(t("excEdited", { date: ed, who }))}</span>`;
  const out = d ? sideCell(d.sides.out, "colOut", usualLine("out")) : `<div class="side"></div>`;
  const inn = d ? sideCell(d.sides.in, "colIn", usualLine("in")) : `<div class="side"></div>`;
  return `<div class="drow ${bad ? "st-red" : "st-ok"}">
    <div class="date"><b>${x.d} ${MONS[x.m]}</b><span class="wd">${WDN[x.wd]}</span><div class="tags">${tags}</div></div>
    ${out}${inn}
    <div class="status">${pill}${now}${edited}</div></div>`;
}

/* ---------- Modal, copy, toast ---------- */
function openModal(html) { $("modalBody").innerHTML = html; $("modal").hidden = false; $("modalX").focus(); }
function closeModal() { $("modal").hidden = true; }
function openRules() {
  openModal(`<h3>${esc(t("rulesTitle"))}</h3><ul>${STR[LANG].rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`);
}
function openExc() {
  const items = state.S.exc.flatMap(e => e.list).sort((a, b) => a.day - b.day);
  const body = items.length ? `<ul class="exc-list">${items.map(e => {
    const who = (state.A.names.get(e.byId) ? state.A.names.get(e.byId) + " · " : "") + e.byId;
    const ed = e.updMin != null ? fmtDay(Math.floor(e.updMin / 1440)) + " " + fmt12(e.updMin) : "—";
    return `<li><span><b>${esc(fmtDayLong(e.day))}</b><br><span class="meta">${esc(t("excEdited", { date: ed, who }))}</span></span>
      <span class="${e.lateEdit ? "res late" : "res excused"}" style="align-self:center;white-space:nowrap">${esc(e.lateEdit ? t("excLateEdit") : t("excCounted"))}</span></li>`;
  }).join("")}</ul>` : `<p class="meta">${esc(t("excNone"))}</p>`;
  openModal(`<h3>${esc(t("excTitle"))}</h3>${body}`);
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 1800);
}
function summaryText() {
  const S = state.S, scope = state.scope === "all" ? t("allMonths") : monthName(state.scope);
  const L = [t("cpHead", { store: state.store || "—", scope }), t("cpTotal", { t: S.total, a: S.avg.toFixed(2) }), t("cpMissed", { n: S.missed })];
  S.exc.forEach(e => L.push(t("cpExc", { m: monthName(e.m), n: e.n })));
  if (S.people.length) L.push(t("cpBy", { list: S.people.map(p => p.name + " " + p.mins).join(" · ") }));
  const iss = S.days.filter(d => d.issue);
  L.push("", iss.length ? t("cpIssues") : t("cpNone"));
  for (const d of iss) for (const c of [d.sides.out, d.sides.in]) {
    if (!c.minutes) continue;
    const label = t(c.side === "out" ? "colOut" : "colIn");
    const act = c.rec ? fmt12(c.rec.tsMin) : "—";
    const who = c.rec ? c.rec.name : t("unassigned");
    L.push(`${fmtDayLong(d.day)} · ${label} · ${t("sched")} ${c.schedText} · ${act} · ${c.minutes} ${t("minUnit")} · ${who}`);
  }
  return L.join("\n");
}
function copySummary() {
  const txt = summaryText();
  const fallback = () => { openModal(`<h3>${esc(t("copy"))}</h3><textarea id="cpTa" style="min-height:240px">${esc(txt)}</textarea>`); const ta = $("cpTa"); ta.focus(); ta.select(); toast(t("copyFail")); };
  try { navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback); } catch (e) { fallback(); }
}

/* ---------- Boot ---------- */
/* ---------- One Paste button: it reads what was copied and puts it in the right place ---------- */
function addPasted(text) {
  if (!text || !text.trim()) return false;
  let kind = null;
  if (parseClock(text).recs.length) kind = "clock";
  else {
    const p = parseSchedule(text);
    if (p.multi) { toast(t("boxMulti")); return true; }
    if (p.byDay.size) kind = "sched";
  }
  if (!kind) { toast(t("pasteNone")); return true; }
  const host = $(HOST[kind]), areas = [...host.querySelectorAll("textarea")];
  if (areas.some(x => x.value === text)) { toast(t("pasteDup")); return true; }
  let ta = areas.find(x => !x.value.trim());
  if (!ta) { addBox(kind); ta = host.lastElementChild.querySelector("textarea"); }
  ta.value = text; schedule();
  toast(kind === "clock" ? t("pastedClock") : t("pastedSched"));
  return true;
}
async function pasteFromClipboard() {
  try {
    const txt = await navigator.clipboard.readText();
    if (!addPasted(txt)) toast(t("clipEmpty"));
  } catch (e) { toast(t("pressCtrlV")); }
}
function clearAllPastes() {
  for (const k of ["clock", "sched"]) { $(HOST[k]).innerHTML = ""; addBox(k); }
  state.scope = null; run();
}

function boot() {
  applyStrings();
  addBox("clock"); addBox("sched");
  $("addClock").onclick = () => addBox("clock", true);
  $("addSched").onclick = () => addBox("sched", true);
  document.querySelectorAll("[data-clearall]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.clearall; $(HOST[k]).innerHTML = ""; addBox(k); state.scope = null; run();
  }));
  $("months").addEventListener("click", e => { const b = e.target.closest("[data-scope]"); if (b) { state.scope = b.dataset.scope; render(); } });
  for (const id of ["fIssues", "fAction", "fExc", "fAll"]) $(id).onclick = () => { state.filter = $(id).dataset.f; render(); };
  $("rulesBtn").onclick = openRules;
  $("copyBtn").onclick = copySummary;
  $("pasteBtn").onclick = pasteFromClipboard;
  $("clearBtn").onclick = clearAllPastes;
  // Ctrl+V anywhere on the page works the same as the Paste button.
  document.addEventListener("paste", e => {
    const el = e.target;
    if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return;
    const txt = e.clipboardData && e.clipboardData.getData("text");
    if (txt) { e.preventDefault(); addPasted(txt); }
  });
  $("modalX").onclick = closeModal;
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });
  run();
}
if (typeof document !== "undefined" && document.getElementById("clockBoxes")) boot();
</script>
