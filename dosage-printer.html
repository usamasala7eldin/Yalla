<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طباعة جرعات الأدوية</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, Arial, sans-serif; background:#f2f2f2; margin:0; }

  .layout { display:flex; min-height:100vh; }
   .main { flex:1; margin-right:22%; padding:20px 25px 240px 25px; }
  .sidebar {
    width:22%; position:fixed; right:0; top:0; bottom:0;
    background:#fff; border-left:2px solid #ddd; padding:15px;
    overflow-y:auto;
  }

  .back { text-decoration:none; color:#2b7de9; font-size:14px; }
  h2 { color:#333; margin-top:10px; }

  .card { background:#fff; padding:16px 18px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px; }
  .card h4 { margin:0 0 12px; color:#333; font-size:16px; }

  input[type=text] { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
  .productName { margin-top:8px; font-size:14px; color:#2b7de9; font-weight:bold; }
  .smallBtn { margin-top:8px; padding:6px 12px; border:none; border-radius:6px; background:#2b7de9; color:#fff; font-size:13px; cursor:pointer; }
  .defaultNote { margin-top:8px; background:#fff8e1; border:1px solid #ffe08a; padding:8px; border-radius:6px; font-size:13px; }

  .optionsGrid { display:flex; flex-wrap:wrap; gap:8px; }
  .optionsGrid button { padding:10px 16px; border:1px solid #2b7de9; border-radius:20px; background:#fff; color:#2b7de9; font-size:14px; cursor:pointer; }
  .optionsGrid button.selected { background:#2b7de9; color:#fff; }
  .optionsGrid button.type-selected { background:#f39c12; border-color:#f39c12; color:#fff; }

  #doseSection.hidden { display:none; }

    .floatingBar {
    position:fixed; bottom:0; left:0; right:22%; width:auto;
    background:#eef5ff; border-top:3px solid #2b7de9;
    padding:14px 25px; z-index:50;
  }
  .floatingBar textarea {
    width:100%; min-height:60px; padding:10px; border:1px solid #cfe0fb;
    border-radius:8px; font-size:14px; font-family:inherit; resize:vertical;
  }
  .floatingBar .row { display:flex; gap:10px; margin-top:10px; align-items:center; }
  .floatingBar .row label { font-size:13px; display:flex; align-items:center; gap:5px; }
  .floatingBar .row input[type=text] { flex:1; }
  .floatingBar .actions { display:flex; gap:10px; margin-top:10px; }
  .floatingBar button.add { flex:1; padding:12px; border:none; border-radius:8px; background:#27ae60; color:#fff; font-size:15px; cursor:pointer; }
  .floatingBar button.saveDefault { padding:12px 16px; border:none; border-radius:8px; background:#f39c12; color:#fff; font-size:14px; cursor:pointer; white-space:nowrap; }

  .sidebar h3 { margin-top:0; font-size:16px; }
  .printAllBtn { width:100%; padding:12px; border:none; border-radius:8px; background:#2b7de9; color:#fff; font-size:15px; cursor:pointer; margin-bottom:15px; }
  .labelPreview {
    width:100%; aspect-ratio: 2 / 1; border:1px dashed #999; border-radius:8px;
    padding:8px; margin-bottom:12px; font-size:12px; white-space:pre-wrap;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    position:relative;
  }
  .labelPreview button {
    position:absolute; top:4px; left:4px; background:#e74c3c; color:#fff;
    border:none; border-radius:5px; padding:3px 7px; font-size:11px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="layout">
  <div class="main">
    <a class="back" href="index.html">‹ رجوع</a>
    <h2>طباعة جرعات الأدوية</h2>

    <div class="card">
      <input type="text" id="productInput" placeholder="اضرب الباركود أو اكتب اسم الصنف يدويًا" autofocus>
      <div class="productName" id="productNameDisplay"></div>
      <button class="smallBtn" id="addNameBtn" style="display:none;" onclick="appendToFloatBox(currentProductName)">+ أضف الاسم للنص</button>
      <div class="defaultNote" id="defaultNote" style="display:none;">
        فيه جرعة افتراضية محفوظة لهذا الصنف.
        <button class="smallBtn" onclick="useDefaultDose()">استخدم الجرعة الافتراضية</button>
      </div>
    </div>

    <div class="card">
      <h4>نوع الدواء</h4>
      <div class="optionsGrid" id="typeOptions">
        <button data-value="حبوب">حبوب</button>
        <button data-value="شراب">شراب</button>
        <button data-value="حقن">حقن</button>
        <button data-value="دهان">دهان</button>
      </div>
    </div>

    <div class="card" id="doseSection">
      <h4>الجرعة</h4>
      <div class="optionsGrid" id="doseOptions"></div>
    </div>

    <div class="card">
      <h4>عدد المرات</h4>
      <div class="optionsGrid" id="frequencyOptions">
        <button data-value="مرة يوميًا">مرة يوميًا</button>
        <button data-value="مرتين يوميًا">مرتين يوميًا</button>
        <button data-value="3 مرات يوميًا">3 مرات يوميًا</button>
        <button data-value="4 مرات يوميًا">4 مرات يوميًا</button>
        <button data-value="كل 24 ساعة">كل 24 ساعة</button>
        <button data-value="كل 12 ساعة">كل 12 ساعة</button>
        <button data-value="كل 8 ساعات">كل 8 ساعات</button>
        <button data-value="كل 6 ساعات">كل 6 ساعات</button>
        <button data-value="كل أسبوع">كل أسبوع</button>
      </div>
    </div>

    <div class="card">
      <h4>التوقيت بالنسبة للأكل</h4>
      <div class="optionsGrid" id="timingOptions">
        <button data-value="بعد الأكل">بعد الأكل</button>
        <button data-value="قبل الأكل">قبل الأكل</button>
      </div>
    </div>

    <div class="card">
      <h4>المدة</h4>
      <div class="optionsGrid" id="durationOptions"></div>
    </div>
  </div>

  <div class="sidebar">
    <h3>اللزقات اللي هتتطبع (<span id="countDisplay">0</span>)</h3>
    <button class="printAllBtn" onclick="printAll()">طباعة الكل</button>
    <div id="listContainer"></div>
  </div>
</div>

<div class="floatingBar">
  <textarea id="floatBox" placeholder="اختر من فوق أو اكتب هنا مباشرة..."></textarea>
  <div class="row">
    <label><input type="checkbox" id="addQrCheckbox" onchange="toggleQrInput()"> أضف QR</label>
    <input type="text" id="qrText" placeholder="النص اللي هيتحول QR" style="display:none;">
  </div>
  <div class="actions">
    <button class="add" onclick="addToList()">+ أضف للقائمة</button>
    <button class="saveDefault" onclick="saveAsDefault()">احفظ كجرعة افتراضية</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDiUHVrUZgao7YcAILYlAr4409A6v1_Mw",
  authDomain: "whatsapp-qr-codes.firebaseapp.com",
  projectId: "whatsapp-qr-codes",
  storageBucket: "whatsapp-qr-codes.firebasestorage.app",
  messagingSenderId: "819509086046",
  appId: "1:819509086046:web:a587462b73a07c574531cf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentBarcode = null;
let currentProductName = "";
let currentType = null;
let currentFrequency = null;
let entries = [];

function appendToFloatBox(text) {
  if (!text) return;
  const box = document.getElementById("floatBox");
  const current = box.value.trim();
  box.value = current ? current + " - " + text : text;
}

// ---------- نوع الدواء ----------
document.querySelectorAll("#typeOptions button").forEach(btn => {
  btn.onclick = () => {
    currentType = btn.dataset.value;
    document.querySelectorAll("#typeOptions button").forEach(b => b.classList.remove("type-selected"));
    btn.classList.add("type-selected");

    if (currentType === "دهان") {
      document.getElementById("doseSection").classList.add("hidden");
      appendToFloatBox("دهان");
    } else {
      document.getElementById("doseSection").classList.remove("hidden");
      buildDoseOptions();
    }
  };
});

function buildDoseOptions() {
  const container = document.getElementById("doseOptions");
  container.innerHTML = "";
  let values = [];

  if (currentType === "حبوب") {
    values = ["1 حبة", "2 حبة", "3 حبة", "4 حبة"];
  } else if (currentType === "شراب") {
    for (let v = 0.5; v <= 20; v += 0.5) {
      values.push((v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)) + " مل");
    }
  } else if (currentType === "حقن") {
    for (let v = 1; v <= 60; v++) {
      values.push(v + " وحدة");
    }
  }

  values.forEach(v => {
    const btn = document.createElement("button");
    btn.textContent = v;
    btn.onclick = () => appendToFloatBox(v);
    container.appendChild(btn);
  });
}

// ---------- عدد المرات ----------
document.querySelectorAll("#frequencyOptions button").forEach(btn => {
  btn.onclick = () => {
    currentFrequency = btn.dataset.value;
    appendToFloatBox(currentFrequency);
    buildDurationOptions();
  };
});

// ---------- التوقيت ----------
document.querySelectorAll("#timingOptions button").forEach(btn => {
  btn.onclick = () => appendToFloatBox(btn.dataset.value);
});

// ---------- المدة ----------
function buildDurationOptions() {
  const container = document.getElementById("durationOptions");
  container.innerHTML = "";
  let values = [];

  if (currentFrequency === "كل أسبوع") {
    values = ["أسبوع", "أسبوعين", "3 أسابيع", "شهر", "شهرين", "3 شهور"];
  } else {
    values = ["3 أيام", "4 أيام", "5 أيام", "أسبوع", "شهر", "شهرين", "3 شهور"];
  }

  values.forEach(v => {
    const btn = document.createElement("button");
    btn.textContent = v;
    btn.onclick = () => appendToFloatBox("لمدة " + v);
    container.appendChild(btn);
  });
}
buildDurationOptions();

// ---------- البحث عن الصنف ----------
document.getElementById("productInput").addEventListener("change", async function() {
  const value = this.value.trim();
  const nameDisplay = document.getElementById("productNameDisplay");
  const addNameBtn = document.getElementById("addNameBtn");
  const defaultNote = document.getElementById("defaultNote");
  defaultNote.style.display = "none";

  if (/^[0-9]{6,}$/.test(value)) {
    try {
      const doc = await db.collection("products").doc(value).get();
      if (doc.exists) {
        currentBarcode = value;
        const data = doc.data();
        currentProductName = data.ar || data.en || value;
        nameDisplay.textContent = "الصنف: " + currentProductName;
        addNameBtn.style.display = "inline-block";

        const defaultDoc = await db.collection("defaultDoses").doc(value).get();
        if (defaultDoc.exists) {
          window._defaultDoseText = defaultDoc.data().text || "";
          defaultNote.style.display = "block";
        }
      } else {
        currentBarcode = value;
        currentProductName = value;
        nameDisplay.textContent = "باركود غير مسجل، هيتم استخدام الرقم كاسم مؤقت";
        addNameBtn.style.display = "inline-block";
      }
    } catch (e) {
      nameDisplay.textContent = "حصل خطأ في البحث، حاول تاني";
    }
  } else {
    currentBarcode = null;
    currentProductName = value;
    nameDisplay.textContent = value ? "الصنف: " + value : "";
    addNameBtn.style.display = value ? "inline-block" : "none";
  }
});

function useDefaultDose() {
  document.getElementById("floatBox").value = window._defaultDoseText || "";
}

async function saveAsDefault() {
  if (!currentBarcode) {
    alert("لازم تدخل الصنف بالباركود الأول عشان تقدر تحفظ جرعة افتراضية.");
    return;
  }
  const text = document.getElementById("floatBox").value.trim();
  if (!text) {
    alert("اكتب أو اختار الجرعة الأول.");
    return;
  }
  await db.collection("defaultDoses").doc(currentBarcode).set({ text });
  alert("تم حفظ الجرعة كافتراضية لهذا الصنف.");
}

// ---------- إضافة للقائمة ----------
function toggleQrInput() {
  document.getElementById("qrText").style.display = document.getElementById("addQrCheckbox").checked ? "block" : "none";
}

function addToList() {
  const text = document.getElementById("floatBox").value.trim();
  if (!text) {
    alert("اكتب أو اختار الجرعة الأول.");
    return;
  }

  const addQr = document.getElementById("addQrCheckbox").checked;
  const qrText = document.getElementById("qrText").value.trim();

  entries.push({
    id: Date.now(),
    text,
    qr: addQr && qrText ? qrText : null
  });

  renderList();
}

function renderList() {
  const container = document.getElementById("listContainer");
  container.innerHTML = "";
  entries.forEach(e => {
    const div = document.createElement("div");
    div.className = "labelPreview";
    div.innerHTML = `<button onclick="removeEntry(${e.id})">حذف</button><div>${e.text}</div>${e.qr ? "<div style='font-size:10px;color:#999;'>(+ QR)</div>" : ""}`;
    container.appendChild(div);
  });
  document.getElementById("countDisplay").textContent = entries.length;
}

function removeEntry(id) {
  entries = entries.filter(e => e.id !== id);
  renderList();
}

// ---------- الطباعة ----------
function buildQrImg(text) {
  const qr = qrcode(0, "L");
  qr.addData(text);
  qr.make();
  return qr.createImgTag(4);
}

function printAll() {
  if (!entries.length) {
    alert("مفيش عناصر في القائمة للطباعة.");
    return;
  }

  const printWindow = window.open("", "_blank");
  let pagesHtml = "";

  entries.forEach((e, index) => {
    const isLast = index === entries.length - 1;
    const qrHtml = e.qr ? `<div style="margin-top:6px;">${buildQrImg(e.qr)}</div>` : "";
    pagesHtml += `
      <div style="width:10cm; height:5cm; box-sizing:border-box; padding:6px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:13px; ${isLast ? "" : "page-break-after: always;"}">
        <div style="white-space:pre-wrap;">${e.text}</div>
        ${qrHtml}
      </div>
    `;
  });

  printWindow.document.write(`
    <html>
    <head>
    <style>
      @page { size: 10cm 5cm; margin: 0; }
      body { margin:0; font-family: Tahoma, Arial, sans-serif; }
    </style>
    </head>
    <body>${pagesHtml}</body>
    </html>
  `);
  printWindow.document.close();

  printWindow.onload = function() {
    printWindow.focus();
    printWindow.print();
  };
  printWindow.onafterprint = function() {
    printWindow.close();
  };
  setTimeout(function() {
    if (!printWindow.closed) printWindow.close();
  }, 5000);
}
</script>
</body>
</html>
