<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f8f7e">
<title>Osama Elzeiny</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokens (shared across all pages) ===== */
  :root {
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --brand: #0f8f7e;      /* main teal */
    --brand-2: #22b07d;    /* green for gradients */
    --bg: #f3f7f6;
    --surface: #ffffff;
    --ink: #13261f;
    --muted: #5d7069;
    --line: #dfe8e5;
    --success: #1fa463;
    --warning: #e3a008;
    --danger: #e5534b;

    /* Accent colors for tool icons */
    --c-teal: #0f8f7e;
    --c-blue: #3b7ddd;
    --c-amber: #e08a00;
    --c-coral: #e5604f;
    --c-violet: #7c5cd6;
    --c-pink: #d6458a;
    --c-green: #1f9d55;

    --radius: 16px;
    --shadow: 0 2px 12px rgba(16, 60, 52, .08);
    --shadow-hover: 0 8px 24px rgba(16, 60, 52, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #0c7a6c; --brand-2: #1b9466;
      --bg: #0e1615; --surface: #17211e; --ink: #e6f1ee; --muted: #8ea69f; --line: #26332f;
      --c-teal: #2bc0aa; --c-blue: #6aa2f0; --c-amber: #f2b13c; --c-coral: #f2836f;
      --c-violet: #a58cf0; --c-pink: #ec7ab0; --c-green: #4cc583;
      --shadow: 0 2px 12px rgba(0, 0, 0, .35); --shadow-hover: 0 8px 24px rgba(0, 0, 0, .45);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; }

  /* Header */
  .hero {
    position: relative; overflow: hidden; color: #fff; padding: 28px 16px 84px;
    background:
      radial-gradient(circle at 85% 15%, rgba(255, 255, 255, .18) 0 90px, transparent 91px),
      radial-gradient(circle at 10% 110%, rgba(255, 255, 255, .12) 0 120px, transparent 121px),
      linear-gradient(135deg, var(--brand), var(--brand-2));
  }
  .hero-inner { max-width: 900px; margin: 0 auto; }
  .owner { font-size: 14px; font-weight: 600; opacity: .9; }
  .greeting { margin: 18px 0 2px; font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  .date { font-size: 16px; opacity: .92; }

  .wrap { max-width: 900px; margin: -56px auto 0; padding: 0 16px 40px; position: relative; }

  /* Featured checklist card */
  .featured {
    display: flex; align-items: center; gap: 18px; padding: 20px;
    background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
    transition: box-shadow .2s, transform .2s;
  }
  .featured:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .featured:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .ring { position: relative; width: 84px; height: 84px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--line); stroke-width: 10; }
  .ring-bar { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .6s ease, stroke .3s; }
  .ring-pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 800; }
  .featured-body { flex: 1; min-width: 0; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand); }
  .featured h2 { margin: 2px 0; font-size: 21px; font-weight: 800; }
  .featured p { margin: 0; color: var(--muted); font-size: 15px; }
  .go {
    width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
  }

  /* Tools grid */
  .sec-title { margin: 30px 4px 12px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 860px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .tool {
    --c: var(--c-teal);
    display: flex; flex-direction: column; gap: 10px; padding: 16px;
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    transition: box-shadow .2s, transform .2s;
  }
  .tool:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }
  .tool:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
  .icon {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  }
  .icon svg { width: 26px; height: 26px; }
  .tool b { display: block; font-size: 16px; font-weight: 700; line-height: 1.3; }
  .tool span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 28px 16px 8px; }

  @media (prefers-reduced-motion: reduce) {
    .featured, .tool, .ring-bar { transition: none; }
    .featured:hover, .tool:hover { transform: none; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="owner">💊 <span data-i18n="owner"></span></div>
    <div class="greeting" id="greeting"></div>
    <div class="date" id="date"></div>
  </div>
</header>

<main class="wrap">
  <a class="featured" href="DailyCheckList.html">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle class="ring-track" cx="50" cy="50" r="42"/>
        <circle class="ring-bar" id="ring" cx="50" cy="50" r="42"/>
      </svg>
      <span class="ring-pct" id="pct">0%</span>
    </div>
    <div class="featured-body">
      <span class="tag" data-i18n="today"></span>
      <h2 data-i18n="checklist"></h2>
      <p id="progressText"></p>
    </div>
    <div class="go" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </a>

  <div class="sec-title" data-i18n="secStock"></div>
  <div class="grid">
    <a class="tool" href="CycleCount.html" style="--c: var(--c-teal)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></div>
      <div><b data-i18n="cycleCount"></b><span data-i18n="cycleCountDesc"></span></div>
    </a>
    <a class="tool" href="ItemCheck.html" style="--c: var(--c-blue)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 17h8"/></svg></div>
      <div><b data-i18n="itemCheck"></b><span data-i18n="itemCheckDesc"></span></div>
    </a>
    <a class="tool" href="PriceTagPrint.html" style="--c: var(--c-amber)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></div>
      <div><b data-i18n="tagScanner"></b><span data-i18n="tagScannerDesc"></span></div>
    </a>
  </div>

  <div class="sec-title" data-i18n="secPrinting"></div>
  <div class="grid">
    <a class="tool" href="dosage-printer.html" style="--c: var(--c-coral)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5a5 5 0 0 1-7-7l6-6a5 5 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/></svg></div>
      <div><b data-i18n="dosagePrinter"></b><span data-i18n="dosagePrinterDesc"></span></div>
    </a>
    <a class="tool" href="Printer.html" style="--c: var(--c-violet)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg></div>
      <div><b data-i18n="printer"></b><span data-i18n="printerDesc"></span></div>
    </a>
    <a class="tool" href="ITA.html" style="--c: var(--c-pink)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a3 3 0 0 1 0 6M18 6a7 7 0 0 1 0 12"/></svg></div>
      <div><b data-i18n="promoLabels"></b><span data-i18n="promoLabelsDesc"></span></div>
    </a>
  </div>

  <div class="sec-title" data-i18n="secDaily"></div>
  <div class="grid">
    <a class="tool" href="CloseDay.html" style="--c: var(--c-green)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/></svg></div>
      <div><b data-i18n="closeDay"></b><span data-i18n="closeDayDesc"></span></div>
    </a>
    <a class="tool" href="InsuranceRefill.html" style="--c: var(--c-teal)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 9v6M9 12h6"/></svg></div>
      <div><b data-i18n="insuranceRefill"></b><span data-i18n="insuranceRefillDesc"></span></div>
    </a>
    <a class="tool" href="Attendance.html" style="--c: var(--c-blue)">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div><b data-i18n="attendance"></b><span data-i18n="attendanceDesc"></span></div>
    </a>
  </div>

  <footer data-i18n="footer"></footer>
</main>

<script>
  /* ===================== Localisation ===================== */
  const I18N = {
    en: {
      owner: 'Osama Elzeiny · Pharmacy tools', footer: 'Made by Osama Elzeiny',
      morning: 'Good morning ☀️', afternoon: 'Good afternoon 🌤️', evening: 'Good evening 🌙',
      today: 'Today', checklist: 'Daily Checklist',
      progressIdle: 'Your daily tasks, one tap away.', progressAll: 'All done for today. Great work! 🎉',
      progressNone: '{total} tasks waiting for you today.', progressSome: '{done} of {total} tasks done. Keep going!',
      secStock: 'Stock', secPrinting: 'Printing', secDaily: 'Daily work',
      cycleCount: 'Cycle Count', cycleCountDesc: 'Blind count on the phone',
      itemCheck: 'Item Check', itemCheckDesc: 'Pick items to tag',
      tagScanner: 'Tag Scanner', tagScannerDesc: 'Scan to build tags',
      dosagePrinter: 'Dosage Printer', dosagePrinterDesc: 'Medicine labels',
      printer: 'Printer', printerDesc: 'Text, QR or barcode',
      promoLabels: 'Promo Labels', promoLabelsDesc: 'Promo material labels',
      closeDay: 'Close Day', closeDayDesc: 'Cash to deposit',
      insuranceRefill: 'Insurance Refill', insuranceRefillDesc: 'Refill due dates',
      attendance: 'Attendance Check', attendanceDesc: 'Clock-in vs schedule'
    }
  };
  const LANG = 'en';
  const t = (k, vars) => {
    let s = (I18N[LANG] && I18N[LANG][k]) || k;
    if (vars) for (const [name, val] of Object.entries(vars)) s = s.split('{' + name + '}').join(val);
    return s;
  };
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

  const RING_LENGTH = 2 * Math.PI * 42;

  function readJSON(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Reads the Daily Checklist data saved in this browser (same keys as DailyCheckList.html).
  function checklistProgress() {
    const cache = readJSON('dc_sheet_cache', []);
    const hidden = readJSON('dc_hidden', []);
    const custom = readJSON('dc_custom', []);
    const progress = readJSON('dc_progress', null);

    const sheet = (Array.isArray(cache) ? cache : [])
      .map(x => typeof x === 'string' ? x : x && x.name)
      .filter(n => n && !(Array.isArray(hidden) && hidden.includes(n)))
      .map(n => ({ key: 's:' + n, type: 'check' }));
    const personal = (Array.isArray(custom) ? custom : [])
      .map(t => ({ key: 'c:' + t.id, type: t.type, target: t.target }));
    const tasks = sheet.concat(personal);
    if (!tasks.length) return null;

    const done = progress && progress.date === todayKey() ? progress.done || {} : {};
    let sum = 0, finished = 0;
    tasks.forEach(t => {
      const v = done[t.key];
      const s = t.type === 'count' ? Math.min((Number(v) || 0) / (t.target || 1), 1) : (v ? 1 : 0);
      sum += s;
      if (s >= 1) finished++;
    });
    return { pct: Math.round(sum / tasks.length * 100), finished, total: tasks.length };
  }

  function ringColor(pct) {
    if (pct >= 80) return 'var(--success)';
    if (pct >= 40) return 'var(--warning)';
    return '#f08a3c';
  }

  function render() {
    const now = new Date();
    const h = now.getHours();
    document.getElementById('greeting').textContent =
      h < 12 ? t('morning') : h < 18 ? t('afternoon') : t('evening');
    document.getElementById('date').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

    const p = checklistProgress();
    const pct = p ? p.pct : 0;
    const ring = document.getElementById('ring');
    ring.style.strokeDasharray = RING_LENGTH;
    ring.style.strokeDashoffset = RING_LENGTH * (1 - pct / 100);
    ring.style.stroke = ringColor(pct);
    document.getElementById('pct').textContent = pct + '%';

    let text = t('progressIdle');
    if (p) {
      if (p.pct === 100) text = t('progressAll');
      else if (p.finished === 0 && p.pct === 0) text = t('progressNone', { total: p.total });
      else text = t('progressSome', { done: p.finished, total: p.total });
    }
    document.getElementById('progressText').textContent = text;
  }

  // Refresh when coming back from another page or tab.
  window.addEventListener('pageshow', render);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
  render();
</script>
</body>
</html>
