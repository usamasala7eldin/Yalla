<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance Refill</title>
<script src="qrcode.js?v=3"></script>
<script src="icd10.js?v=3" defer></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #1f6feb; --accent-soft: #e8f0fe;
    --green: #1a7f37; --green-bg: #dcf5e3;
    --yellow: #8a6100; --yellow-bg: #fff4c2;
    --red: #b42318; --red-bg: #fde3e1;
    --grey-bg: #eef0f3;
    --qr2: #1a8f4c;
    --milk: #7c3aed; --milk-bg: #f1eafe;
    --orange: #c2410c; --orange-bg: #ffedd5; --teal: #0f766e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }

  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--muted); }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; }

  .banner { background: var(--yellow-bg); color: var(--yellow); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.err { background: var(--red-bg); color: var(--red); }
  .banner .btn { padding: 3px 10px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .fbtn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--text); display: inline-flex; gap: 6px; align-items: center; }
  .fbtn:hover { border-color: var(--accent); }
  .fbtn b { font-weight: 700; }
  .fbtn.due b { color: var(--green); } .fbtn.soon b { color: var(--yellow); } .fbtn.recent b { color: var(--orange); }
  .fbtn.missed b { color: var(--red); } .fbtn.possible b { color: var(--teal); } .fbtn.active b { color: var(--accent); }
  .fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .fbtn.on b { color: #fff; }
  .filters select { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--card); font-size: 13px; width: 150px; }
  .filters select.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .unsaved { color: var(--orange); font-size: 11px; font-weight: 700; margin-left: 4px; }

  .list { display: flex; flex-direction: column; gap: 4px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; cursor: pointer; }
  .row:hover { border-color: #c9d3e3; }
  .row.vc { background: #f1f6ff; border-color: #bcd3fb; border-left: 4px solid var(--accent); }
  .row.milk { border-left: 4px solid var(--milk); }
  .tag.milk { background: var(--milk-bg); color: var(--milk); font-weight: 600; }
  .seg button.auto { background: var(--milk-bg); color: var(--milk); }
  .period-hint { color: var(--yellow); font-size: 12px; margin: -2px 0 6px; }
  .undo-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 8px 8px 8px 16px; border-radius: 8px; display: flex; gap: 12px; align-items: center; z-index: 1001; }
  .undo-bar button { border: 0; background: #fff; color: var(--accent); font-weight: 700; border-radius: 6px; padding: 4px 12px; }
  .top-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .top-right { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .bottom-left { min-width: 0; }
  .bottom-right { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
  .inv { font-family: ui-monospace, Consolas, monospace; font-size: 15px; font-weight: 700; border: 0; background: none; padding: 0; color: var(--text); letter-spacing: .02em; }
  .inv:hover { color: var(--accent); }
  .tag { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: 11px; line-height: 17px; background: var(--grey-bg); color: var(--muted); }
  .tag.vc { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tag.visits { background: #efe7fd; color: #5b2bb5; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .sub-line { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-line .name { color: #4a5263; }
  .add-contact { border: 1px dashed var(--accent); background: var(--card); color: var(--accent); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; }

  .dues { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
  .chip { border-radius: 6px; padding: 2px 7px; font-size: 11px; background: var(--grey-bg); color: var(--muted); white-space: nowrap; border: 1px solid transparent; }
  .chip.big { font-size: 13px; font-weight: 700; padding: 3px 10px; min-width: 150px; text-align: center; color: var(--text); border-color: var(--line); background: var(--card); }
  .chip.big.green { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .chip.big.yellow { background: var(--yellow-bg); color: var(--yellow); border-color: #e0b400; }
  .chip.big.orange { background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }
  .chip.big.red { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .line { font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .line.possible { color: var(--teal); font-weight: 600; }
  .line.refilled { color: #4a5263; }
  .inv-small { font-family: ui-monospace, Consolas, monospace; font-size: 12px; border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
  .tag.match { background: var(--green-bg); color: var(--green); font-weight: 600; }
  .amount { font-weight: 700; font-size: 14px; text-align: right; min-width: 74px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); padding: 3px 8px; font-size: 11.5px; color: var(--muted); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .qr-btn { border: 0; border-radius: 6px; padding: 4px 8px; font-size: 11.5px; color: #fff; background: var(--accent); white-space: nowrap; }
  .qr-btn.second { background: var(--qr2); }
  .row .icon-btn { width: 24px; height: 24px; border-radius: 6px; }
  .row .icon-btn svg { width: 14px; height: 14px; }

  .btn.big { font-size: 16px; padding: 12px 22px; }
  .empty.start p { margin: 0 0 14px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: 10px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 1000; }
  .toast.show { opacity: 1; }

  dialog { border: 0; border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 40px); box-shadow: 0 10px 40px rgba(0,0,0,.25); color: var(--text); }
  dialog.narrow { width: min(380px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(20,25,35,.45); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 1; }
  .dlg-head h2 { font-size: 16px; margin: 0; flex: 1; }
  .dlg-body { padding: 12px 16px 16px; }
  .dlg-body h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .dlg-body textarea, .dlg-body input[type=text], .dlg-body input[type=tel] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .dlg-body textarea.paste { height: 180px; font-family: ui-monospace, monospace; font-size: 12px; }
  .help { color: var(--muted); font-size: 12px; margin: 6px 0; }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
  table.mini { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.mini td, table.mini th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.mini th { color: var(--muted); font-weight: 500; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-size: 13px; }
  .kv > span:nth-child(odd) { color: var(--muted); }
  .row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  #qrBox { display: flex; justify-content: center; margin: 12px 0; }
  #qrBox img { width: 260px; height: 260px; image-rendering: pixelated; }
  .qr-text { white-space: pre-wrap; background: #f6f7f9; border-radius: 8px; padding: 8px; font-size: 12px; text-align: start; }
  .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang-switch button { border: 0; background: var(--card); padding: 5px 14px; }
  .lang-switch button.on { background: var(--accent); color: #fff; }

  @media (max-width: 640px) {
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="appTitle"></h1>
    <button class="btn primary" id="btnPaste" data-i18n="pasteData"></button>
    <button class="btn" id="btnExport"><span data-i18n="exportBackup"></span><span class="unsaved" id="unsavedMark" hidden></span></button>
    <button class="btn" id="btnImport" data-i18n="importBackup"></button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
    <button class="icon-btn" id="btnSettings" data-i18n-title="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div id="icdBanner" class="banner err" hidden data-i18n="icdMissing"></div>
  <div id="importBanner" class="banner" hidden></div>

  <div class="filters">
    <div id="stats" class="row-flex" style="gap:6px"></div>
    <select id="filter"></select>
    <span class="count" id="count"></span>
  </div>

  <p class="period-hint" id="periodHint" hidden></p>
  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast"></div>
<div class="undo-bar" id="undoBar" hidden><span id="undoText"></span><button id="btnUndo" data-i18n="undo"></button></div>

<!-- Paste dialog -->
<dialog id="dlgPaste">
  <div class="dlg-head"><h2 data-i18n="pasteTitle"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body">
    <p class="help" data-i18n="pasteHelp1"></p>
    <p class="help" data-i18n="pasteHelp2"></p>
    <p class="help"><b data-i18n="pasteHelp3"></b></p>
    <textarea class="paste" id="pasteBox" data-i18n-placeholder="pastePlaceholder"></textarea>
    <div class="row-flex" style="margin-top:8px">
      <button class="btn primary" id="btnProcess" data-i18n="process"></button>
      <span class="msg" id="pasteMsg"></span>
    </div>
  </div>
</dialog>

<!-- Details dialog -->
<dialog id="dlgDetails">
  <div class="dlg-head"><h2 id="detTitle"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body" id="detBody"></div>
</dialog>

<!-- QR dialog -->
<dialog id="dlgQr" class="narrow">
  <div class="dlg-head"><h2 id="qrTitle" dir="auto"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body" style="text-align:center">
    <div class="lang-switch" id="qrLang">
      <button data-lang="ar">العربية</button>
      <button data-lang="en">English</button>
    </div>
    <div id="qrBox"></div>
    <div class="qr-text" id="qrText" dir="auto"></div>
  </div>
</dialog>

<!-- Edit messages on phone -->
<dialog id="dlgPhone" class="narrow">
  <div class="dlg-head"><h2 data-i18n="phoneEdit"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body" style="text-align:center">
    <p class="help" data-i18n="phoneHelp"></p>
    <div id="phoneQr" style="display:flex;justify-content:center;margin:10px 0"></div>
    <p class="help"><span data-i18n="phoneExpires"></span> <b id="phoneTimer">5:00</b></p>
    <p class="msg" id="phoneStatus"></p>
    <div id="phonePreview" class="qr-text" style="max-height:220px;overflow:auto" hidden></div>
    <div class="row-flex" style="justify-content:center;margin-top:10px">
      <button class="btn primary" id="btnPhoneUse" data-i18n="phoneUse" disabled></button>
    </div>
    <p class="help" data-i18n="phonePrivacy"></p>
  </div>
</dialog>

<!-- Settings dialog -->
<dialog id="dlgSettings">
  <div class="dlg-head"><h2 data-i18n="settings"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body">
    <h3 data-i18n="messagesSection"></h3>
    <p class="help" data-i18n="messagesHelp"></p>
    <div class="grid2">
      <div><label data-i18n="welcomeAr"></label><textarea id="setWelcomeAr" rows="5" dir="rtl"></textarea><p class="help" data-i18n="welcomeHint"></p></div>
      <div><label data-i18n="welcomeEn"></label><textarea id="setWelcomeEn" rows="5" dir="ltr"></textarea><p class="help" data-i18n="welcomeHint"></p></div>
      <div><label data-i18n="refillAr"></label><textarea id="setRefillAr" rows="6" dir="rtl"></textarea></div>
      <div><label data-i18n="refillEn"></label><textarea id="setRefillEn" rows="6" dir="ltr"></textarea></div>
    </div>
    <div class="row-flex" style="margin-top:8px">
      <button class="btn primary" id="btnSaveMessages" data-i18n="save"></button>
      <button class="btn" id="btnResetMessages" data-i18n="resetDefault"></button>
      <button class="btn" id="btnPhoneEdit" data-i18n="phoneEdit"></button>
      <span class="msg ok" id="messagesMsg"></span>
    </div>

    <h3 data-i18n="dataSection"></h3>
    <p class="help" id="dataInfo"></p>
    <button class="btn" id="btnClearAll" style="color:var(--red)" data-i18n="clearAll"></button>
  </div>
</dialog>

<script>
/* ===================== Configuration ===================== */
const STORAGE_KEY = 'insuranceRefill.v2';
const KEEP_DAYS = 365;           // invoices older than this are removed automatically
const ACTIVE_DAYS = 120;         // Missed is followed for 120 days from the invoice date
// "Active invoices" = what needs action today: these statuses, plus Possible refill and Likely due now
const ACTIVE_STATUSES = ['due', 'soon', 'recent'];
const UNDO_SECONDS = 5;
// Incomplete copy check: Details rows equal to one of these page sizes and ending this long before the To Date
const PAGE_SIZES = [5, 10, 15, 20, 25, 50, 100, 1000];
const INCOMPLETE_GAP_DAYS = 14;
const PERIODS = { '1M': 28, '2M': 56, '3M': 84 }; // days added to the invoice date
// Ranges by invoice age (days since the invoice date) for each period.
// Younger than "soon" = upcoming; older than "recent" = Missed.
const AGE_RANGES = {
  '1M': { soon: [20, 25], due: [26, 32], recent: [33, 43] },
  '2M': { soon: [46, 51], due: [52, 62], recent: [63, 71] },
  '3M': { soon: [75, 81], due: [82, 92], recent: [93, 99] }
};
// "Possible refill": after the first refill date, keep following the invoice every period up to these days
const FOLLOW_UNTIL = { '1M': 168, '2M': 168, '3M': 336 };
const EXCLUDED_INSURANCE = /promotion variance/i;
// Milk (infant formula) diagnoses, as in the original spreadsheet. Milk invoices default to 1M.
const MILK_CODES = ['K52.2', 'P92', 'E73.9', 'K90', 'P71', 'E73'];
const MILK_DEFAULT_PERIOD = '1M';
const NO_PERIOD = 'X'; // saved when the user clears the automatic Milk period

// Default WhatsApp messages. {name} = contact name. Editable in Settings.
const DEFAULT_MESSAGES = {
  welcomeAr: 'السلام عليكم\nمع حضرتك صيدلية النهدي (عنوان الصيدلية)\n(رابط موقع الصيدلية على Google Maps)',
  welcomeEn: 'Hello,\nThis is Nahdi Pharmacy (pharmacy address)\n(pharmacy Google Maps link)',
  refillAr: 'أ/ {name}\nكيف حال حضرتك\nموعد تكرار دواء التأمين\nهذا الاسبوع\nوهو متوفر لدينا بالفرع👆',
  refillEn: 'Mr./Ms. {name}\nHow are you?\nYour insurance medication refill is due\nthis week\nand it is available at our branch👆'
};

/* ===================== Localisation ===================== */
const I18N = {
  en: {
    appTitle: 'Insurance Refill Tracker',
    pasteData: 'Paste data', exportBackup: 'Export', importBackup: 'Import', settings: 'Settings', exportNow: 'Export now',
    pasteTitle: 'Paste dashboard reports',
    pasteHelp1: 'Open "On Account by User" or "Transaction Reference" on the KSA Pharmacy Dashboard, press Ctrl+A then Ctrl+C, and paste here.',
    pasteHelp2: 'Paste one report at a time. New data is merged with the saved data.',
    pasteHelp3: 'Before copying, show all rows: in Details, Actions → Format → Rows per page → All.',
    pasteIncomplete: 'Only {n} rows were copied (last date {last}, but To Date is {to}). Nothing was added. On the dashboard, in Details: Actions → Format → Rows per page → All, then copy again.',
    periodHint: '⚠ The two reports cover different periods. On Account by User: {a} · Trans. Ref.: {b}',
    pastePlaceholder: 'Paste the whole page here (Ctrl+V)…',
    process: 'Process',
    pasteResult: 'On Account: {inv} invoices ({newInv} new). Transaction Reference: {items} items for {itemInv} invoices.',
    pasteNothing: 'No report rows were recognised. Copy the whole page including the Details table.',
    filters: { active: 'Active invoices', likely: 'Likely due now (not set)', due: 'Due now', soon: 'Coming soon', recent: 'Recently missed', missed: 'Missed', possible: 'Possible refill', notset: 'Refill not set', norefill: 'No refill', all: 'All invoices' },
    possibleLine: 'Possible refill · {p} invoice · {m} months passed · {d}',
    refilledAt: 'Refilled at {d} · Invoice No',
    samePrice: 'same price', sameDx: 'same diagnosis', sameItem: 'same item',
    countOne: '1 invoice', countMany: '{n} invoices',
    phoneEdit: 'Edit messages on phone',
    phoneHelp: 'Scan this code with your phone, edit the messages, then press Save on the phone.',
    phoneExpires: 'This link expires in',
    phoneWaiting: 'Waiting for the phone…', phoneConnecting: 'Connecting…',
    phoneReceived: 'Messages received from the phone. Check them, then press "Use these messages".',
    phoneUse: 'Use these messages', phoneSaved: 'Messages saved.',
    phoneExpired: 'The link has expired. Close this window and try again.',
    phoneError: 'Could not connect. Check the internet connection and try again.',
    phonePrivacy: 'Only the message texts are sent, encrypted, and deleted within 5 minutes. Patient data never leaves this browser.',
    addContact: '+ Add contact',
    transRefIncomplete: '⚠ Trans. Ref. may be incomplete: only {n} rows were copied (last date {last}). Copy it again with Rows per page → All.',
    milk: 'Milk', milkAuto: 'Milk: 1M is set automatically. Click another period to change it.',
    undo: 'Undo', periodSet: '{inv}: {p}', periodCleared: '{inv}: refill cleared',
    welcomeHint: 'Write the pharmacy address after the pharmacy name, then the pharmacy Google Maps link on the next line.',
    stats: { due: 'Due now', soon: 'Coming soon', recent: 'Recently missed', missed: 'Missed', possible: 'Possible refill' },
    after: 'After {n} days', afterOne: 'After 1 day', today: 'Today', ago: '{n} days ago', agoOne: '1 day ago',
    noRefill: 'No refill', visits: '{n} visits', visit: '1 visit',
    copied: 'Copied {v}', copyHint: 'Click to copy',
    qrWelcome: 'Welcome QR', qrRefill: 'Refill QR',
    qrTitleWelcome: 'Welcome message', qrTitleRefill: 'Refill message',
    qrNoPhone: 'Add the contact phone number first.',

let LANG = 'en';

  if (s === undefined) return key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));

}

/* ===================== Storage ===================== */
// invoices / items / follow are keyed by invoice no.; contacts by card no.; messages = WhatsApp templates
function emptyStore() { return { v: 3, invoices: {}, items: {}, follow: {}, contacts: {}, messages: {}, messagesAt: '', periods: {}, lastBackup: null, dirty: false }; }
// Templates saved by earlier versions: drop the old defaults so the current defaults are used
const OLD_DEFAULT_WELCOME = [
  'السلام عليكم ورحمة الله وبركاته\nمعكم صيدلية النهدي.\n(أضف هنا اسم الفرع ورابط الموقع)',
  'السلام عليكم ورحمة الله وبركاته\nمعكم صيدلية النهدي.\n(أضف رابط موقع الصيدلية على جوجل)',
  'Hello,\nThis is Nahdi Pharmacy.\n(Add the branch name and location link here)',

];
let store = loadStore();
function loadStore() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return emptyStore();
  try {
    return cleanMessages(Object.assign(emptyStore(), JSON.parse(raw)));
  } catch (e) {
    // Never lose saved data: keep an untouched copy if it cannot be read
    try { localStorage.setItem(STORAGE_KEY + '.unreadable', raw); } catch (e2) {}
    return emptyStore();
  }
}
function cleanMessages(s) {
  const m = s.messages || {};
  for (const k of ['refillAr', 'refillEn']) if (m[k] && m[k].includes('{medicine}')) delete m[k];
  for (const k of ['welcomeAr', 'welcomeEn']) if (OLD_DEFAULT_WELCOME.includes(m[k])) delete m[k];
  delete m.medicineAr; delete m.medicineEn;
  s.messages = m;
  return s;
}
// mode: undefined = a change by the user (marks unsaved), 'clean' = just exported/restored, 'keep' = housekeeping only
function saveStore(mode) {

  else if (mode !== 'keep') store.dirty = true;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); return true; }
  catch (e) { alert(t('storageFull')); return false; }
}

/* ===================== Date helpers ===================== */
const MONTHS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
const pad = n => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dayNum(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(dayNum(iso) * 86400000).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
function parseDashDate(s) { // 01-OCT-2026 00:00:00
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})/.exec(s.trim());
  const mon = m && MONTHS[m[2].toUpperCase()];
  return mon ? `${m[3]}-${pad(mon)}-${pad(m[1])}` : null;
}
function daysLabel(days) {
  if (days === 0) return t('today');
  if (days > 0) return days === 1 ? t('afterOne') : t('after', { n: days });
  return days === -1 ? t('agoOne') : t('ago', { n: -days });
}

/* ===================== Parsing ===================== */
const INVOICE_RE = /^\d{15,}$/;
const num = s => { const n = parseFloat(String(s).replace(/,/g, '')); return isNaN(n) ? 0 : n; };

function parseReport(text) {
  const result = { invoices: [], items: {} };
  for (const line of text.split(/\r?\n/)) {
    if (!line.includes('\t')) continue;
    const c = line.split('\t').map(x => x.trim());
    // On Account by User — Details: EmpID, DateTime, InvoiceNo, Insurance, Company, Patient, Card, CoPay, Credit, Diagnosis
    if (c.length >= 9 && INVOICE_RE.test(c[2]) && parseDashDate(c[1])) {
      result.invoices.push({
        inv: c[2], emp: c[0], date: parseDashDate(c[1]), ins: c[3], company: c[4],
        name: c[5], card: c[6], copay: num(c[7]), credit: num(c[8]),
        dx: (c[9] || '').split(',')[0].split(';').map(x => x.trim()).filter(Boolean)
      });
      continue;
    }
    // Transaction Reference — Detail: EmpID, InvoiceNo, Date, Reference, ItemID, Barcode, Desc, Qty, Value, PrescriptionID
    if (c.length >= 9 && INVOICE_RE.test(c[1]) && /^\d{4}-\d{2}-\d{2}$/.test(c[2])) {
      (result.items[c[1]] = result.items[c[1]] || []).push({ ref: c[3], desc: c[6], qty: num(c[7]), value: num(c[8]), date: c[2] });
    }
  }
  // Report type, its From/To dates, and the pager under the Details table (the last "1 - N" line)
  result.type = /On Account by User/i.test(text) ? 'onAccount' : /Transaction Reference/i.test(text) ? 'transRef' : '';
  const dateAfter = label => { const m = new RegExp(label + '\\s*\\n\\s*(\\d{4}-\\d{2}-\\d{2})', 'i').exec(text); return m ? m[1] : null; };
  result.from = dateAfter('From Date');
  result.to = dateAfter('To Date');
  const pagers = [...text.matchAll(/^\s*(\d+)\s*-\s*(\d+)\s*$/gm)];
  result.pagerEnd = pagers.length ? Number(pagers[pagers.length - 1][2]) : null;
  const itemRows = Object.values(result.items).flat();
  result.rows = result.invoices.length || itemRows.length;
  const dates = [...result.invoices.map(i => i.date), ...itemRows.map(i => i.date)].sort();
  result.lastDate = dates.length ? dates[dates.length - 1] : null;
  return result;
}

// The dashboard shows Details in pages. If the copied rows fill exactly one page size and stop
// long before the To Date, only the first page was copied.
function isIncomplete(parsed) {
  return !!(parsed.pagerEnd && parsed.rows === parsed.pagerEnd && PAGE_SIZES.includes(parsed.rows) &&
    parsed.to && parsed.lastDate && dayNum(parsed.to) - dayNum(parsed.lastDate) > INCOMPLETE_GAP_DAYS);
}

// Keep the overall From/To covered by each report type
function rememberPeriod(parsed) {
  if (!parsed.type || !parsed.from || !parsed.to) return;
  const cur = store.periods[parsed.type];
  store.periods[parsed.type] = cur
    ? { from: parsed.from < cur.from ? parsed.from : cur.from, to: parsed.to > cur.to ? parsed.to : cur.to }
    : { from: parsed.from, to: parsed.to };
}

function mergeParsed(parsed) {
  let newInv = 0, itemCount = 0;
  for (const inv of parsed.invoices) {
    if (!store.invoices[inv.inv]) newInv++;
    store.invoices[inv.inv] = inv;
  }
  for (const [inv, list] of Object.entries(parsed.items)) {
    store.items[inv] = list; // replace, so pasting the same report twice does not duplicate items
    itemCount += list.length;
  }
  rememberPeriod(parsed);
  pruneOld();
  return { inv: parsed.invoices.length, newInv, items: itemCount, itemInv: Object.keys(parsed.items).length };
}

function pruneOld() {
  const limit = dayNum(todayISO()) - KEEP_DAYS;
  for (const [k, inv] of Object.entries(store.invoices)) if (dayNum(inv.date) < limit) delete store.invoices[k];
  for (const k of [...Object.keys(store.items), ...Object.keys(store.follow)]) {
    const m = /(\d{4})(\d{2})(\d{2})$/.exec(k); // invoice numbers end with yyyymmdd
    if (m && dayNum(`${m[1]}-${m[2]}-${m[3]}`) < limit) { delete store.items[k]; delete store.follow[k]; }
  }
  // contacts are kept: they belong to the card number, not to an invoice
}

/* ===================== Building rows ===================== */
function buildRows() {
  const all = Object.values(store.invoices).filter(i => !EXCLUDED_INSURANCE.test(i.ins));
  // Returns: each negative invoice cancels the latest matching positive one (same card, same amount)
  const excluded = new Set();
  for (const neg of all.filter(i => i.credit < 0).sort((a, b) => a.date.localeCompare(b.date))) {
    excluded.add(neg.inv);
    const match = all
      .filter(p => p.credit > 0 && !excluded.has(p.inv) && p.card === neg.card && Math.abs(p.credit + neg.credit) < 0.01 && p.date <= neg.date)
      .sort((a, b) => b.date.localeCompare(a.date) || b.inv.localeCompare(a.inv))[0];
    if (match) excluded.add(match.inv);
  }
  const valid = all.filter(i => !excluded.has(i.inv) && i.credit > 0);

  // Visits: count by card no. and by the saved contact phone; show the larger
  const phoneOf = card => normalisePhone((store.contacts[card] || {}).phone);
  const byCard = {}, byPhone = {};
  for (const i of valid) {
    byCard[i.card] = (byCard[i.card] || 0) + 1;
    const ph = phoneOf(i.card);
    if (ph) byPhone[ph] = (byPhone[ph] || 0) + 1;
  }
  const visitsOf = card => Math.max(byCard[card] || 0, byPhone[phoneOf(card)] || 0);

  // Later invoices of the same card, used for "Refilled at"
  const byCardList = {};
  for (const i of valid) (byCardList[i.card] = byCardList[i.card] || []).push(i);

  const today = dayNum(todayISO());
  return valid.map(i => {
    const dues = {};
    for (const [k, d] of Object.entries(PERIODS)) {
      const days = dayNum(i.date) + d - today;
      dues[k] = { days, cat: categoryFor(k, days) };
    }
    const row = Object.assign({}, i, {
      follow: store.follow[i.inv] || {}, items: store.items[i.inv] || [], dues,
      visits: visitsOf(i.card), contact: store.contacts[i.card] || {}
    });
    row.milk = i.dx.some(c => MILK_CODES.some(m => c.toUpperCase().startsWith(m)));
    row.period = effectivePeriod(row.follow.period, row.milk);
    row.autoPeriod = row.milk && !row.follow.period; // 1M chosen automatically for Milk
    row.status = statusOf(row);
    // row.active is set below: invoices that need something today
    // "Likely due now": period not set and one of the 1M/2M/3M dates is in that period's Due range
    row.likely = !row.period && Object.entries(dues).some(([k, d]) => inDue(k, d.days));
    row.possible = possibleRefill(row, today);
    row.refill = refilledAt(row, byCardList[i.card]);
    row.active = ACTIVE_STATUSES.includes(row.status) || !!row.possible || row.likely;
    return row;
  }).sort((a, b) => b.credit - a.credit);
}

const inRange = (n, r) => n >= r[0] && n <= r[1];
// days = days remaining until the refill date; the matching invoice age is period length - days
const ageOf = (periodKey, days) => PERIODS[periodKey] - days;
const inDue = (periodKey, days) => inRange(ageOf(periodKey, days), AGE_RANGES[periodKey].due);
function categoryFor(periodKey, days) {
  const age = ageOf(periodKey, days), r = AGE_RANGES[periodKey];
  if (age < r.soon[0]) return 'upcoming';
  if (inRange(age, r.soon)) return 'soon';
  if (inRange(age, r.due)) return 'due';
  if (inRange(age, r.recent)) return 'recent';
  return 'missed';
}

// Later refill dates (2nd, 3rd … period) that fall in the "Due now" range today
function possibleRefill(r, today) {
  const p = r.period;
  if (!PERIODS[p]) return null;
  const step = PERIODS[p];
  for (let k = 2; k * step <= FOLLOW_UNTIL[p]; k++) {
    const days = dayNum(r.date) + k * step - today;
    if (inDue(p, days)) return { days, months: (k * step) / 28 }; // same Due range, counted from that refill date
  }
  return null;
}

// A later invoice of the same card. Prefer the same price, then the one closest to the refill date.
function refilledAt(r, list) {
  const later = (list || []).filter(x => x.date > r.date);
  if (!later.length) return null;
  const target = dayNum(r.date) + (PERIODS[r.period] || PERIODS['1M']);
  const samePrice = x => Math.abs(x.credit - r.credit) < 0.01;
  later.sort((a, b) => (samePrice(b) - samePrice(a)) || (Math.abs(dayNum(a.date) - target) - Math.abs(dayNum(b.date) - target)));
  const x = later[0];
  const myItems = new Set((store.items[r.inv] || []).map(it => it.desc));
  return {
    inv: x.inv, date: x.date,
    samePrice: samePrice(x),
    sameDx: x.dx.some(c => r.dx.includes(c)),
    sameItem: (store.items[x.inv] || []).some(it => myItems.has(it.desc))
  };
}

function effectivePeriod(saved, milk) {
  if (saved === NO_PERIOD) return '';
  return saved || (milk ? MILK_DEFAULT_PERIOD : '');
}

// A status exists only after a refill period is chosen (or Milk's automatic 1M)
function statusOf(r) {
  const p = r.period;
  if (!p) return 'notset';
  if (p === 'NR') return 'norefill';
  const cat = r.dues[p].cat;
  // Missed is followed for 120 days from the invoice date (same as Active)
  if (cat === 'missed' && dayNum(todayISO()) - dayNum(r.date) > ACTIVE_DAYS) return 'old';
  return cat;
}

/* ===================== ICD-10 ===================== */
function icdDesc(code) {
  const icd = window.ICD10;
  if (!icd) return '';
  let c = code.toUpperCase();
  while (c.length >= 3) {
    if (icd[c]) return icd[c];
    c = c.slice(0, -1).replace(/\.$/, '');
  }
  return '';
}
const dxNames = codes => codes.map(c => icdDesc(c) || c).join(' · ');
// Invoice numbers end with the date (yyyymmdd); it is hidden when shown or copied
const shortInv = inv => String(inv).replace(/20\d{6}$/, '');

const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      <div class="seg">${segs}</div>

      <button class="icon-btn" title="${esc(t('details'))}" data-act="details" data-inv="${inv}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
    </div>
  </div>`;
}

/* ===================== Actions ===================== */
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1500);
}
function copyText(v) {
  const done = () => toast(t('copied', { v }));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(done, () => fallbackCopy(v, done));
  else fallbackCopy(v, done);
}
function fallbackCopy(v, done) {
  const ta = document.createElement('textarea'); ta.value = v; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}
function follow(inv) { return store.follow[inv] = store.follow[inv] || {}; }
function touchFollow(inv) {
  const f = store.follow[inv];
  if (!f) return;
  f.updatedAt = new Date().toISOString();
  if (!f.period && !f.note && !f.qrW && !f.qrR) delete store.follow[inv];
}
function setPeriod(inv, val) {
  const row = rowsCache.find(x => x.inv === inv);
  const milk = !!(row && row.milk);
  const f = follow(inv);
  const before = f.period || '';
  // Clicking the period that is already shown clears it (for Milk this also clears the automatic 1M)
  if (effectivePeriod(before, milk) === val) f.period = milk ? NO_PERIOD : '';
  else f.period = val;
  const now = effectivePeriod(f.period, milk);
  touchFollow(inv); saveStore(); render();
  const shown = shortInv(inv);
  showUndo(now ? t('periodSet', { inv: shown, p: now === 'NR' ? t('noRefill') : now }) : t('periodCleared', { inv: shown }), () => {
    follow(inv).period = before; touchFollow(inv); saveStore(); render();
  });
}
let undoAction = null;
function showUndo(text, action) {
  undoAction = action;
  $('undoText').textContent = text;
  $('undoBar').hidden = false;
  clearTimeout(showUndo._t);
  showUndo._t = setTimeout(() => { $('undoBar').hidden = true; undoAction = null; }, UNDO_SECONDS * 1000);
}
function normalisePhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('05') && d.length === 10) d = '966' + d.slice(1);
  else if (d.startsWith('5') && d.length === 9) d = '966' + d;
  return d;
}

/* ===================== QR dialog ===================== */
const qrState = { inv: null, type: null, lang: 'ar' };
function openQr(inv, type) {
  const r = rowsCache.find(x => x.inv === inv);
  if (!r) return;
  if (!r.contact.phone) { toast(t('qrNoPhone')); openDetails(inv); return; }
  qrState.inv = inv; qrState.type = type;
  const f = follow(inv);
  if (type === 'welcome') f.qrW = true; else f.qrR = true;
  touchFollow(inv); saveStore(); render();
  $('dlgQr').showModal();
  renderQr();
}
function buildMessage(r, type, lang) {
  const m = messages();
  if (type === 'welcome') return lang === 'en' ? m.welcomeEn : m.welcomeAr;
  return (lang === 'en' ? m.refillEn : m.refillAr).replace(/\{name\}/g, r.contact.name || '');
}
function renderQr() {
  const r = rowsCache.find(x => x.inv === qrState.inv);
  if (!r) return;
  document.querySelectorAll('#qrLang button').forEach(b => b.classList.toggle('on', b.dataset.lang === qrState.lang));
  const text = buildMessage(r, qrState.type, qrState.lang);
  $('qrTitle').textContent = `${t(qrState.type === 'welcome' ? 'qrTitleWelcome' : 'qrTitleRefill')} — ${r.contact.name || r.contact.phone}`;
  $('qrText').textContent = text;
  if (typeof qrcode !== 'function') { $('qrBox').textContent = t('qrNoLib'); return; }
  const qr = qrcode(0, 'L');
  qr.addData(`https://wa.me/${normalisePhone(r.contact.phone)}?text=${encodeURIComponent(text)}`, 'Byte');
  qr.make();
  $('qrBox').innerHTML = qr.createImgTag(6, 8);
}

/* ===================== Details dialog ===================== */
function openDetails(inv) {
  const r = rowsCache.find(x => x.inv === inv);
  if (!r) return;
  $('detTitle').textContent = shortInv(r.inv);
  const dxRows = r.dx.map(c => `<tr><td>${esc(icdDesc(c) || c)}</td><td style="color:var(--muted)">${esc(c)}</td></tr>`).join('');

  $('detBody').innerHTML = `

      <span>${esc(t('insurance'))}</span><span>${esc(r.ins)}</span>
      <span>${esc(t('company'))}</span><span>${esc(r.company)}</span>
      <span>${esc(t('amount'))}</span><span>${money(r.credit)} (${esc(t('copay'))}: ${money(r.copay)})</span>
      <span>${esc(t('employee'))}</span><span>${esc(r.emp)}</span>
      ${refs ? `<span>${esc(t('reference'))}</span><span><b>${esc(refs)}</b></span>` : ''}
    </div>
    <h3>${esc(t('contactSection'))}</h3>
    <div class="kv">
      <span>${esc(t('contactName'))}</span><input type="text" id="detName" value="${esc(r.contact.name || '')}" dir="auto">
      <span>${esc(t('phone'))}</span><input type="tel" id="detPhone" value="${esc(r.contact.phone || '')}" placeholder="05xxxxxxxx">
    </div>
    <p class="help">${esc(t('contactHelp'))}</p>
    <h3>${esc(t('noteSection'))}</h3>
    <textarea id="detNote" rows="2" dir="auto">${esc(r.follow.note || '')}</textarea>

  $('detSave').onclick = () => {

    else delete store.contacts[r.card];
    follow(inv).note = $('detNote').value.trim();

  if (!$('dlgDetails').open) $('dlgDetails').showModal();
}

/* ===================== Export / import / settings ===================== */
// The banner appears as soon as anything changes after the last export
// A small "● unsaved" mark on the Export button instead of a banner
function renderBackupBanner() {
  $('unsavedMark').hidden = !store.dirty;
  $('unsavedMark').textContent = '● ' + t('unsavedShort');
  $('btnExport').title = store.dirty
    ? (store.lastBackup ? t('unsavedSince', { d: fmtDate(store.lastBackup) }) : t('unsavedNever'))
    : (store.lastBackup ? t('lastExport', { d: fmtDate(store.lastBackup) }) : '');
}
// File name: IR_<first invoice date>-<last invoice date>.json, dates as DDMMYY
function exportFileName() {
  const dates = Object.values(store.invoices).map(i => i.date).sort();
  if (!dates.length) return 'IR.json';
  const short = iso => iso.slice(8, 10) + iso.slice(5, 7) + iso.slice(2, 4);
  return `IR_${short(dates[0])}-${short(dates[dates.length - 1])}.json`;
}
function exportBackup() {
  store.lastBackup = todayISO();
  saveStore('clean');
  const data = Object.assign({}, store, { messages: messages(), dirty: false }); // include the messages in use
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportFileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  renderBackupBanner();
}
const newer = (a, b) => !b || (a.updatedAt || '') > (b.updatedAt || '');
function showImportResult(text, isErr) {
  const b = $('importBanner');
  b.textContent = text; b.classList.toggle('err', !!isErr); b.hidden = false;
  clearTimeout(showImportResult._t); showImportResult._t = setTimeout(() => (b.hidden = true), 6000);
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = cleanMessages(JSON.parse(reader.result));
      if (!data || typeof data.invoices !== 'object') throw new Error('bad');
      // Importing into an empty browser restores the exported state exactly, so nothing is "unsaved"
      const wasEmpty = !Object.keys(store.invoices).length && !Object.keys(store.follow).length && !Object.keys(store.contacts).length;
      let inv = 0, fol = 0, con = 0;
      for (const [k, v] of Object.entries(data.invoices)) { if (!store.invoices[k]) { store.invoices[k] = v; inv++; } }
      for (const [k, v] of Object.entries(data.items || {})) if (!store.items[k]) store.items[k] = v;
      for (const [k, v] of Object.entries(data.follow || {})) if (newer(v, store.follow[k])) { store.follow[k] = v; fol++; }
      for (const [k, v] of Object.entries(data.contacts || {})) if (newer(v, store.contacts[k])) { store.contacts[k] = v; con++; }
      // Messages: keep whichever was edited last
      const fileMsgNewer = (data.messagesAt || '') > (store.messagesAt || '') || (!store.messagesAt && !Object.keys(store.messages).length);
      if (data.messages && Object.keys(data.messages).length && fileMsgNewer) { store.messages = data.messages; store.messagesAt = data.messagesAt || ''; }
      for (const [k, v] of Object.entries(data.periods || {})) rememberPeriod({ type: k, from: v.from, to: v.to });
      if (wasEmpty && data.transRefIncomplete) store.transRefIncomplete = data.transRefIncomplete;
      if (data.lastBackup && (!store.lastBackup || data.lastBackup > store.lastBackup)) store.lastBackup = data.lastBackup;
      pruneOld(); saveStore(wasEmpty && !store.dirty ? 'clean' : undefined); render();
      showImportResult(t('importDone', { inv, fol, con }));
    } catch (e) {
      showImportResult(t('importFail'), true);
    }
  };
  reader.readAsText(file);
}
function renderSettings() {
  const m = messages();
  $('setWelcomeAr').value = m.welcomeAr; $('setWelcomeEn').value = m.welcomeEn;
  $('setRefillAr').value = m.refillAr; $('setRefillEn').value = m.refillEn;
  $('messagesMsg').textContent = '';
  $('dataInfo').textContent = t('dataInfo', { inv: Object.keys(store.invoices).length, fol: Object.keys(store.follow).length, con: Object.keys(store.contacts).length, keep: KEEP_DAYS });
}
function saveMessages() {
  store.messages = {
    welcomeAr: $('setWelcomeAr').value, welcomeEn: $('setWelcomeEn').value,
    refillAr: $('setRefillAr').value, refillEn: $('setRefillEn').value
  };
  store.messagesAt = new Date().toISOString();
  saveStore(); $('messagesMsg').textContent = t('saved');
}

/* ===================== Edit messages on phone ===================== */
// The phone opens InsuranceWA.html. Both pages share a temporary, end-to-end encrypted document
// (same idea and Firebase project as sync.html). Only message texts are sent; it is deleted within 5 minutes.
const PHONE_PAGE = 'InsuranceWA.html';
const SESSION_TTL = 5 * 60 * 1000;
const FIREBASE_URL = 'https://www.gstatic.com/firebasejs/10.12.2/';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyD-QSolp7uoEr0z_0NkOBIeEFAgllmi0ro',
  authDomain: 'sync-df6ca.firebaseapp.com',
  projectId: 'sync-df6ca',
  storageBucket: 'sync-df6ca.firebasestorage.app',
  messagingSenderId: '1091721719210',
  appId: '1:1091721719210:web:567cd4ce4056bfce45cfd3'
};
const MESSAGE_KEYS = ['welcomeAr', 'welcomeEn', 'refillAr', 'refillEn'];

let fb = null; // Firebase is loaded only when this feature is used
async function loadFirebase() {
  if (fb) return fb;
  const app = await import(FIREBASE_URL + 'firebase-app.js');
  const fs = await import(FIREBASE_URL + 'firebase-firestore.js');
  fb = { fs, db: fs.getFirestore(app.initializeApp(FIREBASE_CONFIG, 'insurance-wa')) };
  return fb;
}

const te = new TextEncoder(), td = new TextDecoder();
const toB64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
const toB64u = b => toB64(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function deriveSession(secretBytes) {
  const base = await crypto.subtle.importKey('raw', secretBytes, 'HKDF', false, ['deriveBits', 'deriveKey']);
  const salt = te.encode('insurance-wa-v1');
  const idBits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt, info: te.encode('page-id') }, base, 128);
  const key = await crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt, info: te.encode('content-key') },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  return { id: toB64u(new Uint8Array(idBits)), key };
}
async function encJSON(obj, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return toB64(iv) + '.' + toB64(new Uint8Array(ct));
}
async function decJSON(str, key) {
  const [iv, ct] = str.split('.');
  return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(iv) }, key, fromB64(ct))));
}

const phone = { id: null, key: null, ref: null, expiresAt: 0, unsub: null, timer: null, received: null };
function phoneStatus(text, cls) { $('phoneStatus').className = 'msg ' + (cls || ''); $('phoneStatus').textContent = text; }

async function startPhoneSession() {
  endPhoneSession();
  $('phoneQr').innerHTML = ''; $('phonePreview').hidden = true; $('btnPhoneUse').disabled = true;
  $('phoneTimer').textContent = '5:00';
  phoneStatus(t('phoneConnecting'));
  $('dlgPhone').showModal();
  try {
    const { fs, db } = await loadFirebase();
    const secret = crypto.getRandomValues(new Uint8Array(32));
    const s = await deriveSession(secret);
    Object.assign(phone, { id: s.id, key: s.key, ref: fs.doc(db, 'pages', s.id), expiresAt: Date.now() + SESSION_TTL, received: null });
    const current = {}; const m = messages();
    for (const k of MESSAGE_KEYS) current[k] = m[k];
    await fs.setDoc(phone.ref, { text: await encJSON({ from: 'pos', messages: current }, phone.key), createdAt: fs.serverTimestamp(), expiresAt: fs.Timestamp.fromMillis(phone.expiresAt) });
    const link = new URL(PHONE_PAGE, location.href).href + '#' + toB64u(secret);
    const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
    $('phoneQr').innerHTML = qr.createImgTag(5, 8);
    phoneStatus(t('phoneWaiting'));
    phone.timer = setInterval(phoneTick, 1000);
    const myId = phone.id;
    phone.unsub = fs.onSnapshot(phone.ref, async snap => {
      if (phone.id !== myId || !snap.exists() || snap.metadata.hasPendingWrites) return;
      try {
        const data = await decJSON(snap.data().text || '', phone.key);
        if (data.from !== 'phone' || !data.messages) return;
        const got = {};
        for (const k of MESSAGE_KEYS) got[k] = typeof data.messages[k] === 'string' ? data.messages[k] : '';
        phone.received = got;
        $('phonePreview').textContent = MESSAGE_KEYS.map(k => `— ${t(k)} —\n${got[k]}`).join('\n\n');
        $('phonePreview').hidden = false; $('btnPhoneUse').disabled = false;
        phoneStatus(t('phoneReceived'), 'ok');
      } catch (e) { /* ignore anything that cannot be decrypted */ }
    }, () => {});
  } catch (e) {
    phoneStatus(t('phoneError'), 'err');
  }
}
function phoneTick() {
  const left = phone.expiresAt - Date.now();
  if (left <= 0) { endPhoneSession(); phoneStatus(t('phoneExpired'), 'err'); $('phoneQr').innerHTML = ''; $('btnPhoneUse').disabled = !phone.received; return; }
  const s = Math.ceil(left / 1000);
  $('phoneTimer').textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
}
function endPhoneSession() {
  if (phone.unsub) phone.unsub();
  clearInterval(phone.timer);
  if (phone.ref && fb) fb.fs.deleteDoc(phone.ref).catch(() => {});
  Object.assign(phone, { id: null, ref: null, unsub: null, timer: null });
}
function usePhoneMessages() {
  if (!phone.received) return;
  store.messages = Object.assign({}, phone.received);
  store.messagesAt = new Date().toISOString();
  saveStore();
  phone.received = null;
  endPhoneSession();
  $('dlgPhone').close();
  renderSettings();
  toast(t('phoneSaved'));
}

/* ===================== Events ===================== */
function bind() {
  $('btnPaste').onclick = () => { $('pasteMsg').textContent = ''; $('dlgPaste').showModal(); $('pasteBox').focus(); };
  $('btnExport').onclick = exportBackup;
  $('btnImport').onclick = () => $('fileImport').click();
  $('fileImport').onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; };
  $('btnSettings').onclick = () => { renderSettings(); $('dlgSettings').showModal(); };
  $('btnSaveMessages').onclick = saveMessages;
  $('btnPhoneEdit').onclick = startPhoneSession;
  $('btnPhoneUse').onclick = usePhoneMessages;
  $('dlgPhone').addEventListener('close', () => { phone.received = null; endPhoneSession(); });
  $('btnResetMessages').onclick = () => { store.messages = {}; store.messagesAt = new Date().toISOString(); saveStore(); renderSettings(); };
  $('btnClearAll').onclick = () => { if (confirm(t('clearConfirm'))) { store = emptyStore(); saveStore('clean'); renderSettings(); render(); } };
  document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
  $('qrLang').onclick = e => { const b = e.target.closest('[data-lang]'); if (b) { qrState.lang = b.dataset.lang; renderQr(); } };

  $('btnProcess').onclick = () => {
    const parsed = parseReport($('pasteBox').value);
    const msg = $('pasteMsg');
    if (!parsed.invoices.length && !Object.keys(parsed.items).length) { msg.className = 'msg err'; msg.textContent = t('pasteNothing'); return; }
    const incomplete = isIncomplete(parsed);
    // On Account by User is the main data: an incomplete copy is refused
    if (incomplete && parsed.invoices.length) {
      msg.className = 'msg err';
      msg.textContent = t('pasteIncomplete', { n: parsed.rows, last: fmtDate(parsed.lastDate), to: fmtDate(parsed.to) });
      return; // nothing is added from an incomplete copy
    }
    // Trans. Ref. only adds items: an incomplete copy is kept, with a warning, and its period ends at the last copied date
    if (parsed.type === 'transRef' || (!parsed.invoices.length && Object.keys(parsed.items).length)) {
      if (incomplete) { parsed.to = parsed.lastDate; store.transRefIncomplete = { n: parsed.rows, last: parsed.lastDate }; }
      else delete store.transRefIncomplete;
    }
    const res = mergeParsed(parsed);
    saveStore();
    msg.className = incomplete ? 'msg err' : 'msg ok';
    msg.textContent = t('pasteResult', res) + (incomplete ? ' ' + t('transRefIncomplete', { n: parsed.rows, last: fmtDate(parsed.lastDate) }) : '');
    $('pasteBox').value = '';
    render();
  };

  $('btnUndo').onclick = () => {
    if (undoAction) undoAction();
    undoAction = null; $('undoBar').hidden = true;
  };
  $('filter').onchange = e => { ui.filter = e.target.value || 'active'; render(); };
  $('stats').onclick = e => {
    const s = e.target.closest('[data-filter]');
    if (!s) return;
    ui.filter = s.dataset.filter;
    render();
  };
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) {
      const row = e.target.closest('[data-row]');
      if (row) openDetails(row.dataset.row); // clicking anywhere else on the card opens the details
      return;
    }
    const inv = b.dataset.inv;
    switch (b.dataset.act) {
      case 'copy': copyText(shortInv(inv)); break;
      case 'period': setPeriod(inv, b.dataset.val); break;
      case 'details': openDetails(inv); break;
      case 'qr': openQr(inv, b.dataset.type); break;
      case 'import': $('fileImport').click(); break;
      case 'paste': $('btnPaste').click(); break;
    }
  };
  // The browser wipes its data daily: warn before leaving with changes that were not exported
  window.addEventListener('beforeunload', e => {
    if (store.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
}

applyI18n();
setupFilter();
bind();
pruneOld();
saveStore('keep');
render();
// Diagnosis names arrive with icd10.js (deferred): redraw when ready, warn if missing
window.addEventListener('DOMContentLoaded', () => {
  $('icdBanner').hidden = !!window.ICD10;
  if (window.ICD10) render();
});
