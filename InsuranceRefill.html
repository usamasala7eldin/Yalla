<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance Refill</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #1f6feb; --accent-soft: #e8f0fe;
    --green: #1a7f37; --green-bg: #dcf5e3;
    --yellow: #8a6100; --yellow-bg: #fff4c2;
    --red: #b42318; --red-bg: #fde3e1;
    --grey-bg: #eef0f3;
    --wa: #128c4a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }

  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--muted); }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn.done { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .icon-btn.wa { color: var(--wa); }
  .icon-btn svg { width: 16px; height: 16px; }

  .banner { background: var(--yellow-bg); color: var(--yellow); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner .btn { padding: 3px 10px; }

  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 110px; cursor: pointer; }
  .stat b { font-size: 20px; display: block; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.due b { color: var(--green); } .stat.soon b { color: var(--yellow); } .stat.missed b { color: var(--red); }
  .stat.active { outline: 2px solid var(--accent); }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .toolbar input[type=search] { flex: 1 1 220px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--card); }
  .toolbar select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--card); }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto auto; gap: 6px 12px; align-items: center; }
  .row.contacted { opacity: .6; }
  .who { min-width: 0; }
  .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: 11px; line-height: 18px; background: var(--grey-bg); color: var(--muted); }
  .tag.vc { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tag.visits { background: #efe7fd; color: #5b2bb5; }
  .dx { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dues { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .chip { border-radius: 8px; padding: 3px 8px; font-size: 12px; min-width: 58px; text-align: center; background: var(--grey-bg); color: var(--muted); border: 1px solid transparent; }
  .chip small { display: block; font-size: 10px; opacity: .8; }
  .chip.green { background: var(--green-bg); color: var(--green); border-color: var(--green); font-weight: 600; }
  .chip.yellow { background: var(--yellow-bg); color: var(--yellow); border-color: #e0b400; }
  .chip.red { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .chip.off { opacity: .45; }
  .chip.nr { background: var(--grey-bg); }
  .amount { font-weight: 600; text-align: right; min-width: 70px; }

  .actions { display: flex; gap: 4px; align-items: center; grid-column: 1 / -1; justify-content: space-between; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); padding: 4px 9px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .actions .right { display: flex; gap: 4px; align-items: center; }
  .note-preview { color: var(--muted); font-size: 12px; font-style: italic; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: 10px; }

  dialog { border: 0; border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 40px); box-shadow: 0 10px 40px rgba(0,0,0,.25); color: var(--text); }
  dialog::backdrop { background: rgba(20,25,35,.45); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
  .dlg-head h2 { font-size: 16px; margin: 0; flex: 1; }
  .dlg-body { padding: 12px 16px 16px; }
  .dlg-body h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .dlg-body textarea, .dlg-body input[type=text], .dlg-body input[type=tel] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .dlg-body textarea.paste { height: 180px; font-family: ui-monospace, monospace; font-size: 12px; }
  .help { color: var(--muted); font-size: 12px; margin: 6px 0; }
  .msg { margin-top: 8px; font-size: 13px; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
  table.mini { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.mini td, table.mini th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.mini th { color: var(--muted); font-weight: 500; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr auto; }
    .dues { grid-column: 1 / -1; justify-content: flex-start; }
    .amount { grid-row: 1; grid-column: 2; }
    .note-preview { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="appTitle"></h1>
    <button class="btn primary" id="btnPaste" data-i18n="pasteData"></button>
    <button class="btn" id="btnBackup" data-i18n="backup"></button>
    <button class="icon-btn" id="btnSettings" data-i18n-title="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div id="backupBanner" class="banner" hidden>
    <span id="backupBannerText"></span>
    <button class="btn" id="btnBannerBackup" data-i18n="exportNow"></button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="search" id="search" data-i18n-placeholder="searchPlaceholder">
    <select id="filter"></select>
    <select id="sort"></select>
  </div>

  <div class="list" id="list"></div>
</div>

<!-- Paste dialog -->
<dialog id="dlgPaste">
  <div class="dlg-head"><h2 data-i18n="pasteTitle"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body">
    <p class="help" data-i18n="pasteHelp1"></p>
    <p class="help" data-i18n="pasteHelp2"></p>
    <textarea class="paste" id="pasteBox" data-i18n-placeholder="pastePlaceholder"></textarea>
    <div class="row-flex" style="margin-top:8px">
      <button class="btn primary" id="btnProcess" data-i18n="process"></button>
      <span class="msg" id="pasteMsg"></span>
    </div>
  </div>
</dialog>

<!-- Details dialog -->
<dialog id="dlgDetails">
  <div class="dlg-head"><h2 id="detTitle"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body" id="detBody"></div>
</dialog>

<!-- Settings / backup dialog -->
<dialog id="dlgSettings">
  <div class="dlg-head"><h2 data-i18n="settings"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body">
    <h3 data-i18n="backupSection"></h3>
    <p class="help" id="lastBackupText"></p>
    <div class="row-flex">
      <button class="btn primary" id="btnExport" data-i18n="exportBackup"></button>
      <button class="btn" id="btnImport" data-i18n="importBackup"></button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </div>
    <span class="msg" id="importMsg"></span>

    <h3 data-i18n="waSection"></h3>
    <p class="help" data-i18n="waHelp"></p>
    <textarea id="waTemplate" rows="4" dir="auto"></textarea>
    <div class="row-flex" style="margin-top:6px">
      <button class="btn" id="btnSaveTemplate" data-i18n="save"></button>
      <button class="btn" id="btnResetTemplate" data-i18n="resetDefault"></button>
    </div>

    <h3 data-i18n="dataSection"></h3>
    <p class="help" id="dataInfo"></p>
    <button class="btn" id="btnClearAll" style="color:var(--red)" data-i18n="clearAll"></button>
  </div>
</dialog>

<script>
/* ===================== Configuration ===================== */
const STORAGE_KEY = 'insuranceRefill.v1';
const KEEP_DAYS = 120;           // invoices older than this are removed automatically
const BACKUP_REMINDER_DAYS = 7;  // remind to export a backup after this many days
const EXPIRE_AFTER = -15;        // a refill date older than this is no longer shown
const PERIODS = { '1M': 28, '2M': 56, '3M': 84 };
// Colour ranges (days remaining) copied from the original spreadsheet
const THRESHOLDS = {
  '1M': { green: [-4, 5], yellow: [6, 11], red: [-9, -5] },
  '2M': { green: [-8, 5], yellow: [6, 12], red: [-11, -9] },
  '3M': { green: [-8, 5], yellow: [6, 12], red: [-11, -9] }
};
const EXCLUDED_INSURANCE = /promotion variance/i;

/* ===================== Localisation ===================== */
const I18N = {
  en: {
    appTitle: 'Insurance Refill Tracker',
    pasteData: 'Paste data', backup: 'Backup', settings: 'Settings',
    exportNow: 'Export now',
    searchPlaceholder: 'Search name, card no., invoice or insurance…',
    pasteTitle: 'Paste dashboard reports',
    pasteHelp1: 'Open "On Account by User" or "Transaction Reference" on the KSA Pharmacy Dashboard, press Ctrl+A then Ctrl+C, and paste here.',
    pasteHelp2: 'Paste one report at a time. New data is merged with what is already saved; nothing is lost.',
    pastePlaceholder: 'Paste the whole page here (Ctrl+V)…',
    process: 'Process',
    pasteResult: 'On Account: {inv} invoices ({newInv} new). Transaction Reference: {items} items for {itemInv} invoices.',
    pasteNothing: 'No report rows were recognised. Make sure you copied the whole page including the Details table.',
    filters: {
      action: 'Needs action', due: 'Due now', soon: 'Coming soon', missed: 'Missed',
      upcoming: 'Upcoming', notset: 'Period not set', contacted: 'Contacted', norefill: 'No refill',
      expired: 'Expired', all: 'All'
    },
    sorts: { amount: 'Sort: amount', due: 'Sort: nearest refill', date: 'Sort: newest invoice', visits: 'Sort: visits' },
    stats: { due: 'Due now', soon: 'Coming soon', missed: 'Missed', notset: 'Period not set' },
    visits: '{n} visits', visit: '1 visit',
    days: 'days', today: 'Today',
    noRefill: 'No refill', expiredChip: 'Expired',
    contacted: 'Contacted', markContacted: 'Mark as contacted', unmarkContacted: 'Undo contacted',
    details: 'Details', whatsapp: 'Send WhatsApp reminder', addPhone: 'Add a phone number in Details to enable WhatsApp',
    emptyNoData: 'No data yet. Click "Paste data" to add the On Account by User report.',
    emptyFilter: 'Nothing matches this filter.',
    invoiceDate: 'Invoice date', card: 'Card no.', insurance: 'Insurance', company: 'Company',
    amount: 'Credit amount', copay: 'Co-payment', employee: 'Emp ID', reference: 'Reference',
    invoices: 'Invoices', diagnoses: 'Diagnoses', items: 'Items (VC only)', noItems: 'No items — items are only available for VC (clinic reference) invoices.',
    follow: 'Follow-up', refillPeriod: 'Refill period', phone: 'Phone', note: 'Note', save: 'Save', saved: 'Saved',
    item: 'Item', qty: 'Qty', value: 'Value',
    contactedOn: 'Contacted on {d}',
    backupSection: 'Backup', waSection: 'WhatsApp message', dataSection: 'Data',
    exportBackup: 'Export backup', importBackup: 'Import backup',
    lastBackup: 'Last backup: {d}', neverBackedUp: 'No backup exported yet.',
    backupReminder: 'Your follow-up data lives only in this browser. Last backup: {d}.',
    backupReminderNever: 'Your follow-up data lives only in this browser and has never been backed up.',
    importDone: 'Imported: {inv} invoices, {fol} follow-ups.', importFail: 'This file is not a valid backup.',
    waHelp: 'Use {name} for the patient name and {date} for the refill date.',
    resetDefault: 'Reset to default',
    dataInfo: '{inv} invoices and {fol} follow-ups saved. Invoices older than {keep} days are removed automatically.',
    clearAll: 'Delete all saved data', clearConfirm: 'Delete all invoices and follow-up data from this browser? Export a backup first if you need it.',
    storageFull: 'Browser storage is full. Export a backup, then delete old data.',
    clearPeriod: 'Clear period',
    icdLoading: 'loading…'
  }
};
// Default patient message: Modern Standard Arabic
const DEFAULT_WA_TEMPLATE = 'السلام عليكم ورحمة الله {name}،\nنود تذكيركم بأن موعد إعادة صرف علاجكم عبر التأمين هو {date}.\nيسعدنا استقبالكم في الصيدلية.';

let LANG = 'en';
function t(key, vars) {
  const parts = key.split('.');
  let s = I18N[LANG];
  for (const p of parts) s = s ? s[p] : undefined;
  if (s === undefined) return key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.title = t('appTitle');
}

/* ===================== Storage ===================== */
function emptyStore() { return { v: 1, invoices: {}, items: {}, follow: {}, settings: {}, lastBackup: null }; }
let store = loadStore();
function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyStore();
    const s = JSON.parse(raw);
    return Object.assign(emptyStore(), s);
  } catch (e) { return emptyStore(); }
}
function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); return true; }
  catch (e) { alert(t('storageFull')); return false; }
}

/* ===================== Date helpers ===================== */
const MONTHS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
const pad = n => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function isoToDayNum(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
function dayNumToISO(n) { const d = new Date(n * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(isoToDayNum(iso) * 86400000);
  return d.toLocaleDateString(LANG, { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
function parseDashDate(s) { // 01-OCT-2026 00:00:00
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})/.exec(s.trim());
  if (!m) return null;
  const mon = MONTHS[m[2].toUpperCase()];
  return mon ? `${m[3]}-${pad(mon)}-${pad(m[1])}` : null;
}

/* ===================== Parsing ===================== */
const INVOICE_RE = /^\d{15,}$/;
function num(s) { const n = parseFloat(String(s).replace(/,/g, '')); return isNaN(n) ? 0 : n; }

function parseReport(text) {
  const result = { invoices: [], items: {} };
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    if (!line.includes('\t')) continue;
    const c = line.split('\t').map(x => x.trim());
    // On Account by User — Details: EmpID, DateTime, InvoiceNo, Insurance, Company, Patient, Card, CoPay, Credit, Diagnosis
    if (c.length >= 9 && INVOICE_RE.test(c[2]) && parseDashDate(c[1])) {
      const dxRaw = (c[9] || '').split(',')[0];
      result.invoices.push({
        inv: c[2], emp: c[0], date: parseDashDate(c[1]), ins: c[3], company: c[4],
        name: c[5], card: c[6], copay: num(c[7]), credit: num(c[8]),
        dx: dxRaw.split(';').map(x => x.trim()).filter(Boolean)
      });
      continue;
    }
    // Transaction Reference — Detail: EmpID, InvoiceNo, Date, Reference, ItemID, Barcode, Desc, Qty, Value, PrescriptionID
    if (c.length >= 9 && INVOICE_RE.test(c[1]) && /^\d{4}-\d{2}-\d{2}$/.test(c[2])) {
      (result.items[c[1]] = result.items[c[1]] || []).push({
        ref: c[3], itemId: c[4], desc: c[6], qty: num(c[7]), value: num(c[8]), rx: c[9] || ''
      });
    }
  }
  return result;
}

function mergeParsed(parsed) {
  let newInv = 0;
  for (const inv of parsed.invoices) {
    if (!store.invoices[inv.inv]) newInv++;
    store.invoices[inv.inv] = inv;
  }
  let itemCount = 0;
  for (const [inv, list] of Object.entries(parsed.items)) {
    store.items[inv] = list; // replace, so pasting the same report twice does not duplicate items
    itemCount += list.length;
  }
  pruneOld();
  return { inv: parsed.invoices.length, newInv, items: itemCount, itemInv: Object.keys(parsed.items).length };
}

function pruneOld() {
  const limit = isoToDayNum(todayISO()) - KEEP_DAYS;
  for (const [k, inv] of Object.entries(store.invoices)) if (isoToDayNum(inv.date) < limit) delete store.invoices[k];
  for (const k of Object.keys(store.items)) {
    // Invoice numbers end with yyyymmdd
    const m = /(\d{4})(\d{2})(\d{2})$/.exec(k);
    if (m && isoToDayNum(`${m[1]}-${m[2]}-${m[3]}`) < limit) delete store.items[k];
  }
  for (const [k, f] of Object.entries(store.follow)) {
    const date = k.split('|')[1];
    if (date && isoToDayNum(date) < limit) delete store.follow[k];
  }
}

/* ===================== Building rows ===================== */
function buildRows() {
  const all = Object.values(store.invoices).filter(i => !EXCLUDED_INSURANCE.test(i.ins));
  // Remove returns: every negative invoice cancels the latest matching positive one (same card + same amount)
  const excluded = new Set();
  const negatives = all.filter(i => i.credit < 0).sort((a, b) => a.date.localeCompare(b.date));
  for (const neg of negatives) {
    excluded.add(neg.inv);
    const match = all
      .filter(p => p.credit > 0 && !excluded.has(p.inv) && p.card === neg.card &&
        Math.abs(p.credit + neg.credit) < 0.01 && p.date <= neg.date)
      .sort((a, b) => b.date.localeCompare(a.date) || b.inv.localeCompare(a.inv))[0];
    if (match) excluded.add(match.inv);
  }
  const valid = all.filter(i => !excluded.has(i.inv) && i.credit > 0);

  // Visits per card = distinct dates
  const visits = {};
  for (const i of valid) (visits[i.card] = visits[i.card] || new Set()).add(i.date);

  // Group same patient + same day into one follow-up row
  const groups = {};
  for (const i of valid) {
    const key = `${i.card}|${i.date}`;
    const g = groups[key] = groups[key] || { key, card: i.card, date: i.date, name: i.name, invoices: [], ins: new Set(), company: new Set(), dx: [], credit: 0, copay: 0, refs: new Set(), items: [] };
    g.invoices.push(i);
    g.ins.add(i.ins); if (i.company) g.company.add(i.company);
    for (const d of i.dx) if (!g.dx.includes(d)) g.dx.push(d);
    g.credit += i.credit; g.copay += i.copay;
    for (const it of (store.items[i.inv] || [])) { g.items.push(Object.assign({ inv: i.inv }, it)); if (it.ref) g.refs.add(it.ref); }
  }

  const today = isoToDayNum(todayISO());
  return Object.values(groups).map(g => {
    g.visits = visits[g.card] ? visits[g.card].size : 1;
    g.follow = store.follow[g.key] || {};
    g.dues = computeDues(g, today);
    g.status = computeStatus(g);
    return g;
  });
}

function colourFor(periodKey, days) {
  const th = THRESHOLDS[periodKey];
  const inR = r => days >= r[0] && days <= r[1];
  if (inR(th.green)) return 'green';
  if (inR(th.yellow)) return 'yellow';
  if (inR(th.red)) return 'red';
  return '';
}

function computeDues(g, today) {
  const base = isoToDayNum(g.date);
  const chosen = g.follow.period;
  const keys = chosen && PERIODS[chosen] ? [chosen] : Object.keys(PERIODS);
  return keys.map(k => {
    const dueDay = base + PERIODS[k];
    const days = dueDay - today;
    return { period: k, days, dueISO: dayNumToISO(dueDay), colour: colourFor(k, days), expired: days < EXPIRE_AFTER };
  });
}

function computeStatus(g) {
  if (g.follow.period === 'NR') return 'norefill';
  if (g.follow.contacted) return 'contacted';
  const live = g.dues.filter(d => !d.expired);
  if (!live.length) return 'expired';
  if (live.some(d => d.colour === 'green')) return 'due';
  if (live.some(d => d.colour === 'yellow')) return 'soon';
  if (live.some(d => d.colour === 'red')) return 'missed';
  if (live.some(d => d.days > 0)) return 'upcoming';
  return 'expired';
}

function nearestDays(g) {
  const live = g.dues.filter(d => !d.expired);
  if (!live.length) return 99999;
  return Math.min(...live.map(d => Math.abs(d.days)));
}

/* ===================== Rendering ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let rowsCache = [];
const ui = { filter: 'action', sort: 'amount', search: '' };
try { Object.assign(ui, JSON.parse(localStorage.getItem(STORAGE_KEY + '.ui') || '{}')); ui.search = ''; } catch (e) {}
function saveUi() { try { localStorage.setItem(STORAGE_KEY + '.ui', JSON.stringify({ filter: ui.filter, sort: ui.sort })); } catch (e) {} }

function setupControls() {
  const f = $('filter');
  f.innerHTML = Object.keys(I18N[LANG].filters).map(k => `<option value="${k}">${esc(t('filters.' + k))}</option>`).join('');
  f.value = ui.filter;
  const s = $('sort');
  s.innerHTML = Object.keys(I18N[LANG].sorts).map(k => `<option value="${k}">${esc(t('sorts.' + k))}</option>`).join('');
  s.value = ui.sort;
}

function matchesFilter(r) {
  switch (ui.filter) {
    case 'all': return true;
    case 'action': return ['due', 'soon', 'missed'].includes(r.status);
    case 'notset': return !r.follow.period && !['expired', 'contacted'].includes(r.status);
    default: return r.status === ui.filter;
  }
}
function matchesSearch(r) {
  if (!ui.search) return true;
  const q = ui.search.toLowerCase();
  return [r.name, r.card, ...r.ins, ...r.invoices.map(i => i.inv), r.follow.phone || '', r.follow.note || '']
    .some(v => String(v).toLowerCase().includes(q));
}

function render() {
  rowsCache = buildRows();
  renderStats();
  renderBackupBanner();
  const list = $('list');
  if (!rowsCache.length) { list.innerHTML = `<div class="empty">${esc(t('emptyNoData'))}</div>`; return; }
  let rows = rowsCache.filter(r => matchesFilter(r) && matchesSearch(r));
  const sorters = {
    amount: (a, b) => b.credit - a.credit,
    due: (a, b) => nearestDays(a) - nearestDays(b) || b.credit - a.credit,
    date: (a, b) => b.date.localeCompare(a.date) || b.credit - a.credit,
    visits: (a, b) => b.visits - a.visits || b.credit - a.credit
  };
  rows.sort(sorters[ui.sort] || sorters.amount);
  if (!rows.length) { list.innerHTML = `<div class="empty">${esc(t('emptyFilter'))}</div>`; return; }
  list.innerHTML = rows.map(rowHTML).join('');
  fillDxPreviews();
}

function renderStats() {
  const count = s => rowsCache.filter(r => r.status === s).length;
  const notset = rowsCache.filter(r => !r.follow.period && !['expired', 'contacted'].includes(r.status)).length;
  const items = [['due', count('due')], ['soon', count('soon')], ['missed', count('missed')], ['notset', notset]];
  $('stats').innerHTML = items.map(([k, n]) =>
    `<div class="stat ${k} ${ui.filter === k ? 'active' : ''}" data-filter="${k}"><b>${n}</b><span>${esc(t('stats.' + k))}</span></div>`).join('');
}

function chipHTML(d, chosen) {
  if (d.expired) return `<div class="chip off">${d.period}<small>${esc(t('expiredChip'))}</small></div>`;
  const label = d.days === 0 ? t('today') : `${d.days > 0 ? '+' : ''}${d.days} ${t('days')}`;
  return `<div class="chip ${d.colour}" title="${esc(fmtDate(d.dueISO))}">${d.period}<small>${esc(label)}</small></div>`;
}

const ICONS = {
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>'
};

function rowHTML(r) {
  const chosen = r.follow.period || '';
  const segs = [...Object.keys(PERIODS), 'NR'].map(p =>
    `<button class="${chosen === p ? 'on' : ''}" data-act="period" data-key="${esc(r.key)}" data-val="${p}">${p === 'NR' ? esc(t('noRefill')) : p}</button>`).join('');
  const dues = r.follow.period === 'NR'
    ? `<div class="chip nr">${esc(t('noRefill'))}</div>`
    : r.dues.map(d => chipHTML(d, chosen)).join('');
  const ins = [...r.ins].join(' / ');
  const vc = r.refs.size ? `<span class="tag vc" title="${esc([...r.refs].join(', '))}">VC</span>` : '';
  const visits = `<span class="tag visits">${esc(r.visits === 1 ? t('visit') : t('visits', { n: r.visits }))}</span>`;
  const phone = r.follow.phone;
  const waBtn = phone
    ? `<button class="icon-btn wa" title="${esc(t('whatsapp'))}" data-act="wa" data-key="${esc(r.key)}">${ICONS.wa}</button>`
    : `<button class="icon-btn" title="${esc(t('addPhone'))}" data-act="details" data-key="${esc(r.key)}" style="opacity:.4">${ICONS.wa}</button>`;
  const contacted = !!r.follow.contacted;
  return `<div class="row ${contacted ? 'contacted' : ''}">
    <div class="who">
      <div class="name" dir="auto">${esc(r.name)} ${vc} ${visits}</div>
      <div class="meta"><span>${esc(fmtDate(r.date))}</span><span>${esc(r.card)}</span><span>${esc(ins)}</span>${r.invoices.length > 1 ? `<span>${r.invoices.length} ${esc(t('invoices').toLowerCase())}</span>` : ''}</div>
      <div class="dx" data-dx="${esc(r.dx.join(';'))}">${esc(r.dx.join(', '))}</div>
    </div>
    <div class="dues">${dues}</div>
    <div class="amount">${money(r.credit)}</div>
    <div class="actions">
      <div class="row-flex"><div class="seg">${segs}</div>${chosen ? '' : ''}<span class="note-preview" dir="auto">${esc(r.follow.note || '')}</span></div>
      <div class="right">
        ${waBtn}
        <button class="icon-btn" title="${esc(t('details'))}" data-act="details" data-key="${esc(r.key)}">${ICONS.info}</button>
        <button class="icon-btn ${contacted ? 'done' : ''}" title="${esc(contacted ? t('contactedOn', { d: fmtDate(r.follow.contacted) }) + ' — ' + t('unmarkContacted') : t('markContacted'))}" data-act="contacted" data-key="${esc(r.key)}">${ICONS.check}</button>
      </div>
    </div>
  </div>`;
}

/* ===================== ICD-10 descriptions ===================== */
let icd = null, icdPromise = null;
function loadIcd() {
  if (!icdPromise) icdPromise = fetch('icd10.json').then(r => r.ok ? r.json() : {}).then(d => (icd = d)).catch(() => (icd = {}));
  return icdPromise;
}
function icdDesc(code) {
  if (!icd) return '';
  let c = code.toUpperCase();
  while (c.length >= 3) {
    if (icd[c]) return icd[c];
    c = c.slice(0, -1).replace(/\.$/, '');
  }
  return '';
}
function fillDxPreviews() {
  if (!icd) { loadIcd().then(fillDxPreviews); return; }
  document.querySelectorAll('.dx[data-dx]').forEach(el => {
    const codes = el.dataset.dx.split(';').filter(Boolean);
    if (!codes.length) return;
    el.textContent = codes.map(c => { const d = icdDesc(c); return d ? `${c} ${d}` : c; }).join(' · ');
    el.title = el.textContent;
  });
}

/* ===================== Follow-up actions ===================== */
function getFollow(key) { return store.follow[key] = store.follow[key] || {}; }
function touch(key) {
  const f = store.follow[key];
  if (f) {
    f.updatedAt = new Date().toISOString();
    if (!f.period && !f.phone && !f.note && !f.contacted) delete store.follow[key];
  }
}
function setPeriod(key, val) {
  const f = getFollow(key);
  f.period = f.period === val ? '' : val; // click again to clear
  touch(key); saveStore(); render();
}
function toggleContacted(key) {
  const f = getFollow(key);
  f.contacted = f.contacted ? '' : todayISO();
  touch(key); saveStore(); render();
}
function normalisePhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('05') && d.length === 10) d = '966' + d.slice(1);
  else if (d.startsWith('5') && d.length === 9) d = '966' + d;
  return d;
}
function sendWhatsApp(key) {
  const r = rowsCache.find(x => x.key === key);
  if (!r || !r.follow.phone) return;
  const due = r.dues.find(d => !d.expired) || r.dues[0];
  const tpl = store.settings.waTemplate || DEFAULT_WA_TEMPLATE;
  const text = tpl.replace(/\{name\}/g, r.name).replace(/\{date\}/g, due ? fmtDate(due.dueISO) : '');
  window.open(`https://wa.me/${normalisePhone(r.follow.phone)}?text=${encodeURIComponent(text)}`, '_blank');
}

/* ===================== Details dialog ===================== */
function openDetails(key) {
  const r = rowsCache.find(x => x.key === key);
  if (!r) return;
  $('detTitle').textContent = r.name;
  $('detTitle').dir = 'auto';
  const f = r.follow;
  const dxRows = r.dx.map(c => `<tr><td>${esc(c)}</td><td>${esc(icdDesc(c) || (icd ? '' : t('icdLoading')))}</td></tr>`).join('');
  const invRows = r.invoices.map(i => `<tr><td>${esc(i.inv)}</td><td>${esc(i.ins)}</td><td>${esc(i.emp)}</td><td>${money(i.copay)}</td><td>${money(i.credit)}</td></tr>`).join('');
  const itemRows = r.items.map(it => `<tr><td dir="auto">${esc(it.desc)}</td><td>${esc(it.qty)}</td><td>${money(it.value)}</td><td>${esc(it.ref)}</td></tr>`).join('');
  $('detBody').innerHTML = `
    <div class="kv">
      <span>${esc(t('card'))}</span><span>${esc(r.card)}</span>
      <span>${esc(t('invoiceDate'))}</span><span>${esc(fmtDate(r.date))}</span>
      <span>${esc(t('insurance'))}</span><span>${esc([...r.ins].join(' / '))}</span>
      <span>${esc(t('company'))}</span><span>${esc([...r.company].join(' / '))}</span>
      <span>${esc(t('amount'))}</span><span>${money(r.credit)} (${esc(t('copay'))}: ${money(r.copay)})</span>
    </div>
    <h3>${esc(t('follow'))}</h3>
    <div class="kv" style="align-items:center">
      <span>${esc(t('phone'))}</span><input type="tel" id="detPhone" value="${esc(f.phone || '')}" placeholder="05xxxxxxxx">
      <span>${esc(t('note'))}</span><textarea id="detNote" rows="2" dir="auto">${esc(f.note || '')}</textarea>
    </div>
    <div class="row-flex" style="margin-top:8px"><button class="btn primary" id="detSave">${esc(t('save'))}</button><span class="msg ok" id="detMsg"></span></div>
    <h3>${esc(t('diagnoses'))}</h3>
    <table class="mini"><tbody id="detDx">${dxRows || '<tr><td>—</td></tr>'}</tbody></table>
    <h3>${esc(t('invoices'))}</h3>
    <table class="mini"><thead><tr><th>#</th><th>${esc(t('insurance'))}</th><th>${esc(t('employee'))}</th><th>${esc(t('copay'))}</th><th>${esc(t('amount'))}</th></tr></thead><tbody>${invRows}</tbody></table>
    <h3>${esc(t('items'))}</h3>
    ${itemRows ? `<table class="mini"><thead><tr><th>${esc(t('item'))}</th><th>${esc(t('qty'))}</th><th>${esc(t('value'))}</th><th>${esc(t('reference'))}</th></tr></thead><tbody>${itemRows}</tbody></table>` : `<p class="help">${esc(t('noItems'))}</p>`}
  `;
  $('detSave').onclick = () => {
    const ff = getFollow(key);
    ff.phone = $('detPhone').value.trim();
    ff.note = $('detNote').value.trim();
    touch(key); saveStore();
    $('detMsg').textContent = t('saved');
    render();
  };
  $('dlgDetails').showModal();
  if (!icd) loadIcd().then(() => { if ($('dlgDetails').open) { $('detDx').innerHTML = r.dx.map(c => `<tr><td>${esc(c)}</td><td>${esc(icdDesc(c))}</td></tr>`).join(''); } });
}

/* ===================== Backup ===================== */
function renderBackupBanner() {
  const hasData = Object.keys(store.invoices).length > 0;
  const last = store.lastBackup;
  const old = !last || (isoToDayNum(todayISO()) - isoToDayNum(last)) >= BACKUP_REMINDER_DAYS;
  const hasFollow = Object.keys(store.follow).length > 0;
  $('backupBanner').hidden = !(hasData && hasFollow && old);
  $('backupBannerText').textContent = last ? t('backupReminder', { d: fmtDate(last) }) : t('backupReminderNever');
}
function exportBackup() {
  store.lastBackup = todayISO();
  saveStore();
  const blob = new Blob([JSON.stringify(store)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `insurance-refill-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  renderSettingsInfo(); renderBackupBanner();
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data.invoices !== 'object' || typeof data.follow !== 'object') throw new Error('bad');
      let inv = 0, fol = 0;
      for (const [k, v] of Object.entries(data.invoices)) { if (!store.invoices[k]) inv++; store.invoices[k] = v; }
      for (const [k, v] of Object.entries(data.items || {})) if (!store.items[k]) store.items[k] = v;
      for (const [k, v] of Object.entries(data.follow)) {
        const cur = store.follow[k];
        if (!cur || (v.updatedAt || '') > (cur.updatedAt || '')) { store.follow[k] = v; fol++; }
      }
      if (data.settings && data.settings.waTemplate && !store.settings.waTemplate) store.settings.waTemplate = data.settings.waTemplate;
      pruneOld(); saveStore();
      $('importMsg').className = 'msg ok';
      $('importMsg').textContent = t('importDone', { inv, fol });
      render(); renderSettingsInfo();
    } catch (e) {
      $('importMsg').className = 'msg err';
      $('importMsg').textContent = t('importFail');
    }
  };
  reader.readAsText(file);
}
function renderSettingsInfo() {
  $('lastBackupText').textContent = store.lastBackup ? t('lastBackup', { d: fmtDate(store.lastBackup) }) : t('neverBackedUp');
  $('dataInfo').textContent = t('dataInfo', { inv: Object.keys(store.invoices).length, fol: Object.keys(store.follow).length, keep: KEEP_DAYS });
  $('waTemplate').value = store.settings.waTemplate || DEFAULT_WA_TEMPLATE;
}

/* ===================== Events ===================== */
function bind() {
  $('btnPaste').onclick = () => { $('pasteMsg').textContent = ''; $('dlgPaste').showModal(); $('pasteBox').focus(); };
  $('btnBackup').onclick = () => { renderSettingsInfo(); $('importMsg').textContent = ''; $('dlgSettings').showModal(); };
  $('btnSettings').onclick = $('btnBackup').onclick;
  $('btnBannerBackup').onclick = exportBackup;
  $('btnExport').onclick = exportBackup;
  $('btnImport').onclick = () => $('fileImport').click();
  $('fileImport').onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; };
  $('btnSaveTemplate').onclick = () => { store.settings.waTemplate = $('waTemplate').value; saveStore(); };
  $('btnResetTemplate').onclick = () => { delete store.settings.waTemplate; saveStore(); $('waTemplate').value = DEFAULT_WA_TEMPLATE; };
  $('btnClearAll').onclick = () => {
    if (!confirm(t('clearConfirm'))) return;
    store = emptyStore(); saveStore(); renderSettingsInfo(); render();
  };
  document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

  $('btnProcess').onclick = () => {
    const parsed = parseReport($('pasteBox').value);
    const msg = $('pasteMsg');
    if (!parsed.invoices.length && !Object.keys(parsed.items).length) {
      msg.className = 'msg err'; msg.textContent = t('pasteNothing'); return;
    }
    const res = mergeParsed(parsed);
    saveStore();
    msg.className = 'msg ok'; msg.textContent = t('pasteResult', res);
    $('pasteBox').value = '';
    render();
  };

  $('search').oninput = e => { ui.search = e.target.value.trim(); render(); };
  $('filter').onchange = e => { ui.filter = e.target.value; saveUi(); render(); };
  $('sort').onchange = e => { ui.sort = e.target.value; saveUi(); render(); };
  $('stats').onclick = e => {
    const s = e.target.closest('[data-filter]');
    if (!s) return;
    ui.filter = ui.filter === s.dataset.filter ? 'action' : s.dataset.filter;
    $('filter').value = ui.filter; saveUi(); render();
  };
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const key = b.dataset.key;
    switch (b.dataset.act) {
      case 'period': setPeriod(key, b.dataset.val); break;
      case 'contacted': toggleContacted(key); break;
      case 'details': openDetails(key); break;
      case 'wa': sendWhatsApp(key); break;
    }
  };
}

applyI18n();
setupControls();
bind();
pruneOld();
render();
loadIcd();
</script>
