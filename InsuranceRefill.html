<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance Refill</title>
<script src="qrcode.js?v=3"></script>
<script src="icd10.js?v=3" defer></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #1f6feb; --accent-soft: #e8f0fe;
    --green: #1a7f37; --green-bg: #dcf5e3;
    --yellow: #8a6100; --yellow-bg: #fff4c2;
    --red: #b42318; --red-bg: #fde3e1;
    --grey-bg: #eef0f3;
    --qr2: #1a8f4c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }

  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--muted); }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; }

  .banner { background: var(--yellow-bg); color: var(--yellow); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.err { background: var(--red-bg); color: var(--red); }
  .banner .btn { padding: 3px 10px; }

  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: stretch; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 110px; cursor: pointer; }
  .stat b { font-size: 20px; display: block; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.due b { color: var(--green); } .stat.soon b { color: var(--yellow); } .stat.missed b { color: var(--red); }
  .stat.active { outline: 2px solid var(--accent); }
  .stats select { margin-left: auto; align-self: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--card); }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto auto; gap: 6px 12px; align-items: center; cursor: pointer; }
  .row:hover { border-color: #c9d3e3; }
  .row.vc { background: #f1f6ff; border-color: #bcd3fb; border-left: 5px solid var(--accent); }
  .count { color: var(--muted); font-size: 12px; align-self: center; }
  .undo-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 8px 8px 8px 16px; border-radius: 8px; display: flex; gap: 12px; align-items: center; z-index: 1001; }
  .undo-bar button { border: 0; background: #fff; color: var(--accent); font-weight: 700; border-radius: 6px; padding: 4px 12px; }
  .who { min-width: 0; }
  .inv-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .inv { font-family: ui-monospace, Consolas, monospace; font-size: 17px; font-weight: 700; border: 0; background: none; padding: 0; color: var(--text); letter-spacing: .02em; }
  .inv:hover { color: var(--accent); }
  .tag { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: 11px; line-height: 18px; background: var(--grey-bg); color: var(--muted); }
  .tag.vc { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tag.visits { background: #efe7fd; color: #5b2bb5; }
  .small { color: var(--muted); font-size: 12px; }
  .small.name { color: #4a5263; }
  .small.dx { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

  .dues { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .chip { border-radius: 8px; padding: 3px 8px; font-size: 12px; min-width: 72px; text-align: center; background: var(--grey-bg); color: var(--muted); border: 1px solid transparent; }
  .chip small { display: block; font-size: 11px; }
  .chip.big { font-size: 13px; min-width: 120px; padding: 5px 12px; color: var(--text); border-color: var(--line); background: var(--card); }
  .chip.big small { font-size: 15px; font-weight: 700; }
  .chip.big.green { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .chip.big.yellow { background: var(--yellow-bg); color: var(--yellow); border-color: #e0b400; }
  .chip.big.red { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .amount { font-weight: 700; font-size: 15px; text-align: right; min-width: 80px; }

  .actions { display: flex; gap: 6px; align-items: center; grid-column: 1 / -1; justify-content: space-between; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); padding: 4px 10px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .actions .right { display: flex; gap: 4px; align-items: center; }
  .note-preview { color: var(--muted); font-size: 12px; font-style: italic; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qr-btn { border: 0; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #fff; background: var(--accent); white-space: nowrap; }
  .qr-btn.second { background: var(--qr2); }
  .qr-btn.off { opacity: .4; }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: 10px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 1000; }
  .toast.show { opacity: 1; }

  dialog { border: 0; border-radius: 12px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 40px); box-shadow: 0 10px 40px rgba(0,0,0,.25); color: var(--text); }
  dialog.narrow { width: min(380px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(20,25,35,.45); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 1; }
  .dlg-head h2 { font-size: 16px; margin: 0; flex: 1; }
  .dlg-body { padding: 12px 16px 16px; }
  .dlg-body h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .dlg-body textarea, .dlg-body input[type=text], .dlg-body input[type=tel] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .dlg-body textarea.paste { height: 180px; font-family: ui-monospace, monospace; font-size: 12px; }
  .help { color: var(--muted); font-size: 12px; margin: 6px 0; }
  .msg { font-size: 13px; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
  table.mini { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.mini td, table.mini th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.mini th { color: var(--muted); font-weight: 500; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-size: 13px; }
  .kv > span:nth-child(odd) { color: var(--muted); }
  .row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  #qrBox { display: flex; justify-content: center; margin: 12px 0; }
  #qrBox img { width: 260px; height: 260px; image-rendering: pixelated; }
  .qr-text { white-space: pre-wrap; background: #f6f7f9; border-radius: 8px; padding: 8px; font-size: 12px; text-align: start; }
  .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang-switch button { border: 0; background: var(--card); padding: 5px 14px; }
  .lang-switch button.on { background: var(--accent); color: #fff; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr auto; }
    .dues { grid-column: 1 / -1; justify-content: flex-start; }
    .amount { grid-row: 1; grid-column: 2; }
    .note-preview { display: none; }
    .grid2 { grid-template-columns: 1fr; }
    .stats select { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n="appTitle"></h1>
    <button class="btn primary" id="btnPaste" data-i18n="pasteData"></button>
    <button class="btn" id="btnExport" data-i18n="exportBackup"></button>
    <button class="btn" id="btnImport" data-i18n="importBackup"></button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
    <button class="icon-btn" id="btnSettings" data-i18n-title="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div id="icdBanner" class="banner err" hidden data-i18n="icdMissing"></div>
  <div id="importBanner" class="banner" hidden></div>
  <div id="backupBanner" class="banner" hidden>
    <span id="backupBannerText"></span>
    <button class="btn" id="btnBannerBackup" data-i18n="exportNow"></button>
  </div>

  <div class="stats">
    <div id="stats" class="row-flex"></div>
    <select id="filter"></select>
    <span class="count" id="count"></span>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast"></div>
<div class="undo-bar" id="undoBar" hidden><span id="undoText"></span><button id="btnUndo" data-i18n="undo"></button></div>

<!-- Paste dialog -->
<dialog id="dlgPaste">
  <div class="dlg-head"><h2 data-i18n="pasteTitle"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body">
    <p class="help" data-i18n="pasteHelp1"></p>
    <p class="help" data-i18n="pasteHelp2"></p>
    <textarea class="paste" id="pasteBox" data-i18n-placeholder="pastePlaceholder"></textarea>
    <div class="row-flex" style="margin-top:8px">
      <button class="btn primary" id="btnProcess" data-i18n="process"></button>
      <span class="msg" id="pasteMsg"></span>
    </div>
  </div>
</dialog>

<!-- Details dialog -->
<dialog id="dlgDetails">
  <div class="dlg-head"><h2 id="detTitle"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body" id="detBody"></div>
</dialog>

<!-- QR dialog -->
<dialog id="dlgQr" class="narrow">
  <div class="dlg-head"><h2 id="qrTitle" dir="auto"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body" style="text-align:center">
    <div class="lang-switch" id="qrLang">
      <button data-lang="ar">العربية</button>
      <button data-lang="en">English</button>
    </div>
    <div id="qrBox"></div>
    <div class="qr-text" id="qrText" dir="auto"></div>
  </div>
</dialog>

<!-- Settings dialog -->
<dialog id="dlgSettings">
  <div class="dlg-head"><h2 data-i18n="settings"></h2><button class="icon-btn" data-close>✕</button></div>
  <div class="dlg-body">
    <h3 data-i18n="messagesSection"></h3>
    <p class="help" data-i18n="messagesHelp"></p>
    <div class="grid2">
      <div><label data-i18n="welcomeAr"></label><textarea id="setWelcomeAr" rows="5" dir="rtl"></textarea><p class="help" data-i18n="welcomeHint"></p></div>
      <div><label data-i18n="welcomeEn"></label><textarea id="setWelcomeEn" rows="5" dir="ltr"></textarea><p class="help" data-i18n="welcomeHint"></p></div>
      <div><label data-i18n="refillAr"></label><textarea id="setRefillAr" rows="6" dir="rtl"></textarea></div>
      <div><label data-i18n="refillEn"></label><textarea id="setRefillEn" rows="6" dir="ltr"></textarea></div>
    </div>
    <div class="row-flex" style="margin-top:8px">
      <button class="btn primary" id="btnSaveMessages" data-i18n="save"></button>
      <button class="btn" id="btnResetMessages" data-i18n="resetDefault"></button>
      <span class="msg ok" id="messagesMsg"></span>
    </div>

    <h3 data-i18n="dataSection"></h3>
    <p class="help" id="dataInfo"></p>
    <button class="btn" id="btnClearAll" style="color:var(--red)" data-i18n="clearAll"></button>
  </div>
</dialog>

<script>
/* ===================== Configuration ===================== */
const STORAGE_KEY = 'insuranceRefill.v2';
const KEEP_DAYS = 365;           // invoices older than this are removed automatically
const ACTIVE_DAYS = 120;         // "Active invoices" = invoices from the last 120 days (except No refill)
const LIKELY_WINDOW = [-5, 7];   // "Likely due now": period not set and a 1M/2M/3M date within these days
const UNDO_SECONDS = 5;
const BACKUP_REMINDER_DAYS = 7;  // remind to export a backup after this many days
const EXPIRE_AFTER = -15;        // like the spreadsheet: more than 15 days past the refill date shows "-"
const PERIODS = { '1M': 28, '2M': 56, '3M': 84 }; // days added to the invoice date
// Colour ranges (days remaining) copied from the original spreadsheet
const THRESHOLDS = {
  '1M': { green: [-4, 5], yellow: [6, 11], red: [-9, -5] },
  '2M': { green: [-8, 5], yellow: [6, 12], red: [-11, -9] },
  '3M': { green: [-8, 5], yellow: [6, 12], red: [-11, -9] }
};
const EXCLUDED_INSURANCE = /promotion variance/i;

// Default WhatsApp messages. {name} = contact name. Editable in Settings.
const DEFAULT_MESSAGES = {
  welcomeAr: 'السلام عليكم\nمع حضرتك صيدلية النهدي (عنوان الصيدلية)\n(رابط موقع الصيدلية على Google Maps)',
  welcomeEn: 'Hello,\nThis is Nahdi Pharmacy (pharmacy address)\n(pharmacy Google Maps link)',
  refillAr: 'أ/ {name}\nكيف حال حضرتك\nموعد تكرار دواء التأمين\nهذا الاسبوع\nوهو متوفر لدينا بالفرع👆',
  refillEn: 'Mr./Ms. {name}\nHow are you?\nYour insurance medication refill is due\nthis week\nand it is available at our branch👆'
};

/* ===================== Localisation ===================== */
const I18N = {
  en: {
    appTitle: 'Insurance Refill Tracker',
    pasteData: 'Paste data', exportBackup: 'Export', importBackup: 'Import', settings: 'Settings', exportNow: 'Export now',
    pasteTitle: 'Paste dashboard reports',
    pasteHelp1: 'Open "On Account by User" or "Transaction Reference" on the KSA Pharmacy Dashboard, press Ctrl+A then Ctrl+C, and paste here.',
    pasteHelp2: 'Paste one report at a time. New data is merged with the saved data.',
    pastePlaceholder: 'Paste the whole page here (Ctrl+V)…',
    process: 'Process',
    pasteResult: 'On Account: {inv} invoices ({newInv} new). Transaction Reference: {items} items for {itemInv} invoices.',
    pasteNothing: 'No report rows were recognised. Copy the whole page including the Details table.',
    filters: { active: 'Active invoices', likely: 'Likely due now (not set)', due: 'Due now', soon: 'Coming soon', missed: 'Missed', notset: 'Refill not set', norefill: 'No refill', all: 'All invoices' },
    countOne: '1 invoice', countMany: '{n} invoices',
    undo: 'Undo', periodSet: '{inv}: {p}', periodCleared: '{inv}: refill cleared',
    welcomeHint: 'Write the pharmacy address after the pharmacy name, then the pharmacy Google Maps link on the next line.',
    stats: { due: 'Due now', soon: 'Coming soon', missed: 'Missed' },
    after: 'After {n} days', afterOne: 'After 1 day', today: 'Today', ago: '{n} days ago', agoOne: '1 day ago',
    noRefill: 'No refill', visits: '{n} visits', visit: '1 visit',
    copied: 'Copied {v}', copyHint: 'Click to copy',
    qrWelcome: 'Welcome QR', qrRefill: 'Refill QR',
    qrTitleWelcome: 'Welcome message', qrTitleRefill: 'Refill message',
    qrNoPhone: 'Add the contact phone number first.',
    qrNoLib: 'qrcode.js did not load. Make sure it is next to this page.',
    details: 'Details',
    detPatient: 'Patient', card: 'Card no.', invoiceDate: 'Invoice date', insurance: 'Insurance', company: 'Company',
    amount: 'Credit amount', copay: 'Co-payment', employee: 'Emp ID', reference: 'Reference',
    contactSection: 'Contact (linked to card no.)', contactName: 'Contact name', phone: 'Phone',
    contactHelp: 'Saved for this card number and shown on all its invoices.',
    noteSection: 'Note (this invoice)', save: 'Save', saved: 'Saved',
    diagnoses: 'Diagnoses', items: 'Items (VC)', noItems: 'No items. Items are only available for VC invoices.',
    item: 'Item', qty: 'Qty', value: 'Value',
    messagesSection: 'WhatsApp messages', messagesHelp: '{name} is replaced by the contact name.',
    welcomeAr: 'Welcome message (Arabic)', welcomeEn: 'Welcome message (English)',
    refillAr: 'Refill message (Arabic)', refillEn: 'Refill message (English)',
    resetDefault: 'Reset to default',
    backupReminder: 'Your data lives only in this browser. Last export: {d}.',
    backupReminderNever: 'Your data lives only in this browser and has never been exported.',
    importDone: 'Imported: {inv} new invoices, {fol} refill settings, {con} contacts.', importFail: 'This file is not a valid backup.',
    dataSection: 'Data',
    dataInfo: '{inv} invoices, {fol} refill settings and {con} contacts saved. Invoices older than {keep} days are removed automatically.',
    clearAll: 'Delete all saved data', clearConfirm: 'Delete all data from this browser? Export first if you need it.',
    storageFull: 'Browser storage is full. Export, then delete old data.',
    icdMissing: 'Diagnosis names file (icd10.js) did not load. Make sure it is next to this page, then reload with Ctrl+F5.',
    emptyNoData: 'No data yet. Click "Paste data" and paste the On Account by User report.',
    emptyFilter: 'No invoices in this filter.'
  }
};
let LANG = 'en';
function t(key, vars) {
  let s = I18N[LANG];
  for (const p of key.split('.')) s = s ? s[p] : undefined;
  if (s === undefined) return key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
  document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
  document.title = t('appTitle');
}

/* ===================== Storage ===================== */
// invoices / items / follow are keyed by invoice no.; contacts by card no.; messages = WhatsApp templates
function emptyStore() { return { v: 3, invoices: {}, items: {}, follow: {}, contacts: {}, messages: {}, lastBackup: null }; }
// Templates saved by earlier versions: drop the old defaults so the current defaults are used
const OLD_DEFAULT_WELCOME = [
  'السلام عليكم ورحمة الله وبركاته\nمعكم صيدلية النهدي.\n(أضف هنا اسم الفرع ورابط الموقع)',
  'السلام عليكم ورحمة الله وبركاته\nمعكم صيدلية النهدي.\n(أضف رابط موقع الصيدلية على جوجل)',
  'Hello,\nThis is Nahdi Pharmacy.\n(Add the branch name and location link here)',
  'Hello,\nThis is Nahdi Pharmacy.\n(Add the pharmacy Google Maps link)'
];
let store = loadStore();
function loadStore() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return emptyStore();
  try {
    return cleanMessages(Object.assign(emptyStore(), JSON.parse(raw)));
  } catch (e) {
    // Never lose saved data: keep an untouched copy if it cannot be read
    try { localStorage.setItem(STORAGE_KEY + '.unreadable', raw); } catch (e2) {}
    return emptyStore();
  }
}
function cleanMessages(s) {
  const m = s.messages || {};
  for (const k of ['refillAr', 'refillEn']) if (m[k] && m[k].includes('{medicine}')) delete m[k];
  for (const k of ['welcomeAr', 'welcomeEn']) if (OLD_DEFAULT_WELCOME.includes(m[k])) delete m[k];
  delete m.medicineAr; delete m.medicineEn;
  s.messages = m;
  return s;
}
function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); return true; }
  catch (e) { alert(t('storageFull')); return false; }
}
function messages() { return Object.assign({}, DEFAULT_MESSAGES, store.messages); }

/* ===================== Date helpers ===================== */
const MONTHS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
const pad = n => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dayNum(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / 86400000; }
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(dayNum(iso) * 86400000).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
function parseDashDate(s) { // 01-OCT-2026 00:00:00
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})/.exec(s.trim());
  const mon = m && MONTHS[m[2].toUpperCase()];
  return mon ? `${m[3]}-${pad(mon)}-${pad(m[1])}` : null;
}
function daysLabel(days) {
  if (days === 0) return t('today');
  if (days > 0) return days === 1 ? t('afterOne') : t('after', { n: days });
  return days === -1 ? t('agoOne') : t('ago', { n: -days });
}

/* ===================== Parsing ===================== */
const INVOICE_RE = /^\d{15,}$/;
const num = s => { const n = parseFloat(String(s).replace(/,/g, '')); return isNaN(n) ? 0 : n; };

function parseReport(text) {
  const result = { invoices: [], items: {} };
  for (const line of text.split(/\r?\n/)) {
    if (!line.includes('\t')) continue;
    const c = line.split('\t').map(x => x.trim());
    // On Account by User — Details: EmpID, DateTime, InvoiceNo, Insurance, Company, Patient, Card, CoPay, Credit, Diagnosis
    if (c.length >= 9 && INVOICE_RE.test(c[2]) && parseDashDate(c[1])) {
      result.invoices.push({
        inv: c[2], emp: c[0], date: parseDashDate(c[1]), ins: c[3], company: c[4],
        name: c[5], card: c[6], copay: num(c[7]), credit: num(c[8]),
        dx: (c[9] || '').split(',')[0].split(';').map(x => x.trim()).filter(Boolean)
      });
      continue;
    }
    // Transaction Reference — Detail: EmpID, InvoiceNo, Date, Reference, ItemID, Barcode, Desc, Qty, Value, PrescriptionID
    if (c.length >= 9 && INVOICE_RE.test(c[1]) && /^\d{4}-\d{2}-\d{2}$/.test(c[2])) {
      (result.items[c[1]] = result.items[c[1]] || []).push({ ref: c[3], desc: c[6], qty: num(c[7]), value: num(c[8]) });
    }
  }
  return result;
}

function mergeParsed(parsed) {
  let newInv = 0, itemCount = 0;
  for (const inv of parsed.invoices) {
    if (!store.invoices[inv.inv]) newInv++;
    store.invoices[inv.inv] = inv;
  }
  for (const [inv, list] of Object.entries(parsed.items)) {
    store.items[inv] = list; // replace, so pasting the same report twice does not duplicate items
    itemCount += list.length;
  }
  pruneOld();
  return { inv: parsed.invoices.length, newInv, items: itemCount, itemInv: Object.keys(parsed.items).length };
}

function pruneOld() {
  const limit = dayNum(todayISO()) - KEEP_DAYS;
  for (const [k, inv] of Object.entries(store.invoices)) if (dayNum(inv.date) < limit) delete store.invoices[k];
  for (const k of [...Object.keys(store.items), ...Object.keys(store.follow)]) {
    const m = /(\d{4})(\d{2})(\d{2})$/.exec(k); // invoice numbers end with yyyymmdd
    if (m && dayNum(`${m[1]}-${m[2]}-${m[3]}`) < limit) { delete store.items[k]; delete store.follow[k]; }
  }
  // contacts are kept: they belong to the card number, not to an invoice
}

/* ===================== Building rows ===================== */
function buildRows() {
  const all = Object.values(store.invoices).filter(i => !EXCLUDED_INSURANCE.test(i.ins));
  // Returns: each negative invoice cancels the latest matching positive one (same card, same amount)
  const excluded = new Set();
  for (const neg of all.filter(i => i.credit < 0).sort((a, b) => a.date.localeCompare(b.date))) {
    excluded.add(neg.inv);
    const match = all
      .filter(p => p.credit > 0 && !excluded.has(p.inv) && p.card === neg.card && Math.abs(p.credit + neg.credit) < 0.01 && p.date <= neg.date)
      .sort((a, b) => b.date.localeCompare(a.date) || b.inv.localeCompare(a.inv))[0];
    if (match) excluded.add(match.inv);
  }
  const valid = all.filter(i => !excluded.has(i.inv) && i.credit > 0);

  // Visits: count by card no. and by the saved contact phone; show the larger
  const phoneOf = card => normalisePhone((store.contacts[card] || {}).phone);
  const byCard = {}, byPhone = {};
  for (const i of valid) {
    byCard[i.card] = (byCard[i.card] || 0) + 1;
    const ph = phoneOf(i.card);
    if (ph) byPhone[ph] = (byPhone[ph] || 0) + 1;
  }
  const visitsOf = card => Math.max(byCard[card] || 0, byPhone[phoneOf(card)] || 0);

  const today = dayNum(todayISO());
  return valid.map(i => {
    const dues = {};
    for (const [k, d] of Object.entries(PERIODS)) {
      const days = dayNum(i.date) + d - today;
      dues[k] = { days, expired: days < EXPIRE_AFTER, colour: colourFor(k, days) };
    }
    const row = Object.assign({}, i, {
      follow: store.follow[i.inv] || {}, items: store.items[i.inv] || [], dues,
      visits: visitsOf(i.card), contact: store.contacts[i.card] || {}
    });
    row.status = statusOf(row);
    row.active = today - dayNum(i.date) <= ACTIVE_DAYS && row.follow.period !== 'NR';
    row.likely = !row.follow.period && Object.values(dues).some(d => d.days >= LIKELY_WINDOW[0] && d.days <= LIKELY_WINDOW[1]);
    return row;
  }).sort((a, b) => b.credit - a.credit);
}

function colourFor(periodKey, days) {
  const th = THRESHOLDS[periodKey];
  const inR = r => days >= r[0] && days <= r[1];
  if (inR(th.green)) return 'green';
  if (inR(th.yellow)) return 'yellow';
  if (inR(th.red)) return 'red';
  return '';
}

// A status exists only after the user chooses the refill period
function statusOf(r) {
  const p = r.follow.period;
  if (!p) return 'notset';
  if (p === 'NR') return 'norefill';
  const d = r.dues[p];
  if (d.expired) return 'expired';
  return { green: 'due', yellow: 'soon', red: 'missed' }[d.colour] || 'other';
}

/* ===================== ICD-10 ===================== */
function icdDesc(code) {
  const icd = window.ICD10;
  if (!icd) return '';
  let c = code.toUpperCase();
  while (c.length >= 3) {
    if (icd[c]) return icd[c];
    c = c.slice(0, -1).replace(/\.$/, '');
  }
  return '';
}
const dxNames = codes => codes.map(c => icdDesc(c) || c).join(' · ');

/* ===================== Rendering ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let rowsCache = [];
const ui = { filter: 'active' }; // always opens on Active invoices
function saveUi() { try { localStorage.setItem(STORAGE_KEY + '.ui', JSON.stringify(ui)); } catch (e) {} }

function setupFilter() {
  $('filter').innerHTML = Object.keys(I18N[LANG].filters).map(k => `<option value="${k}">${esc(t('filters.' + k))}</option>`).join('');
  $('filter').value = ui.filter;
}

function render() {
  rowsCache = buildRows();
  renderStats();
  renderBackupBanner();
  const list = $('list');
  const rows = rowsCache.filter(matchesFilter);
  $('count').textContent = rows.length === 1 ? t('countOne') : t('countMany', { n: rows.length });
  if (!rowsCache.length) { list.innerHTML = `<div class="empty">${esc(t('emptyNoData'))}</div>`; return; }
  list.innerHTML = rows.length ? rows.map(rowHTML).join('') : `<div class="empty">${esc(t('emptyFilter'))}</div>`;
}

function matchesFilter(r) {
  switch (ui.filter) {
    case 'all': return true;
    case 'active': return r.active;
    case 'likely': return r.likely;
    default: return r.status === ui.filter;
  }
}

function renderStats() {
  const n = s => rowsCache.filter(r => r.status === s).length;
  $('stats').innerHTML = ['due', 'soon', 'missed'].map(k =>
    `<div class="stat ${k} ${ui.filter === k ? 'active' : ''}" data-filter="${k}"><b>${n(k)}</b><span>${esc(t('stats.' + k))}</span></div>`).join('');
}

function duesHTML(r) {
  const p = r.follow.period;
  if (p === 'NR') return `<div class="chip big">${esc(t('noRefill'))}</div>`;
  if (p) {
    const d = r.dues[p];
    return `<div class="chip big ${d.expired ? '' : d.colour}">${p}<small>${d.expired ? '-' : esc(daysLabel(d.days))}</small></div>`;
  }
  // Period not chosen yet: show all three, plain, no colour
  return Object.keys(PERIODS).map(k => {
    const d = r.dues[k];
    return `<div class="chip">${k}<small>${d.expired ? '-' : esc(daysLabel(d.days))}</small></div>`;
  }).join('');
}

function rowHTML(r) {
  const inv = esc(r.inv);
  const p = r.follow.period || '';
  const segs = [...Object.keys(PERIODS), 'NR'].map(k =>
    `<button class="${p === k ? 'on' : ''}" data-act="period" data-inv="${inv}" data-val="${k}">${k === 'NR' ? esc(t('noRefill')) : k}</button>`).join('');
  const off = r.contact.phone ? '' : 'off';
  return `<div class="row ${r.items.length ? 'vc' : ''}" data-row="${inv}">
    <div class="who">
      <div class="inv-line">
        <button class="inv" data-act="copy" data-inv="${inv}" title="${esc(t('copyHint'))}">${inv}</button>
        ${r.items.length ? '<span class="tag vc">VC</span>' : ''}
        <span class="tag visits">${esc(r.visits === 1 ? t('visit') : t('visits', { n: r.visits }))}</span>
      </div>
      <div class="small name" dir="auto">${esc(r.name)}</div>
      <div class="small dx" title="${esc(dxNames(r.dx))}">${esc(dxNames(r.dx))}</div>
      <div class="meta"><span>${esc(fmtDate(r.date))}</span><span>${esc(r.ins)}</span></div>
    </div>
    <div class="dues">${duesHTML(r)}</div>
    <div class="amount">${money(r.credit)}</div>
    <div class="actions">
      <div class="row-flex"><div class="seg">${segs}</div><span class="note-preview" dir="auto">${esc(r.follow.note || '')}</span></div>
      <div class="right">
        <button class="qr-btn ${off}" data-act="qr" data-type="welcome" data-inv="${inv}">${r.follow.qrW ? '✓ ' : ''}${esc(t('qrWelcome'))}</button>
        <button class="qr-btn second ${off}" data-act="qr" data-type="refill" data-inv="${inv}">${r.follow.qrR ? '✓ ' : ''}${esc(t('qrRefill'))}</button>
        <button class="icon-btn" title="${esc(t('details'))}" data-act="details" data-inv="${inv}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
      </div>
    </div>
  </div>`;
}

/* ===================== Actions ===================== */
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1500);
}
function copyText(v) {
  const done = () => toast(t('copied', { v }));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(done, () => fallbackCopy(v, done));
  else fallbackCopy(v, done);
}
function fallbackCopy(v, done) {
  const ta = document.createElement('textarea'); ta.value = v; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}
function follow(inv) { return store.follow[inv] = store.follow[inv] || {}; }
function touchFollow(inv) {
  const f = store.follow[inv];
  if (!f) return;
  f.updatedAt = new Date().toISOString();
  if (!f.period && !f.note && !f.qrW && !f.qrR) delete store.follow[inv];
}
function setPeriod(inv, val) {
  const f = follow(inv);
  const before = f.period || '';
  f.period = before === val ? '' : val; // click the same button again to clear
  const label = f.period === 'NR' ? t('noRefill') : f.period;
  touchFollow(inv); saveStore(); render();
  showUndo(f.period ? t('periodSet', { inv, p: label }) : t('periodCleared', { inv }), () => {
    follow(inv).period = before; touchFollow(inv); saveStore(); render();
  });
}
let undoAction = null;
function showUndo(text, action) {
  undoAction = action;
  $('undoText').textContent = text;
  $('undoBar').hidden = false;
  clearTimeout(showUndo._t);
  showUndo._t = setTimeout(() => { $('undoBar').hidden = true; undoAction = null; }, UNDO_SECONDS * 1000);
}
function normalisePhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('05') && d.length === 10) d = '966' + d.slice(1);
  else if (d.startsWith('5') && d.length === 9) d = '966' + d;
  return d;
}

/* ===================== QR dialog ===================== */
const qrState = { inv: null, type: null, lang: 'ar' };
function openQr(inv, type) {
  const r = rowsCache.find(x => x.inv === inv);
  if (!r) return;
  if (!r.contact.phone) { toast(t('qrNoPhone')); openDetails(inv); return; }
  qrState.inv = inv; qrState.type = type;
  const f = follow(inv);
  if (type === 'welcome') f.qrW = true; else f.qrR = true;
  touchFollow(inv); saveStore(); render();
  $('dlgQr').showModal();
  renderQr();
}
function buildMessage(r, type, lang) {
  const m = messages();
  if (type === 'welcome') return lang === 'en' ? m.welcomeEn : m.welcomeAr;
  return (lang === 'en' ? m.refillEn : m.refillAr).replace(/\{name\}/g, r.contact.name || '');
}
function renderQr() {
  const r = rowsCache.find(x => x.inv === qrState.inv);
  if (!r) return;
  document.querySelectorAll('#qrLang button').forEach(b => b.classList.toggle('on', b.dataset.lang === qrState.lang));
  const text = buildMessage(r, qrState.type, qrState.lang);
  $('qrTitle').textContent = `${t(qrState.type === 'welcome' ? 'qrTitleWelcome' : 'qrTitleRefill')} — ${r.contact.name || r.contact.phone}`;
  $('qrText').textContent = text;
  if (typeof qrcode !== 'function') { $('qrBox').textContent = t('qrNoLib'); return; }
  const qr = qrcode(0, 'L');
  qr.addData(`https://wa.me/${normalisePhone(r.contact.phone)}?text=${encodeURIComponent(text)}`, 'Byte');
  qr.make();
  $('qrBox').innerHTML = qr.createImgTag(6, 8);
}

/* ===================== Details dialog ===================== */
function openDetails(inv) {
  const r = rowsCache.find(x => x.inv === inv);
  if (!r) return;
  $('detTitle').textContent = r.inv;
  const dxRows = r.dx.map(c => `<tr><td>${esc(icdDesc(c) || c)}</td><td style="color:var(--muted)">${esc(c)}</td></tr>`).join('');
  const itemRows = r.items.map(it => `<tr><td dir="auto">${esc(it.desc)}</td><td>${esc(it.qty)}</td><td>${money(it.value)}</td></tr>`).join('');
  const refs = [...new Set(r.items.map(it => it.ref).filter(Boolean))].join(', ');
  $('detBody').innerHTML = `
    <div class="kv">
      <span>${esc(t('detPatient'))}</span><span dir="auto">${esc(r.name)}</span>
      <span>${esc(t('card'))}</span><span>${esc(r.card)}</span>
      <span>${esc(t('invoiceDate'))}</span><span>${esc(fmtDate(r.date))}</span>
      <span>${esc(t('insurance'))}</span><span>${esc(r.ins)}</span>
      <span>${esc(t('company'))}</span><span>${esc(r.company)}</span>
      <span>${esc(t('amount'))}</span><span>${money(r.credit)} (${esc(t('copay'))}: ${money(r.copay)})</span>
      <span>${esc(t('employee'))}</span><span>${esc(r.emp)}</span>
      ${refs ? `<span>${esc(t('reference'))}</span><span><b>${esc(refs)}</b></span>` : ''}
    </div>
    <h3>${esc(t('contactSection'))}</h3>
    <div class="kv">
      <span>${esc(t('contactName'))}</span><input type="text" id="detName" value="${esc(r.contact.name || '')}" dir="auto">
      <span>${esc(t('phone'))}</span><input type="tel" id="detPhone" value="${esc(r.contact.phone || '')}" placeholder="05xxxxxxxx">
    </div>
    <p class="help">${esc(t('contactHelp'))}</p>
    <h3>${esc(t('noteSection'))}</h3>
    <textarea id="detNote" rows="2" dir="auto">${esc(r.follow.note || '')}</textarea>
    <div class="row-flex" style="margin-top:8px"><button class="btn primary" id="detSave">${esc(t('save'))}</button><span class="msg ok" id="detMsg"></span></div>
    <h3>${esc(t('diagnoses'))}</h3>
    <table class="mini"><tbody>${dxRows || '<tr><td>—</td></tr>'}</tbody></table>
    ${itemRows ? `<h3>${esc(t('items'))}</h3><table class="mini"><thead><tr><th>${esc(t('item'))}</th><th>${esc(t('qty'))}</th><th>${esc(t('value'))}</th></tr></thead><tbody>${itemRows}</tbody></table>` : ''}
  `;
  $('detSave').onclick = () => {
    const name = $('detName').value.trim(), phone = $('detPhone').value.trim();
    if (name || phone) store.contacts[r.card] = { name, phone, updatedAt: new Date().toISOString() };
    else delete store.contacts[r.card];
    follow(inv).note = $('detNote').value.trim();
    touchFollow(inv); saveStore(); render();
    $('detMsg').textContent = t('saved');
  };
  if (!$('dlgDetails').open) $('dlgDetails').showModal();
}

/* ===================== Export / import / settings ===================== */
function renderBackupBanner() {
  const has = Object.keys(store.follow).length || Object.keys(store.contacts).length;
  const last = store.lastBackup;
  const old = !last || (dayNum(todayISO()) - dayNum(last)) >= BACKUP_REMINDER_DAYS;
  $('backupBanner').hidden = !(has && old);
  $('backupBannerText').textContent = last ? t('backupReminder', { d: fmtDate(last) }) : t('backupReminderNever');
}
function exportBackup() {
  store.lastBackup = todayISO();
  saveStore();
  const data = Object.assign({}, store, { messages: messages() }); // include the messages in use
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `insurance-refill-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  renderBackupBanner();
}
const newer = (a, b) => !b || (a.updatedAt || '') > (b.updatedAt || '');
function showImportResult(text, isErr) {
  const b = $('importBanner');
  b.textContent = text; b.classList.toggle('err', !!isErr); b.hidden = false;
  clearTimeout(showImportResult._t); showImportResult._t = setTimeout(() => (b.hidden = true), 6000);
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = cleanMessages(JSON.parse(reader.result));
      if (!data || typeof data.invoices !== 'object') throw new Error('bad');
      let inv = 0, fol = 0, con = 0;
      for (const [k, v] of Object.entries(data.invoices)) { if (!store.invoices[k]) { store.invoices[k] = v; inv++; } }
      for (const [k, v] of Object.entries(data.items || {})) if (!store.items[k]) store.items[k] = v;
      for (const [k, v] of Object.entries(data.follow || {})) if (newer(v, store.follow[k])) { store.follow[k] = v; fol++; }
      for (const [k, v] of Object.entries(data.contacts || {})) if (newer(v, store.contacts[k])) { store.contacts[k] = v; con++; }
      if (data.messages && Object.keys(data.messages).length) store.messages = data.messages;
      if (data.lastBackup && (!store.lastBackup || data.lastBackup > store.lastBackup)) store.lastBackup = data.lastBackup;
      pruneOld(); saveStore(); render();
      showImportResult(t('importDone', { inv, fol, con }));
    } catch (e) {
      showImportResult(t('importFail'), true);
    }
  };
  reader.readAsText(file);
}
function renderSettings() {
  const m = messages();
  $('setWelcomeAr').value = m.welcomeAr; $('setWelcomeEn').value = m.welcomeEn;
  $('setRefillAr').value = m.refillAr; $('setRefillEn').value = m.refillEn;
  $('messagesMsg').textContent = '';
  $('dataInfo').textContent = t('dataInfo', { inv: Object.keys(store.invoices).length, fol: Object.keys(store.follow).length, con: Object.keys(store.contacts).length, keep: KEEP_DAYS });
}
function saveMessages() {
  store.messages = {
    welcomeAr: $('setWelcomeAr').value, welcomeEn: $('setWelcomeEn').value,
    refillAr: $('setRefillAr').value, refillEn: $('setRefillEn').value
  };
  saveStore(); $('messagesMsg').textContent = t('saved');
}

/* ===================== Events ===================== */
function bind() {
  $('btnPaste').onclick = () => { $('pasteMsg').textContent = ''; $('dlgPaste').showModal(); $('pasteBox').focus(); };
  $('btnExport').onclick = exportBackup;
  $('btnBannerBackup').onclick = exportBackup;
  $('btnImport').onclick = () => $('fileImport').click();
  $('fileImport').onchange = e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; };
  $('btnSettings').onclick = () => { renderSettings(); $('dlgSettings').showModal(); };
  $('btnSaveMessages').onclick = saveMessages;
  $('btnResetMessages').onclick = () => { store.messages = {}; saveStore(); renderSettings(); };
  $('btnClearAll').onclick = () => { if (confirm(t('clearConfirm'))) { store = emptyStore(); saveStore(); renderSettings(); render(); } };
  document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));
  $('qrLang').onclick = e => { const b = e.target.closest('[data-lang]'); if (b) { qrState.lang = b.dataset.lang; renderQr(); } };

  $('btnProcess').onclick = () => {
    const parsed = parseReport($('pasteBox').value);
    const msg = $('pasteMsg');
    if (!parsed.invoices.length && !Object.keys(parsed.items).length) { msg.className = 'msg err'; msg.textContent = t('pasteNothing'); return; }
    const res = mergeParsed(parsed);
    saveStore();
    msg.className = 'msg ok'; msg.textContent = t('pasteResult', res);
    $('pasteBox').value = '';
    render();
  };

  $('btnUndo').onclick = () => {
    if (undoAction) undoAction();
    undoAction = null; $('undoBar').hidden = true;
  };
  $('filter').onchange = e => { ui.filter = e.target.value; render(); };
  $('stats').onclick = e => {
    const s = e.target.closest('[data-filter]');
    if (!s) return;
    ui.filter = ui.filter === s.dataset.filter ? 'active' : s.dataset.filter;
    $('filter').value = ui.filter; render();
  };
  $('list').onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) {
      const row = e.target.closest('[data-row]');
      if (row) openDetails(row.dataset.row); // clicking anywhere else on the card opens the details
      return;
    }
    const inv = b.dataset.inv;
    switch (b.dataset.act) {
      case 'copy': copyText(inv); break;
      case 'period': setPeriod(inv, b.dataset.val); break;
      case 'details': openDetails(inv); break;
      case 'qr': openQr(inv, b.dataset.type); break;
    }
  };
}

applyI18n();
setupFilter();
bind();
pruneOld();
saveStore();
render();
// Diagnosis names arrive with icd10.js (deferred): redraw when ready, warn if missing
window.addEventListener('DOMContentLoaded', () => {
  $('icdBanner').hidden = !!window.ICD10;
  if (window.ICD10) render();
});
</script>
</body>
</html>
